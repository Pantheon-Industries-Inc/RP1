_target_: stable_worldmodel.solver.HLIPSolver
model: ???
batch_size: 1
num_samples: 300
var_scale: 1.0
n_steps: 0
topk: 30
ll_actor_path: ""         # low-level LIP checkpoint (kind lip4); required for ll=lip / hl_cutoff>0
hl_actor_path: ""         # high-level LIP checkpoint (train_lip_hl.py); required for hl=lip
hwm_path: ""              # HWM checkpoint; optional if the hl actor ckpt stores it
hl: lip                   # lip | cem
ll: lip                   # lip | cem
hl_cutoff: -1.0           # >0: bypass HL when value(z0, zg) < cutoff (env steps)
subgoal_index: 0          # which predicted waypoint becomes the LL goal (0 = first)
hl_horizon: 0             # macro plan length for hl=cem (hl=lip takes it from the ckpt)
hl_samples: 1024
hl_iters: 8
hl_lam: 0.01
hl_amax: 3.0
hl_cost: terminal         # terminal | last3 | all (cost mode for hl=cem)
ll_samples: 300
ll_iters: 30
ll_lam: 0.01
ll_amax: 3.5
subgoal_project: false    # snap subgoal to nearest real cache latent
project_pool: ""          # LatentCache path for projection pool (fs1)
subgoal_select: index     # index | reach (pick waypoint nearest reach_target by LL value)
reach_target: 30.0        # env-steps the LL comfortably covers per plan
device: "cuda"
seed: ${seed}
