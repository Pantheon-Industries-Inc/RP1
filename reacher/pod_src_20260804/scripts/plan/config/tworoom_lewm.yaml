defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/TwoRoom-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # set from eval_budget in eval_wm.py

seed: 42
policy: lewm_tworoom

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action

# evaluation from dataset (replay expert trajectories)
eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: tworoom_play.lance
  callables:
    # -- set state (agent position at start row)
    - method: _set_state
      args:
        state:
          value: state
    # -- set goal state (agent position at start+offset row)
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

output:
  filename: tworoom_lewm_results.txt
