name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          environments: dev
      - run: pixi lock --check
      - run: pixi run -e dev --platform linux-64 check
      - name: Build wheel and verify installed config discovery
        run: |
          pixi run -e dev python -m pip wheel --no-deps --wheel-dir dist .
          pixi run -e dev python -m venv --system-site-packages /tmp/rlp-wheel-smoke
          /tmp/rlp-wheel-smoke/bin/pip install --no-deps dist/rlp-*.whl
          cd /tmp
          /tmp/rlp-wheel-smoke/bin/python -c "from rlp.inference.evaluate import run; from rlp.utils.config import get_config_root; assert get_config_root().is_dir()"
