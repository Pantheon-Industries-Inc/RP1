defaults:
  - /utils/logging: default
  - _self_
  - benchmark: cube_lewm
entrypoint:
  _target_: rlp.inference.evaluate.run
runtime:
  seed: 42
  device: auto
  compile: false
  bfloat16: false
planning:
  horizon: 5
  receding_horizon: 5
  history_len: 1        # frames the policy stacks for the planner, one action block apart
                        # (3 = the WM's window: real pixels_hist + action_hist on replans;
                        # 1 = pre-E29 behaviour, the solver tiles the current frame)
  action_block: 5
  warm_start: true
  budget: 50
  deadline: null
benchmark:
  num_episodes: 50
  goal_offset_steps: 25
  image_size: 224
  train_resolution: null
  cross_wall: false
  episode_range: null
output:
  filename: results.txt
