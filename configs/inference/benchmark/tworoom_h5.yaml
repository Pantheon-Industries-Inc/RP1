# @package _global_
# TwoRoom evaluation on the authors' fetched pool
# (`pixi run prepare job=fetch_dataset preparation.dataset=tworoom`, 10,000 episodes).
#
# That h5 stores the agent position as `pos_agent`/`proprio` and carries no
# `state`/`goal_state` columns, which the collector-produced lance
# (`collect_tworoom_mixed`) does. The reset protocol is otherwise
# identical: place the agent at the start row's position and the goal at the
# row `goal_offset_steps` ahead (`_extract_init_goal` prefixes goal columns
# with `goal_`).
defaults:
  - tworoom
  - _self_
data:
  path: ${oc.env:RP1_DATA_HOME,${oc.env:HOME}/.cache/rp1}/datasets/tworoom/tworoom.h5
benchmark:
  callables:
    - method: _set_state
      args:
        state: {value: pos_agent}
    - method: _set_goal_state
      args:
        goal_state: {value: goal_pos_agent}
