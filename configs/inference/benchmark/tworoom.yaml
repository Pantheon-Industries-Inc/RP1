# @package _global_
defaults:
  - /environment: tworoom
  - /data: tworoom
  - /core/agent/policy: random
  - /core/agent/solver: cem
  - /core/agent/value: latent
  - _self_
benchmark:
  wall_center: 112.0
  # The LeWM/DINO-WM protocol: training and evaluation share the full pool.
  # For a held-out split, set episode_range="8000:10000" here and
  # training.train_episodes=8000 when training.
  episode_range: null
  callables:
    - method: _set_state
      args:
        state: {value: state}
    - method: _set_goal_state
      args:
        goal_state: {value: goal_state}
output:
  filename: tworoom_pixels_results.txt
