# @package _global_
# PushT evaluation root (replay protocol): start at a dataset row, goal = the
# state `goal_offset_steps` primitive steps later, budget 2x the offset.
# Success is the env's built-in DINO-WM criterion (agent+block position error
# < 20 px AND block angle error < 20 deg), checked by `swm/PushT-v1` itself.
defaults:
  - /environment: pusht
  - /data: pusht
  - /core/agent/policy: random
  - /core/agent/solver: cem
  - /core/agent/value: latent
  - _self_
benchmark:
  # held out: the agent trains on episodes 0-15999 (training.train_episodes=16000)
  episode_range: "16000:18685"
  callables:
    - method: _set_state
      args:
        state: {value: state}
    - method: _set_goal_state
      args:
        goal_state: {value: goal_state}
output:
  filename: pusht_results.txt
