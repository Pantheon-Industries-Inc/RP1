# Corrected RLP campaign protocol. Runtime asset paths are supplied as Hydra
# overrides; source behavior lives in src/rlp rather than dated snapshots.
campaign:
  name: rlp_20260811
  selection_seeds: [50, 51]
  report_seeds: [42, 43, 44]
  resources: {priority: p1, gpus: 4, cpus: 80, memory_gib: 920}

tworoom:
  bases: [lejepa, pldm]
  horizons:
    25: {max_delta: 5}
    100: {max_delta: 20}
  temporal_objective: tel-exact
  actor_only: true
  action_limits:
    lejepa: [1.8, 2.2, 2.6]
    pldm: [2.4, 2.8, 3.2]
  actor_learning_rates: [1e-4, 3e-4]
  mean_weight: 0.1
  replay_prob: 0.0
  expand_weight: 0.0
  steps: 6000
  batch: 128
  iterations: 8
  plan_horizon: 5
  receding_horizon: 1

reacher:
  bases: [lejepa, pldm]
  planner: cem
  cost_modes: [l2_window, metric]
  window_frames: 3
  window_lag: 5
  deadline: 50
  receding_horizon: 1
  evaluation:
    episode_range: 8000:10000
    goal_offset_steps: 25
    budget: 50

ogbench:
  bases: [lewm, pldm]
  horizons:
    25: {max_delta: 10}
    100: {max_delta: 20}
  temporal_objective: terminal
  action_limits: {lewm: 1.6, pldm: 4.5}
  mean_weight: 0.1
  actor_learning_rate: 3e-4
  actor_learning_rate_final: 3e-5
  replay_prob: 0.5
  expand_weight: 1.0
  freeze_critic_frac: 0.5
  steps: 6000
  batch: 256
  iterations: 8
  plan_horizon: 5
  receding_horizon: 5
  evaluation:
    episode_range: 8000:10000
