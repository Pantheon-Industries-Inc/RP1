# @package _global_
defaults:
  - /logging: default
  - _self_
entrypoint:
  _target_: rlp.eval.world_model._run
runtime:
  seed: 42
  device: auto
  compile: false
  bfloat16: false
planning:
  horizon: 5
  receding_horizon: 5
  action_block: 5
evaluation:
  num_episodes: 50
  goal_offset_steps: 25
  budget: 50
  image_size: 224
  train_resolution: null
  cross_wall: false
output:
  filename: results.txt
