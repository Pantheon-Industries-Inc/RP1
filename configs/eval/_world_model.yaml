# @package _global_
defaults:
  - /logging: default
  - _self_
entrypoint:
  _target_: rlp.eval.world_model._run
runtime:
  seed: 42
  device: auto
  compile: false
  bfloat16: false
planning:
  horizon: 5
  receding_horizon: 5
  history_len: 1        # WM history frames published at plan time (3 = the WM's window,
                        # one action block apart); 1 = the pre-E29 behaviour, padded
  action_block: 5
  warm_start: true
  deadline: null
evaluation:
  num_episodes: 50
  goal_offset_steps: 25
  budget: 50
  image_size: 224
  train_resolution: null
  cross_wall: false
  episode_range: null
output:
  filename: results.txt
