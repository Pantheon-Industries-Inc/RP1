# @package _global_
defaults:
  - _world_model
  - /environment: reacher
  - /data: reacher_eval
  - /core/policy: random
  - /core/solver: cem
  - /core/value: latent
  - _self_
planning:
  # Open loop, like every other environment: the full 5-chunk plan (25
  # primitive steps) executes before replanning. The paper appendix's
  # "replanning every chunk" for Reacher is WRONG — do not set this to 1.
  receding_horizon: 5
evaluation:
  # Held-out protocol (matches the rlp12 reacher_w1 campaign): value/planner
  # train on episodes 0-7999, eval tasks draw from 8000-9999.
  episode_range: "8000:10000"
  callables:
    - method: set_state
      args:
        qpos: {value: qpos}
        qvel: {value: qvel}
    - method: set_target_qpos
      args:
        target_qpos: {value: goal_qpos}
output:
  filename: reacher_results.txt
