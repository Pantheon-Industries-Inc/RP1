# @package _global_
# TwoRoom evaluation with a world-model planner (LeWM/PLDM checkpoint layout).
# The TwoRoom checkpoints are environment-specific and not shipped in-tree, so
# the checkpoint must be supplied explicitly:
#   pixi run eval model=tworoom_lewm core.world_model.checkpoint=<ckpt> \
#       core/solver=lip core.solver.actor_path=<planner.pt>
defaults:
  - tworoom_pixels
  - /core/world_model: lewm
  - override /core/policy: world_model
  - _self_
core:
  world_model:
    checkpoint: ???
