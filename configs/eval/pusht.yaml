# @package _global_
defaults:
  - _world_model
  - /environment: pusht
  - /data: pusht_eval
  - /core/policy: random
  - /core/solver: cem
  - /core/value: latent
  - _self_
evaluation:
  callables:
    - method: _set_state
      args:
        state: {value: state}
    - method: _set_goal_state
      args:
        goal_state: {value: goal_state}
output:
  filename: pusht_results.txt
