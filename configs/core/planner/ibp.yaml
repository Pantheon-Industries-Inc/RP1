# @package core.planner
# Imagination-Based Planner architecture (arXiv:1707.06170 Sec. 3 and the
# "Model, controller, memory and manager" implementation notes).
horizon: 5             # plan blocks, must match the world model's frameskip cadence
hidden: 256            # MLP width for the controller, manager and node encoder
memory: 256            # LSTM plan-context width (the paper's memory mu)
action_limit: 2.5      # plan clip, the repository's amax
max_imagine: 10        # imagination budget per decision (the paper varies 1-6 on
                       # the spaceship task, 4-8 on 7x7 mazes; a chain must reach
                       # horizon=5, so the budget must exceed it to allow a tree)
tau: 0.02              # resource cost per imagination step, in critic units --
                       # IBP's "plan economically" term (paper: fuel cost 2e-4/4e-4)
init_scale: 0.01       # last-layer init N(0, init_scale)
