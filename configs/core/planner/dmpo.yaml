# @package core.planner
# DMPO learned-optimizer architecture (arXiv:2310.04590 Sec. IV; reference
# hyperparameters from config/experiments/quadrotor_dmpo_zigzagyaw.yml).
horizon: 5             # plan blocks, must match the world model's frameskip cadence
iterations: 1          # inner-loop iterations per decision (reference: 1)
num_samples: 256       # particles per iteration; fixes the actor's input width
hidden: 256            # single hidden layer, ReLU (reference actor_params)
action_limit: 2.5      # plan clip, the repository's amax
init_std: 1.0          # initial sampling covariance (diagonal)
temperature: 0.05      # MPPI temperature of the update the actor residuals on
step_size: 0.8         # MPPI dynamic-mirror-descent step size
scale_costs: true      # min-max scale costs before the MPPI softmax
gated: true            # gating term interpolating MPPI and learned means
residual: true         # learn a residual on the MPPI update (vs. on the plan)
learn_std: true        # multiplicative learned covariance update
use_shift: true        # learned warm-start (shift) model
gate_activation: tanh  # reference code; the paper describes sigmoid
init_scale: 0.001      # last-layer init N(0, init_scale) -> near-zero residual
mean_search_std: 0.1   # on-policy search width over the mean (PPO objective only)
std_search_std: 0.01   # on-policy search width over the covariance
halton: true           # fixed quasi-random sample set
seed_val: 0            # sample-set seed (recorded in the checkpoint)
