# @package core.solver
# Hierarchical CEM: macro search through the high-level WM (F2), scored by a
# MACRO-LEVEL quasimetric; the low level plans primitive blocks toward the
# first predicted waypoint. See src/rlp/core/solver/hlip.py for why this
# configuration is new (the old hierarchical CEM scored raw latent MSE and the
# only high-level value in the stack was an env-step critic).
_target_: rlp.core.solver.HierarchicalCEMSolver
batch_size: 1
num_samples: 300      # low-level default; ll_samples overrides
var_scale: 1.0
n_steps: 30           # low-level CEM iterations; ll_iters overrides
topk: 30
# NOTE: no `lam` here -- that is a LIPSolver argument; swm's CEMSolver takes
# only (model, batch_size, num_samples, var_scale, n_steps, topk, device,
# seed, callbacks). The softmax temperatures live in hl_lam / ll_lam below.

hl_dynamics: f2       # f2 | compose. `compose` rolls the LOW-LEVEL WM over real
                      # action chunks instead of predicting with F2: FIG6 measured
                      # F2 as worse than that at every horizon (l1 0.42 vs 0.37 at
                      # 200 env steps) with the floor set by the 125->8-D macro
                      # bottleneck, so `compose` removes the bottleneck entirely.
hwm_path: ""          # required for hl_dynamics=f2
bank_path: ""         # required for hl_dynamics=compose (build_chunk_bank.py)
oracle_subgoal: false # diagnostic: replace the high level with the TRUE future
                      # latent one macro ahead (Hi-LeWM's oracle test). Isolates
                      # subgoal GENERATION from low-level execution.
cache_path: ""        # fs1 LatentCache, required when oracle_subgoal=true
hl_value_path: ""     # scripts/hierarchy/train_hl_value.py directory
hl_cost: value        # value | latent (latent = the old behaviour)
hl_opt: cem           # cem | adam. `adam` backprops through F2 + the value
                      # instead of sampling; defaults below are the 2026-08-16
                      # Adam-sweep optimum (lr 0.1 / 30 steps; lr >= 0.3 harmful)
hl_lr: 0.1
hl_adam_steps: 30
hl_horizon: 8         # macro steps; x stride 25 = 200 primitive steps
hl_samples: 512
hl_iters: 8
hl_lam: 0.01         # softmax temperature; only used when hl_topk <= 0
hl_topk: 0           # >0 = hard-elite CEM (swm CEMSolver's rule); 0 -> 10% of
                     # hl_samples. The softmax branch is LIP's rule and is
                     # DEGENERATE here: at lam 0.01 on a raw latent/macro-step
                     # cost the weights go one-hot on iteration 1 and the
                     # variance collapses to the 0.05 floor. Keep top-k so the
                     # optimizer is identical to the flat CEM baseline.
hl_amax: 3.0
ll_samples: null
ll_iters: null
ll_lam: 0.01         # see hl_lam
ll_topk: 0           # 0 -> 10% of ll_samples, i.e. the baseline's 30-of-300
ll_clamp: false      # swm's CEMSolver does not clamp candidates; match it
ll_amax: 3.5
subgoal_index: 0
