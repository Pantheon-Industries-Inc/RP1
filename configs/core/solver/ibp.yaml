# @package core.solver
# IBP (Pascanu et al., 2017): learned manager + controller over an imagination
# tree. `num_samples`/`n_steps`/`topk`/`var_scale` are inherited from the CEM
# base class and unused -- the budget is `max_imagine` one-block unrolls plus
# the greedy completion of the committed chain, no backward pass.
_target_: rlp.core.solver.IBPSolver
batch_size: 1
num_samples: 1  # unused; IBP does not sample plan populations
var_scale: 1.0
n_steps: 0
topk: 30
actor_path: ???
value_path: null  # override the value recorded in the IBP checkpoint
max_imagine: null  # imagination budget; null = the trained budget
sample_routes: false  # greedy manager at deploy; true = the training-time stochastic manager
