# @package core.solver
# L2O-MPC (Sacks & Boots, ICRA 2022): fully learned MPC inner loop. Sample
# count and horizon are fixed by the trained checkpoint; `n_steps`/`topk`/
# `var_scale` are inherited from the CEM base class and unused. Rollout budget
# per decision is num_samples x iters forward unrolls (64 x 4 = 256 by
# default, matching DMPO), no backward pass.
_target_: rlp.core.solver.L2OSolver
batch_size: 1
num_samples: 64  # informational; the checkpoint's sample count wins
var_scale: 1.0
n_steps: 0
topk: 30
actor_path: ???
value_path: null  # override the value recorded in the L2O checkpoint
iters: null  # inner-loop iterations; null = the trained count
cost_chunk: 0  # rollout chunk size for the sampled plans; 0 = one batch
