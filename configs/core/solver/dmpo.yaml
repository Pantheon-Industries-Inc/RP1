# @package core.solver
# DMPO (Sacks et al., ICRA 2024): learned MPC inner loop. Sample count and
# horizon are fixed by the trained checkpoint; `n_steps`/`topk`/`var_scale` are
# inherited from the CEM base class and unused. Rollout budget per decision is
# num_samples x iters forward unrolls (256 by default), no backward pass.
_target_: rlp.core.agent.solver.DMPOSolver
batch_size: 1
num_samples: 256  # informational; the checkpoint's sample count wins
var_scale: 1.0
n_steps: 0
topk: 30
checkpoint:
  _target_: rlp.training.harness.checkpointing.load_planner
  path: ???
  value_path: null  # override the value recorded in the checkpoint
iters: null  # inner-loop iterations; null = the trained count
mppi_mode: false  # bypass the learned heads (the hand-written update DMPO residuals on)
cost_chunk: 0  # rollout chunk size for the sampled plans; 0 = one batch
report_cost: false  # true adds one rollout per decision to score the final mean (diagnostic only)
graphed: false  # CUDA-graph the sampled-cost evaluation (true | "verify"); needs a static batch
