# @package _global_
defaults:
  - /core/planner: lip
  - /core/value: temporal_distance
  - /logging: default
  - _self_
entrypoint: {_target_: rlp.train.lip_ac._run}
cache: ???
cache_td: null
near_frac: 0.0        # fraction of in-episode critic goals drawn 1..near_max steps ahead
near_max: 3
h5: ???
wm: ???
init_value: null
cache_mmap: true
output:
  planner_checkpoint: planner.pt
  value_checkpoint: value
steps: 8000
batch: 128
ckpt_every: 0         # save a deployable planner snapshot every N steps (0 = off)
window_lag: null      # primitive-step frame spacing of a windowed init_value
                      # teacher (null = the action block); must equal the
                      # frameskip so deployed windows match trained ones
max_delta: 10
p_cross: 0.3
actor_lr: 3e-4
actor_lr_final: null
mean_weight: 0.1
ac_weight: 0.0        # anti-constancy regularizer weight (0 = off)
expectile: 0.1
expectile_final: null
n_step: 25
gamma: 1.0
td_batch: 1024
td_p_cross: 0.3
td_max_delta: null
critic_lr: 1e-3
critic_lr_final: null
critic_wd: 1e-4
huber_beta: 1.0
pretrain: -1
critic_ratio: 1
ema_tau: 0.005
freeze_critic_frac: 0.8
actor_only: false
temporal_objective: terminal
reuse_refinement_rollouts: true  # reuse the scoring rollout as the next gradient rollout (default since 2026-08-12)
expand_weight: 0.0
expand_traj: false  # reuse the actor's final rollout as per-block TD backups (needs expand_weight > 0)
replay_prob: 0.0
seed: 0
action_stats_pin: null
