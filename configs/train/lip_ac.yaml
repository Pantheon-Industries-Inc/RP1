# @package _global_
defaults:
  - /core/planner: lip
  - /core/value: temporal_distance
  - /logging: default
  - _self_
entrypoint: {_target_: rlp.train.lip_ac._run}
cache: ???
cache_td: null
near_frac: 0.0        # fraction of in-episode critic goals drawn 1..near_max steps ahead
near_max: 3
max_episodes: null    # data-volume ablation: train on episodes [0, N) of the cache (null = all)
h5: ???
wm: ???
init_value: null
cache_mmap: true
output:
  planner_checkpoint: planner.pt
  value_checkpoint: value
steps: 8000
batch: 128
ckpt_every: 0         # save a deployable planner snapshot every N steps (0 = off)
window_lag: null      # primitive-step frame spacing of a windowed init_value
                      # teacher (null = the action block); must equal the
                      # frameskip so deployed windows match trained ones
max_delta: 10
p_cross: 0.3
band_mix: null        # comma list of deployment-horizon bands in blocks (e.g. "6,21"): band drawn uniformly, offset uniform within it
actor_lr: 3e-4
actor_lr_final: null
mean_weight: 0.1
ac_weight: 0.0        # anti-constancy regularizer weight (0 = off)
expectile: 0.1
expectile_final: null
n_step: 25
gamma: 1.0
td_batch: 1024
td_p_cross: 0.3
td_max_delta: null
critic_lr: 1e-3
critic_lr_final: null
critic_wd: 1e-4
huber_beta: 1.0
pretrain: -1
critic_ratio: 1
ema_tau: 0.005
freeze_critic_frac: 0.8
actor_only: false
temporal_objective: terminal
reuse_refinement_rollouts: true  # reuse the scoring rollout as the next gradient rollout (default since 2026-08-12)
expand_weight: 0.0
expand_traj: false  # reuse the actor's final rollout as per-block TD backups (needs expand_weight > 0)
replay_prob: 0.0
seed: 0
action_stats_pin: null
# Physics grounding of the energy (PushT; rlp.core.grounding). Adds to the
# refiner's training energy -- and, via the checkpoint, to the deployed one --
# a penalty on imagined block displacement in blocks before the agent's
# commanded path first comes within contact distance of the decoded T. Needs
# the dataset h5 (its `state` column) to fit the latent->state probe and to
# calibrate the contact margin / dead zone; null thresholds are calibrated.
grounding: null           # null | pusht
state_h5: null            # dataset h5 with `state` (agent xy, block xy, angle) rows aligned to cache_td
ground_weight: 1.0        # energy units per (unsupported displacement / ground_ref)^2
ground_margin: null       # px; null = calibrated so >= ground_quantile of real pushes register contact
ground_tau: 5.0           # px; softness of the contact test
ground_ref: 10.0          # px; displacement scale of the quadratic penalty
ground_deadzone: null     # px; null = ground_quantile of decoded displacement on static blocks (probe noise)
ground_quantile: 0.95
