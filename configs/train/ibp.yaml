# @package _global_
# IBP baseline (arXiv:1707.06170): train the manager, controller and memory
# against a frozen critic through the frozen world model. The world model
# replaces the paper's learned interaction network and is never updated.
# See docs/ibp/README_ibp.md.
defaults:
  - /core/planner: ibp
  - /core/value: temporal_distance
  - /logging: default
  - _self_
entrypoint: {_target_: rlp.train.ibp._run}
wm: ???            # frozen pretrained world model (LeWM/PLDM layout)
cache: ???         # frameskip-matched (fs5) latent cache
h5: ???            # action-only h5 produced by tools/build_action_h5
init_value: ???    # frozen quasimetric critic (value_td) -- IBP never updates it
cache_mmap: true
output:
  planner_checkpoint: ibp.pt
  value_checkpoint: value
steps: 2000
batch: 32
frameskip: 5
max_delta: 10
p_cross: 0.3
actor_lr: 3e-4         # paper: controller 3e-4
actor_lr_final: 3e-5
manager_lr: 1e-4       # paper: manager 1e-4
weight_decay: 1e-5
max_grad_norm: 10.0    # paper: gradient clipping at norm 10
entropy_weight: 0.01   # the paper's manager entropy regularization
baseline_decay: 0.99   # moving-average REINFORCE baseline
device: auto
seed: 0
