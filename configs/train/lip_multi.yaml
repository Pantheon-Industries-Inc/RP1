# @package _global_
# One refiner, several frozen (world model, critic) pairs -- see
# src/rlp/train/lip_multi.py. Each source declares its own world model, fs5
# latent cache, action h5 and frozen critic; only the update rule is shared.
defaults:
  - /core/planner: lip
  - /logging: default
  - _self_
entrypoint: {_target_: rlp.train.lip_multi._run}
sources: ???     # list of {name, wm, cache, h5, value[, horizon][, max_delta]}
arch: v4         # v4 (flat MLP, one plan shape only) | traj (tokenised, required when shapes differ)
steps: 6000
batch: 128
iters: 8
amax: 2.5
max_delta: 20    # default cap; a source may override it (episode length is per-env)
p_cross: 0.3
mean_weight: 0.1
ac_weight: 0.5
actor_lr: 3e-4
actor_lr_final: 3e-5
width: 512
layers: 2
temporal_objective: terminal
device: auto
seed: 0
