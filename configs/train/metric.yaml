# @package _global_
defaults:
  - /core/value: temporal_distance
  - /logging: default
  - _self_
entrypoint: {_target_: rlp.train.metric._run}
cache: ???
cache_mmap: true
window_frames: 1
window_lag: 1
aug_cache: null        # td: row-aligned agent-displaced cache (counterfactual augmentation)
aug_p: 0.0             # fraction of TD queries swapped for their displaced-agent latent
aug_transit_scale: 1.0 # label = d + aug_transit_scale * transit steps
state_cache: null      # td: logged env state row-aligned with the cache (tools/cache_state)
tol_relabel: false     # td: Monte-Carlo target = first entry into the goal's success set
tol:                   # success-set test, env eval_state semantics (PushT defaults:
  pos_dims: [0, 1, 2, 3]   #   joint agent+block position error < 20 px,
  pos: 20.0                #   raw block-angle difference < 20 deg)
  angle_dim: 4
  angle: 0.3490658503988659
near_frac: 0.0         # td: fraction of in-episode hindsight goals drawn 1..near_max steps ahead
near_max: 3
learner: td
output:
  checkpoint: value
steps: 5000
batch_size: 1024
scale: null
max_delta: null
labels: "true"
gamma: 1.0
expectile: 0.7
n_step: 5
p_cross: 0.3
no_balanced: false
temperature: 1.0
device: auto
seed: 0
