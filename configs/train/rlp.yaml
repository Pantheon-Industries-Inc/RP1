# @package _global_
# Composed RLP replication pipeline: latent caches -> offline value -> planner.
# Stage defaults are **config B** (docs/campaigns/2026-08-27/HANDOFF_CONFIGS_20260903.md):
# gamma 0.98, teacher n-step 1, expectile 0.03, amax 2.5, max-delta 20, K 8,
# depth 2 at 1x budgets, acr 0.5, fine ES, ema 0.005 -- the single recipe that
# covers TwoRoom, Cube, Reacher and PushT. Per-environment properties that
# config B does not unify (window frames, step budgets, replay_prob,
# expand_weight) are overridden through the value.* / planner.* subtrees; see
# docs/replication/REPLICATION_RLP.md.
defaults:
  - /logging: default
  - _self_
entrypoint: {_target_: rlp.train.rlp._run}
wm: ???            # frozen pretrained world-model checkpoint (LeWM/PLDM layout)
dataset: ???       # offline lance dataset of logged episodes
name: rlp          # artifact prefix inside cache_directory
frameskip: 5       # env steps per planned action block
actor_phases: 1    # residue classes of the stride kept in the actor's fs5 cache
                   # (frameskip = all: 5x the block-aligned start states from the
                   # same episodes, no re-encode; the teacher is unaffected)
state_key: null    # optional ground-truth state column cached for diagnostics
train_episodes: 8000  # value/planner train on episodes [0, N); eval draws the rest (paper split)
train_res: null
cache_directory: ${oc.env:RLP_DATA_HOME,${oc.env:HOME}/.cache/rlp}/caches
skip: []           # stages to skip, e.g. skip=[cache,subsample,actions]
device: auto
seed: 0

# Stage 4 -- offline quasimetric critic (train/metric, learner=td).
# Keys are forwarded verbatim onto configs/train/metric.yaml.
value:
  learner: td           # `l2` makes the deployed critic the parameter-free latent
                        # distance: the refiner then descends exactly CEM's objective
  steps: 12000
  batch_size: 1024
  gamma: 0.98
  expectile: 0.03
  n_step: 1
  p_cross: 0.3
  depth: null           # MRN value-head depth (null = core default 2)
  window_frames: null   # m-frame window teacher (null = single frame); the
                        # planner stage inherits the window automatically
  window_lag: null      # window frame spacing in primitive steps; required
                        # (= frameskip) whenever window_frames >= 2
  near_frac: null       # near-goal hindsight oversampling fraction
  near_max: null
  max_episodes: null    # data-volume ablation: cap the critic's episodes without re-encoding

# Stage 5 -- RLP plan refiner (train/lip_ac, actor-critic tandem).
# Keys are forwarded verbatim onto configs/train/lip_ac.yaml.
planner:
  steps: 6000
  batch: 256
  actor_lr: 3e-4
  actor_lr_final: 3e-5
  mean_weight: 0.1
  max_delta: 20
  p_cross: 0.3
  replay_prob: 0.5
  gamma: 0.98
  n_step: 50
  expectile: 0.1
  expectile_final: 0.03
  ac_weight: 0.5        # anti-constancy regularizer (forwarded to lip_ac)
  layers: null          # refiner transformer_layers (null = core default 2)
  width: null           # refiner transformer_width (null = core default 256)
  critic_lr: 1e-3
  critic_lr_final: 1e-4
  td_batch: 1024
  freeze_critic_frac: 0.5   # critic live for the first 3,000 of 6,000 steps
  expand_weight: 1.0        # value expansion on planner rollouts (cube/pusht; set 0 on tworoom/reacher)
  temporal_objective: terminal
  amax: 2.5   # residual clip range
  iterations: null  # refinement iterations K (null = the planner group's
                    # LIPv4 default, 8); trained unrolled, so eval matches
                    # automatically via the checkpoint
  ckpt_every: null  # save a deployable planner snapshot every N steps so a
                    # selection pass can early-stop on held-out success
                    # (null/0 = off; forwarded to train/lip_ac)
  near_frac: null   # co-critic near-goal hindsight oversampling
  near_max: null
  max_episodes: null # data-volume ablation: cap the actor's episodes without re-encoding
