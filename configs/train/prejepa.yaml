# @package _global_
defaults:
  - /data: ogb_cube_prejepa
  - /core/world_model: prejepa
  - /logging: default
  - _self_
entrypoint:
  _target_: rlp.train.prejepa._run
runtime:
  seed: 42
  device: auto
train:
  optimizer:
    type: AdamW
    lr: 5e-4
    weight_decay: 0.0
  trainer:
    max_epochs: 10
    max_steps: 100000
    strategy: auto
    devices: auto
    accelerator: auto
    precision: bf16-mixed
    gradient_clip_val: 1.0
output:
  model_name: prejepa_cube
  save_every_steps: 10000
