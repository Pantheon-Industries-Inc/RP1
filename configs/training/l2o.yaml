# @package _global_
# L2O-MPC baseline (arXiv:2212.02603): DAgger-imitate a many-sample MPPI
# expert through the frozen world model and frozen critic.
# See docs/l2o/README_l2o.md.
defaults:
  - /core/planner: l2o
  - /core/value: temporal_distance
  - /utils/logging: default
  - _self_
entrypoint: {_target_: rlp.training.l2o._run}
runtime:
  device: auto
  seed: 0
training:
  wm: ???            # frozen pretrained world model (LeWM/PLDM layout)
  cache: ???         # frameskip-matched (fs5) latent cache
  h5: ???            # action-only h5 produced by build_action_h5
  init_value: ???    # frozen quasimetric critic (value_td) -- L2O never updates it
  cache_mmap: true
  steps: 2000
  batch: 16
  frameskip: 5
  max_delta: 10
  p_cross: 0.3
  actor_lr: 1e-3         # paper: Adam 1e-3 (1e-4 on its hardest task)
  actor_lr_final: 1e-4
  weight_decay: 0.0      # the paper reports plain Adam
  max_grad_norm: 10.0
  dagger_rounds: 20      # paper: 20 DAgger iterations
  beta_decay: 0.8        # paper: beta_k = 0.8^k
  temporal_objective: terminal
  cost_chunk: 0          # rollout chunk for the sampled plans; 0 = one batch
output:
  planner_checkpoint: l2o.pt
  value_checkpoint: value
