# @package _global_
defaults:
  - /core/agent/planner: rp1
  - /core/agent/value: temporal_distance
  - /utils/logging: default
  - _self_
entrypoint: {_target_: rp1.training.phases.agent.rp1_ac.run}
runtime:
  device: auto
  seed: 0
training:
  cache: ???
  cache_td: null
  near_frac: 0.0        # fraction of in-episode critic goals drawn 1..near_max steps ahead
  near_max: 3
  max_episodes: null    # train on source episodes [0, N) of both caches
  h5: ???
  wm: ???
  init_value: null
  cache_mmap: true
  steps: 8000
  batch: 128
  ckpt_every: 0         # save a deployable planner snapshot every N steps (0 = off)
  window_lag: null      # primitive-step frame spacing of a windowed init_value
                        # teacher (null = the action block); must equal the
                        # frameskip so deployed windows match trained ones
  frameskip: 5
  max_delta: 10
  band_mix: null        # goal bands in blocks, e.g. [6, 21]: a band drawn uniformly, then an offset within it
  p_cross: 0.3
  actor_lr: 3e-4
  actor_weight_decay: 1e-5
  actor_lr_final: null
  mean_weight: 0.1
  ac_weight: 0.0        # anti-constancy regularizer weight (0 = off)
  expectile: 0.1
  expectile_final: null
  n_step: 25
  gamma: 1.0
  td_batch: 1024
  td_p_cross: 0.3
  td_max_delta: null
  td_n_buckets: 10
  critic_lr: 1e-3
  critic_lr_final: null
  critic_wd: 1e-4
  huber_beta: 1.0
  pretrain: -1
  critic_ratio: 1
  ema_tau: 0.005
  freeze_critic_frac: 0.8
  actor_only: false
  temporal_objective: terminal
  reuse_refinement_rollouts: true
  expand_weight: 0.0
  expand_traj: false
  replay_prob: 0.0
  action_stats: null
  # physics grounding of the energy (PushT); null thresholds are calibrated on the data
  grounding: null       # null | pusht
  state_h5: null        # dataset h5 whose `state` rows align with cache_td
  ground_weight: 1.0    # energy per (unsupported block displacement / ground_ref)^2
  ground_margin: null   # px of closest approach that still counts as contact
  ground_tau: 5.0       # px; softness of the contact test
  ground_ref: 10.0      # px
  ground_deadzone: null # px of decoded displacement below which a block counts as static
  ground_quantile: 0.95
output:
  planner_checkpoint: planner.pt
  value_checkpoint: value
