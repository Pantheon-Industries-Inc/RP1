# @package _global_
# Offline DMPO: the paper's PPO objective closed inside the frozen world model
# (no environment interaction). See docs/dmpo/README_dmpo.md.
defaults:
  - /core/agent/planner: dmpo
  - /core/agent/value: temporal_distance
  - /utils/logging: default
  - _self_
entrypoint: {_target_: rlp.training.phases.agent.dmpo_ppo.run}
runtime:
  device: auto
  seed: 0
training:
  wm: ???            # frozen pretrained world model (LeWM/PLDM layout)
  cache: ???         # frameskip-matched (fs5) latent cache
  h5: ???            # action-only h5 produced by build_action_h5
  init_value: ???    # frozen quasimetric critic (value_td): reward and plan cost
  cache_mmap: true
  ppo_iterations: 400    # policy-improvement rounds (reference: ~1000 on-system)
  batch: 16              # imagined problems per round
  decisions: 4           # closed-loop decisions per imagined episode
  receding: 5            # plan blocks executed per decision (the eval protocol)
  frameskip: 5
  max_delta: 10
  p_cross: 0.3
  gamma: 0.99            # reference PPO discount
  gae_lambda: 0.95       # reference GAE parameter
  clip_epsilon: 0.2      # reference clipped ratio
  entropy_penalty: 0.0   # reference
  ppo_epochs: 4
  minibatch: 32
  actor_lr: 1e-5         # reference used 1e-6 with far more on-system data
  critic_lr: 1e-4        # reference
  critic_hidden: 1024    # reference critic width
  max_grad_norm: 1.0
  cost_chunk: 0
output:
  planner_checkpoint: dmpo.pt
  value_checkpoint: value
