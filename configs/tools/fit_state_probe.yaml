# @package _global_
# Ridge probe latent -> [agent xy, block xy, cos/sin angle] for the
# contact-consistency penalty (rlp.core.value.contact).
defaults:
  - /logging: default
  - _self_
entrypoint: {_target_: rlp.tools.data.fit_state_probe._run}
cache: ???          # frozen-latent cache (fs1)
state_cache: ???    # row-aligned logged state (tools/cache_state)
out: ???
max_rows: 200000
ridge: 1.0
seed: 0
# contact calibration: transitions whose block pose changes by more than
# move_eps px (rotation counted at angle_scale px per radian) define the
# separations at which the expert can move the block
move_eps: 15.0
angle_scale: 40.0
