[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "rlp"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    # stable-pretraining leaves this unconstrained; datasets 1.x imports the
    # removed pyarrow.PyExtensionType API and cannot instantiate LeWM.
    "datasets>=4.0",
    "h5py>=3.16",
    "huggingface-hub>=1.26",
    "hydra-core>=1.3.2",
    "imageio>=2.37",
    "lightning>=2.6",
    "loguru>=0.7",
    "numpy>=2.3",
    "pillow>=11",
    "pylance>=9",
    "scikit-learn>=1.7",
    "stable-pretraining==0.1.7",
    # The upstream `format` extra includes `decord`, which publishes no macOS
    # ARM wheel. Format/campaign dependencies are opt-in below.
    "stable-worldmodel[train]==0.1.1",
    "tabulate>=0.9",
    "torch==2.7.1",
    "torchmetrics>=1.9",
    "torchvision==0.22.1",
    "tqdm>=4.67",
    # tar.zst dataset archives (tworoom/reacher) in tools/data/fetch_dataset.py
    "zstandard>=0.23",
]

[project.optional-dependencies]
# Broader upstream environments and the decord video backend are opt-in: their
# transitive native packages do not currently ship Python 3.13 macOS ARM wheels.
all-envs = ["stable-worldmodel[env]==0.1.1"]
campaign = [
    "imageio-ffmpeg>=0.6",
    "ogbench>=1.2",
    "opencv-python-headless>=4.12",
    "pygame>=2.6",
    "pymunk>=7.2",
    "shapely>=2.1",
]
data = ["hdf5plugin>=6.0"]
decord = ["decord>=0.6; platform_system != 'Darwin'"]
dev = [
    "mypy>=2.1",
    "pre-commit>=4.6",
    "pytest>=9",
    "pytest-cov>=7.1",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.8",
    "ruff>=0.15.16",
]

[project.scripts]
rlp-train = "rlp.__main__:run"
rlp-eval = "rlp.eval.__main__:run"
rlp-tool = "rlp.tools.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["src/rlp"]

[tool.hatch.build.targets.wheel.shared-data]
"configs" = "share/rlp/configs"

[tool.hatch.build.targets.sdist]
include = ["/src/rlp", "/configs", "/tests", "/README.md", "/pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PTH", "BLE", "T10", "RUF001", "RUF002", "RUF003"]
ignore = [
    "E741",  # ambiguous variable names
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
disallow_subclassing_any = false  # Required for subclassing intentionally untyped dependency classes.
warn_unused_configs = true
warn_unreachable = true
warn_unused_ignores = true
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
