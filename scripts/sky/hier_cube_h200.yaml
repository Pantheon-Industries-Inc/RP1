# Hierarchical CEM + macro-level value on OGBench cube, at h200.
#
#   sky jobs launch scripts/sky/hier_cube_h200.yaml -n hier-h200 \
#       --priority p1 --env EXPERIMENT_TAG=hier-h200-$(date +%Y%m%d) -y
#
# THE QUESTION. RESULTS_hwm.md F7 read the h200 floor (flat LIPv4 1.3, flat
# latent+CEM 2.0, every hierarchy variant 1.3-2.0) as a DATA-SUPPORT boundary:
# cube episodes are 201 primitive steps, so "no trajectory demonstrates a
# 200-step task and no in-episode value pair spans it".
#
# That is true in env-step units and false in macro units. At stride 25 a cube
# episode is 9 waypoints, so a 200-step goal is a distance-8 query present
# in-episode in EVERY episode. Measured 2026-09-19 (hlvalue-cube2): a
# macro-level quasimetric reaches corr(V, delta) 0.84-0.89 across that span
# with V(g,g)=0 exactly, where the env-step control reached ~0.70 over the span
# it must cover. So the value CAN represent h200 distances; this job asks
# whether a planner converts that into success.
#
# ARMS (all on the same task draw, same budget, same success test):
#   hier_value   hierarchical CEM, high level scored by the MACRO value  <- new
#   hier_latent  identical, high level scored by terminal latent MSE     <- the
#                behaviour the old hierarchical CEM actually had; isolates the
#                value from the hierarchy
#   cem          flat latent+CEM, the F7 reference (2.0 at h200)
# h25 runs first as a sanity rung: a hierarchy that cannot do h25 is broken,
# not informative.

name: hier-h200

envs:
  PANTHEON_USER: armin@pantheon.inc
  EXPERIMENT_TAG: hier-h200
  OUT_ROOT: /newcheckpoints

  OFFSETS: "25 200"        # budget is 2x offset, as everywhere else in the stack
  ARMS: "cem hier_latent hier_value hier_compose"
  BANK_CHUNKS: "4096"
  EVAL_SEEDS: "42 43 44"
  NUM_EPISODES: "50"
  TRAIN_EPISODES: "8000"   # held-out: eval draws 8000-9999

  STRIDE: "25"
  MACRO_DIM: "32"          # 2026-09-19: 8 was inherited from the old campaign and
                           # is the 125->8 bottleneck FIG6 blamed for F2's error
                           # floor; Hi-LeWM uses 32
  HWM_BATCH: "256"
  HL_HORIZON: "8"          # x stride 25 = 200 primitive steps
  HWM_STEPS: "6000"
  VALUE_STEPS: "6000"
  VALUE_TAU_FINAL: "0.2"   # 2026-09-19 sweep: 0.2 > 0.09 > 0.03 on corr(V,delta)
  HL_SAMPLES: "512"
  HL_LR: "0.1"             # Adam-sweep optimum (2026-08-16); >= 0.3 harmful
  HL_ADAM_STEPS: "30"
  HL_ITERS: "8"

  SMOKE: "0"               # 1 = 4 episodes, tiny CEM, one seed, h25 only
  WAIT_ART_MIN: "0"        # >0: wait this many minutes for a sibling job (same
                           # EXPERIMENT_TAG) to finish training F2 / the macro
                           # value instead of training a second copy over it

resources:
  accelerators: H200:1
  cpus: 8
  memory: 90
  image_id: docker:pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel
  labels:
    telemetry-contract: opt-out
    telemetry-opt-out-reason: replication-validation

volumes:
  /checkpoints: checkpoints
  /newcheckpoints: armin-rlp-checkpoints

workdir: .

setup: |
  set -euo pipefail
  sudo apt-get update -qq >/dev/null 2>&1 || apt-get update -qq
  (sudo apt-get install -yqq curl git libegl1 libgl1 libosmesa6 >/dev/null 2>&1 \
    || apt-get install -yqq curl git libegl1 libgl1 libosmesa6 >/dev/null)
  curl -fsSL https://pixi.sh/install.sh | bash
  export PATH=$HOME/.pixi/bin:$PATH
  cd ~/sky_workdir
  pixi install -e default

run: |
  set -euo pipefail
  export PATH=$HOME/.pixi/bin:$PATH
  cd ~/sky_workdir
  export LD_LIBRARY_PATH=$PWD/.pixi/envs/default/lib:${LD_LIBRARY_PATH:-}
  export MUJOCO_GL=egl MUJOCO_EGL_DEVICE_ID=0
  export RLP_DATA_HOME=/tmp/rlp-data
  mkdir -p "$RLP_DATA_HOME"

  D=${OUT_ROOT}/$PANTHEON_USER/$EXPERIMENT_TAG
  mkdir -p "$D" && chmod 777 "$D"
  CD=${OUT_ROOT}/$PANTHEON_USER/hlvalue-caches      # shared with the hlvalue job
  mkdir -p "$CD"
  WM=assets/core/world_model/lewm_cube
  CACHE=$CD/cube_v2wm_fs1.pt
  ACTH5=$CD/cube_actions.h5

  pixi run tool tool=fetch_dataset dataset=ogb_cube
  DS=$(find "$RLP_DATA_HOME/datasets" -maxdepth 1 -name 'ogb_cube_single*' | head -1)
  [ -n "$DS" ] || { echo "cube dataset missing" >&2; exit 1; }

  # ---- fs1 latent cache (built by hlvalue-cube; ~25 min if absent)
  [ -s "$CACHE" ] || pixi run tool tool=cache_latents wm="$WM" dataset="$DS" out="$CACHE"
  # ---- primitive actions, aligned to the cache by episode offset
  [ -s "$ACTH5" ] || pixi run tool tool=build_action_h5 dataset="$DS" output="$ACTH5"
  ls -la "$CACHE" "$ACTH5"

  SM_STEPS=""; [ "$SMOKE" = 1 ] && SM_STEPS="--steps 200"

  # ---- F2: the high-level WM. horizon 8 x stride 25 = 200 primitive steps,
  # which Hi-LeWM's released cube high level cannot reach (5 x max_span 15 = 75).
  HWM=$D/hwm_s${STRIDE}m${MACRO_DIM}.pt
  HLV_EXPECT=$D/checkpoints/hl_value_s${STRIDE}
  if [ "${WAIT_ART_MIN:-0}" != 0 ]; then
    W=0
    until [ -s "$HWM" ] && [ -d "$HLV_EXPECT" ]; do
      [ "$W" -ge "$WAIT_ART_MIN" ] && { echo "[wait] timed out after ${W}m; training locally"; break; }
      echo "[wait] for sibling artifacts in $D (${W}m/${WAIT_ART_MIN}m)"
      sleep 300; W=$((W + 5))
    done
  fi
  if [ ! -s "$HWM" ]; then
    pixi run python scripts/hierarchy/train_hwm.py \
      --cache "$CACHE" --h5 "$ACTH5" --out "$HWM" \
      --stride "$STRIDE" --macro-dim "$MACRO_DIM" --pred-horizon "$HL_HORIZON" \
      --batch "$HWM_BATCH" \
      --holdout-ep "$TRAIN_EPISODES" ${SM_STEPS:---steps $HWM_STEPS} \
      2>&1 | tee "$D/log_hwm.txt"
  fi

  # ---- macro-level value
  # save_metric writes <cache_dir>/checkpoints/<run_name>, so the trainer's
  # --out is the NAME and the solver must load the checkpoints/ path.
  HLV=$D/checkpoints/hl_value_s${STRIDE}
  if [ ! -d "$HLV" ]; then
    pixi run python scripts/hierarchy/train_hl_value.py \
      --cache "$CACHE" --out "$D/hl_value_s${STRIDE}" \
      --stride "$STRIDE" --max-delta "$HL_HORIZON" --n-step "$HL_HORIZON" \
      --expectile-final "$VALUE_TAU_FINAL" --holdout-ep "$TRAIN_EPISODES" \
      ${SM_STEPS:---steps $VALUE_STEPS} \
      2>&1 | tee "$D/log_hl_value.txt"
  fi

  # ---- bank of REAL action chunks for the compose high level
  BANK=$D/chunk_bank_s${STRIDE}.pt
  if [ ! -s "$BANK" ]; then
    pixi run python scripts/hierarchy/build_chunk_bank.py \
      --h5 "$ACTH5" --out "$BANK" --stride "$STRIDE" \
      --num-chunks "$BANK_CHUNKS" --holdout-ep "$TRAIN_EPISODES" \
      2>&1 | tee "$D/log_bank.txt"
  fi

  NEP=$NUM_EPISODES; SEEDS="$EVAL_SEEDS"; OFFS="$OFFSETS"
  HLS=$HL_SAMPLES; HLI=$HL_ITERS
  if [ "$SMOKE" = 1 ]; then NEP=4; SEEDS=42; OFFS=25; HLS=32; HLI=3; fi

  run_eval () {  # run_eval <arm> <offset> <seed>
    local arm=$1 off=$2 sd=$3 bud=$(( $2 * 2 ))
    local label="${arm}_h${off}_s${sd}"
    echo "===== HIER $label ====="
    local extra=""
    case $arm in
      cem)         extra="core/solver=cem";;
      hier_latent) extra="core/solver=hlip core.solver.hwm_path=$HWM core.solver.hl_cost=latent";;
      hier_value)  extra="core/solver=hlip core.solver.hwm_path=$HWM core.solver.hl_cost=value core.solver.hl_value_path=$HLV";;
      hier_compose) extra="core/solver=hlip core.solver.hl_dynamics=compose core.solver.bank_path=$BANK core.solver.hl_cost=value core.solver.hl_value_path=$HLV";;
      hier_compose_latent) extra="core/solver=hlip core.solver.hl_dynamics=compose core.solver.bank_path=$BANK core.solver.hl_cost=latent";;
      hier_adam)   extra="core/solver=hlip core.solver.hwm_path=$HWM core.solver.hl_opt=adam core.solver.hl_lr=$HL_LR core.solver.hl_adam_steps=$HL_ADAM_STEPS core.solver.hl_cost=value core.solver.hl_value_path=$HLV";;
      hier_adam_latent) extra="core/solver=hlip core.solver.hwm_path=$HWM core.solver.hl_opt=adam core.solver.hl_lr=$HL_LR core.solver.hl_adam_steps=$HL_ADAM_STEPS core.solver.hl_cost=latent";;
    esac
    pixi run eval model=lewm \
      runtime.seed=$sd \
      evaluation.num_episodes=$NEP \
      evaluation.goal_offset_steps=$off \
      evaluation.budget=$bud \
      $extra \
      core.solver.hl_samples=$HLS core.solver.hl_iters=$HLI \
      core.solver.hl_horizon=$HL_HORIZON \
      2>&1 | tee "$D/log_${label}.txt" | grep -vi "solve completed" || \
      echo "[eval-failed] $label"
    local run=$(ls -dt logs/*/* | head -1)
    cp "$run"/*results*.txt "$D/results_${label}.txt" 2>/dev/null || true
    echo "----- RESULT $label -----"
    grep -h "success_rate" "$D/log_${label}.txt" | tail -2 || echo "metrics: MISSING"
  }

  for OFF in $OFFS; do
    for SD in $SEEDS; do
      for ARM in $ARMS; do
        # the flat reference takes no hl_* overrides
        if [ "$ARM" = cem ]; then
          echo "===== HIER cem_h${OFF}_s${SD} ====="
          pixi run eval model=lewm runtime.seed=$SD evaluation.num_episodes=$NEP \
            evaluation.goal_offset_steps=$OFF evaluation.budget=$(( OFF * 2 )) \
            core/solver=cem 2>&1 | tee "$D/log_cem_h${OFF}_s${SD}.txt" \
            | grep -vi "solve completed" || echo "[eval-failed] cem_h${OFF}_s${SD}"
          grep -h "success_rate" "$D/log_cem_h${OFF}_s${SD}.txt" | tail -2 || true
        else
          run_eval "$ARM" "$OFF" "$SD"
        fi
      done
    done
  done

  echo "HIER_DONE tag=$EXPERIMENT_TAG"
  grep -H "success_rate" "$D"/log_*.txt | tail -40 || true
