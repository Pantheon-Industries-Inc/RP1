# Counterstrike actor re-evaluation — eval only, no training.
#
#   sky jobs launch scripts/sky/counterstrike_eval_actors.yaml -n cs-eval \
#       --priority p1 --env ACTOR_TAGS="cs-swp-20260815-cs-a16-m05-l3e4 ..." \
#       --env EXPERIMENT_TAG=cs-eval-20260911 -y
#
# Loads trained planner.pt checkpoints from the sweep cells' durable dirs
# (/checkpoints/<user>/<tag>/train_checkpoints/planner.pt) and evaluates the
# LIP solver under the shipped protocol: one K=8 refinement pass per decision,
# no deploy-time restarts (2026-09-04 directive). Serialized evals on one node.

name: cs-eval-actors

envs:
  ACTOR_TAGS: ""           # space-separated EXPERIMENT_TAGs holding train_checkpoints/planner.pt
  EVAL_SEEDS: "50 51"      # selection by default; switch to "42 43 44" for the report pass
  NUM_EPISODES: "50"
  PANTHEON_USER: armin@pantheon.inc
  EXPERIMENT_TAG: cs-eval-actors

workdir: .

resources:
  accelerators: H200:1
  cpus: 20
  memory: 230
  image_id: docker:pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel
  labels:
    telemetry-contract: opt-out
    telemetry-opt-out-reason: replication-validation

volumes:
  /checkpoints: checkpoints

setup: |
  set -euo pipefail
  sudo apt-get update -qq >/dev/null 2>&1 || apt-get update -qq
  (sudo apt-get install -yqq curl git libegl1 libgl1 libosmesa6 >/dev/null 2>&1 \
    || apt-get install -yqq curl git libegl1 libgl1 libosmesa6 >/dev/null)
  curl -fsSL https://pixi.sh/install.sh | bash
  export PATH=$HOME/.pixi/bin:$PATH
  cd ~/sky_workdir
  pixi install -e default

run: |
  set -euo pipefail
  export PATH=$HOME/.pixi/bin:$PATH
  cd ~/sky_workdir
  export LD_LIBRARY_PATH=$PWD/.pixi/envs/default/lib:${LD_LIBRARY_PATH:-}
  export MUJOCO_GL=egl MUJOCO_EGL_DEVICE_ID=0
  export RLP_DATA_HOME=/tmp/rlp-data
  mkdir -p "$RLP_DATA_HOME"
  [ -n "$ACTOR_TAGS" ] || { echo "FATAL: ACTOR_TAGS is empty" >&2; exit 1; }
  D=/checkpoints/$PANTHEON_USER/$EXPERIMENT_TAG
  mkdir -p "$D" && chmod 777 "$D"

  pixi run tool tool=fetch_dataset dataset=pusht

  WM=$D/lewm_pusht_official
  if [ ! -f "$WM/weights.pt" ] || [ ! -f "$WM/config.json" ]; then
    mkdir -p "$WM"
    RAW=$RLP_DATA_HOME/wm_raw
    pixi run hf download quentinll/lewm-pusht weights.pt config.json \
      --revision 22b330c28c27ead4bfd1888615af1340e3fe9052 --local-dir "$RAW"
    pixi run tool tool=convert_pldm src="$RAW/weights.pt" dst="$WM/weights.pt"
    cp "$RAW/config.json" "$WM/config.json"
  fi

  for TAG in $ACTOR_TAGS; do
    ACTOR=/checkpoints/$PANTHEON_USER/$TAG/train_checkpoints/planner.pt
    if [ ! -f "$ACTOR" ]; then
      echo "SKIP $TAG: no planner.pt at $ACTOR"; continue
    fi
    for ES in $EVAL_SEEDS; do
      echo "===== EVAL $TAG seed=$ES ====="
      pixi run eval model=pusht_lewm core.world_model.checkpoint="$WM" \
        core/solver=lip core.solver.actor_path="$ACTOR" \
        runtime.seed=$ES evaluation.num_episodes=$NUM_EPISODES
      RUN=$(ls -dt logs/*/* | head -1)
      OUT="$D/results_${TAG}_s${ES}.txt"
      find "$RUN" -name '*results*.txt' -exec cp {} "$OUT" \;
      echo "----- RESULT $TAG seed=$ES -----"
      cat "$OUT"
    done
  done
  echo "CS_EVAL_ACTORS_DONE tag=$EXPERIMENT_TAG"
