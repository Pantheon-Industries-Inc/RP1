# RLP (paper) / LIP (code) evaluation of the vendored actors — eval only.
#
# Trains nothing: every cell loads a checkpoint from assets/core/planner and
# evaluates it at h25 (goal_offset 25 / budget 50) and h100 (100 / 200) on the
# report draws 42/43/44, 50 episodes each. Held-out task range on both
# environments (episodes 8000-9999).
#
#   sky jobs launch scripts/sky/eval_rlp.yaml -n rlp-eval-cube-lewm --priority p2 \
#     --env ENVNAME=cube --env BASE=lewm --env EXPERIMENT_TAG=rlp-eval-20260815 -y
#   sky jobs launch scripts/sky/eval_rlp.yaml -n rlp-eval-tw-lejepa-a1 --priority p2 \
#     --env ENVNAME=tworoom --env BASE=lejepa \
#     --env ARMS=terminal_a1.8_m0.1_l1e-4 --env EXPERIMENT_TAG=rlp-eval-20260815 -y
#
# Evaluations are serialized per node (MuJoCo/EGL cube evaluation is not
# concurrency-safe and silently depresses success when two share a node).

name: rlp-eval

envs:
  ENVNAME: cube            # cube | tworoom
  BASE: lewm               # cube: lewm | pldm   tworoom: lejepa | pldm
  ARMS: ""                 # tworoom only: subset of the vendored arm dirs (default: all)
  SEEDS: ""                # actor training seeds (default: all vendored, s0 s1 s2)
  HORIZONS: "25 100"       # goal_offset_steps; budget = 2 x horizon
  EVAL_SEEDS: "42 43 44"   # report draws (never 50/51 — those are selection)
  NUM_EPISODES: "50"
  SMOKE: "0"               # 1 = 2 episodes, one draw, one actor: path check only
  PANTHEON_USER: armin@pantheon.inc
  EXPERIMENT_TAG: rlp-eval

workdir: .

resources:
  accelerators: H200:1
  cpus: 20
  memory: 230
  image_id: docker:pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel
  labels:
    telemetry-contract: opt-out
    telemetry-opt-out-reason: replication-validation

volumes:
  /checkpoints: checkpoints

setup: |
  set -euo pipefail
  sudo apt-get update -qq >/dev/null 2>&1 || apt-get update -qq
  (sudo apt-get install -yqq curl git libegl1 libgl1 libosmesa6 >/dev/null 2>&1 \
    || apt-get install -yqq curl git libegl1 libgl1 libosmesa6 >/dev/null)
  curl -fsSL https://pixi.sh/install.sh | bash
  export PATH=$HOME/.pixi/bin:$PATH
  cd ~/sky_workdir
  pixi install -e default

run: |
  set -euo pipefail
  export PATH=$HOME/.pixi/bin:$PATH
  cd ~/sky_workdir
  export LD_LIBRARY_PATH=$PWD/.pixi/envs/default/lib:${LD_LIBRARY_PATH:-}
  export MUJOCO_GL=egl MUJOCO_EGL_DEVICE_ID=0
  export RLP_DATA_HOME=/tmp/rlp-data
  mkdir -p "$RLP_DATA_HOME"
  D=/checkpoints/$PANTHEON_USER/$EXPERIMENT_TAG/${ENVNAME}_${BASE}
  mkdir -p "$D" && chmod -R 777 "/checkpoints/$PANTHEON_USER/$EXPERIMENT_TAG"

  SEEDS_DEFAULT="s0 s1 s2"
  if [ "$ENVNAME" = cube ]; then
    pixi run tool tool=fetch_dataset dataset=ogb_cube
    MODEL=$BASE
    ROOT=assets/core/planner/cube/$BASE
    EXTRA=""            # held-out range is pinned in the cube eval root
    ARMS_ALL="."
  else
    pixi run tool tool=fetch_dataset dataset=tworoom
    [ "$BASE" = lejepa ] && MODEL=tworoom_lewm_h5 || MODEL=tworoom_pldm_h5
    ROOT=assets/core/planner/tworoom/$BASE
    EXTRA='evaluation.episode_range=8000:10000'
    ARMS_ALL=$(cd "$ROOT" && ls -d */ | tr -d /)
  fi
  ARMS_RUN=${ARMS:-}; [ -z "$ARMS_RUN" ] && ARMS_RUN="$ARMS_ALL"
  SEEDS_RUN=${SEEDS:-}; [ -z "$SEEDS_RUN" ] && SEEDS_RUN="$SEEDS_DEFAULT"

  N=$NUM_EPISODES
  if [ "$SMOKE" = 1 ]; then
    N=2
    EVAL_SEEDS=42
    SEEDS_RUN=$(echo $SEEDS_RUN | awk '{print $1}')
    ARMS_RUN=$(echo $ARMS_RUN | awk '{print $1}')
  fi

  SUMMARY=$D/summary.txt
  : > "$SUMMARY.part"

  for ARM in $ARMS_RUN; do
    for S in $SEEDS_RUN; do
      ACTOR="$ROOT/$ARM/$S/planner.pt"
      [ "$ARM" = "." ] && ACTOR="$ROOT/$S/planner.pt"
      if [ ! -f "$ACTOR" ]; then echo "MISSING actor $ACTOR" >&2; exit 1; fi
      for H in $HORIZONS; do
        for ES in $EVAL_SEEDS; do
          LABEL="${ENVNAME}_${BASE}_${ARM}_${S}_h${H}_d${ES}"
          echo "===== EVAL $LABEL ====="
          pixi run eval model=$MODEL core/solver=lip \
            core.solver.actor_path="$PWD/$ACTOR" \
            runtime.seed=$ES evaluation.num_episodes=$N \
            evaluation.goal_offset_steps=$H evaluation.budget=$((H * 2)) \
            $EXTRA
          RUN=$(ls -dt logs/*/* | head -1)
          OUT="$D/result_${LABEL}.txt"
          find "$RUN" -name '*results*.txt' -exec cp {} "$OUT" \;
          echo "----- RESULT $LABEL -----"; cat "$OUT"
          echo "$LABEL $(head -1 "$OUT")" >> "$SUMMARY.part"
        done
      done
    done
  done

  mv "$SUMMARY.part" "$SUMMARY"
  echo "===== SUMMARY ====="; cat "$SUMMARY"
  echo "RLP_EVAL_DONE env=$ENVNAME base=$BASE tag=$EXPERIMENT_TAG"
