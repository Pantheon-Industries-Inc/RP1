# Collect per-arm results for the 2026-08-17 TwoRoom improvement campaign.
#
# Each training cell tees its eval output to
#   /checkpoints/<user>/<EXPERIMENT_TAG>/logs/g_<ARM>_s<SEED>_eval.log
# and the last "[summary] {...}" line in that file holds the per-draw success
# rates. Job stdout cannot be used for this: cells run 4-wide, so a [summary]
# there cannot be attributed to the [args-ok] above it. The per-cell log file
# is keyed by arm name and is the authoritative source.
#
#   sky jobs launch scripts/sky/collect_tworoom_20260817.yaml -n tw-collect -y --async
#
# Prints one CSV row per (arm, seed) plus a per-arm aggregate over seeds.

name: tw-collect

envs:
  PANTHEON_USER: armin@pantheon.inc
  TAG_GLOB: "rlp-tw-*-20260817"

resources:
  cpus: 2
  memory: 8

volumes:
  /checkpoints: checkpoints

run: |
  set -uo pipefail
  python3 - <<'PY'
  import glob, json, os, re, statistics as st, collections

  user = os.environ["PANTHEON_USER"]
  root = f"/checkpoints/{user}"
  pat  = os.path.join(root, os.environ["TAG_GLOB"], "logs", "*_eval.log")
  files = sorted(glob.glob(pat))
  print(f"# {len(files)} eval logs under {pat}\n")

  rows = []
  for f in files:
      tag = f.split("/")[3]
      base = os.path.basename(f)
      m = re.match(r"g_(.+)_s(\d+)_eval\.log$", base)
      if not m:
          continue
      arm, seed = m.group(1), int(m.group(2))
      txt = open(f, errors="replace").read()
      sums = re.findall(r"\[summary\]\s*(\{.*?\})", txt)
      if not sums:
          rows.append((arm, seed, tag, None, {}))
          continue
      d = json.loads(sums[-1])
      per = {k: v for k, v in d.items() if re.match(r"rh5_h\d+_s\d+$", k) and v is not None}
      mean = st.mean(per.values()) if per else None
      rows.append((arm, seed, tag, mean, per))

  print("arm,seed,mean,per_draw")
  for arm, seed, tag, mean, per in sorted(rows):
      cells = " ".join(f"{k.split('_')[-1]}={v:g}" for k, v in sorted(per.items()))
      print(f"{arm},{seed},{'' if mean is None else f'{mean:.2f}'},{cells}")

  print("\n# ---- per-arm aggregate over seeds ----")
  print("arm,n_seeds,n_cells,mean,sd,seed_means")
  agg = collections.defaultdict(list)
  allc = collections.defaultdict(list)
  for arm, seed, tag, mean, per in rows:
      if mean is not None:
          agg[arm].append(mean)
          allc[arm].extend(per.values())
  for arm in sorted(agg):
      v = agg[arm]
      sd = st.stdev(v) if len(v) > 1 else 0.0
      seeds = "/".join(f"{x:.1f}" for x in v)
      print(f"{arm},{len(v)},{len(allc[arm])},{st.mean(v):.2f},{sd:.2f},{seeds}")

  missing = [(a, s, t) for a, s, t, m, _ in rows if m is None]
  if missing:
      print(f"\n# WARNING {len(missing)} cells with no [summary]:")
      for a, s, t in missing:
          print(f"#   {t} {a} s{s}")
  PY
