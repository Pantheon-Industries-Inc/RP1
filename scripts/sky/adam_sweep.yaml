# Adam (GradientSolver) hyperparameter sweep — eval only, latent objective.
#
# The Adam baseline has no training stage: each cell evaluates the frozen
# world model with core/solver=adam under a (lr x n_steps) grid at the
# paper's 100-sample budget. Selection protocol: eval seeds 50/51 at h25
# (reacher additionally splits by first-hit tolerance 0.1/0.05). Report
# seeds 42/43/44 are NOT run here — re-run the winning cell separately.
#
#   sky jobs launch scripts/sky/adam_sweep.yaml -n adam-cube-lewm --priority p2 \
#       --env ENVNAME=cube --env BASE=lewm --env EXPERIMENT_TAG=adam-sweep-20260815 -y
#   sky jobs launch scripts/sky/adam_sweep.yaml -n adam-tworoom-lejepa --priority p2 \
#       --env ENVNAME=tworoom --env BASE=lejepa --env EXPERIMENT_TAG=adam-sweep-20260815 -y
#   sky jobs launch scripts/sky/adam_sweep.yaml -n adam-reacher-pldm --priority p2 \
#       --env ENVNAME=reacher --env BASE=pldm --env EXPERIMENT_TAG=adam-sweep-20260815 -y
#
# Evaluations are serialized per node (MuJoCo/EGL evaluation is not
# concurrency-safe and silently depresses success when two share a node).

name: adam-sweep

envs:
  ENVNAME: cube             # cube | tworoom | reacher
  BASE: lewm                # cube: lewm|pldm   tworoom/reacher: lejepa|pldm
  LRS: "0.03 0.1 0.3 1.0"   # AdamW learning rates (paper default 0.1)
  NSTEPS: "15 30 60"        # optimizer steps (paper default 30)
  NUM_SAMPLES: "100"        # candidate plans; fixed to the paper's budget
  EVAL_SEEDS: "50 51"       # SELECTION draws only — never quote these
  NUM_EPISODES: "50"
  HORIZONS: "25"            # selection at h25; budget = 2 x horizon
  SMOKE: "0"                # 1 = 2 episodes, one draw, one grid cell
  PANTHEON_USER: armin@pantheon.inc
  EXPERIMENT_TAG: adam-sweep

workdir: .

resources:
  accelerators: H200:1
  cpus: 20
  memory: 230
  image_id: docker:pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel
  labels:
    telemetry-contract: opt-out
    telemetry-opt-out-reason: replication-validation

volumes:
  /checkpoints: checkpoints

setup: |
  set -euo pipefail
  sudo apt-get update -qq >/dev/null 2>&1 || apt-get update -qq
  (sudo apt-get install -yqq curl git libegl1 libgl1 libosmesa6 >/dev/null 2>&1 \
    || apt-get install -yqq curl git libegl1 libgl1 libosmesa6 >/dev/null)
  curl -fsSL https://pixi.sh/install.sh | bash
  export PATH=$HOME/.pixi/bin:$PATH
  cd ~/sky_workdir
  pixi install -e default

run: |
  set -euo pipefail
  export PATH=$HOME/.pixi/bin:$PATH
  cd ~/sky_workdir
  export LD_LIBRARY_PATH=$PWD/.pixi/envs/default/lib:${LD_LIBRARY_PATH:-}
  export MUJOCO_GL=egl MUJOCO_EGL_DEVICE_ID=0
  export RLP_DATA_HOME=/tmp/rlp-data
  mkdir -p "$RLP_DATA_HOME"
  D=/checkpoints/$PANTHEON_USER/$EXPERIMENT_TAG/${ENVNAME}_${BASE}
  mkdir -p "$D" && chmod -R 777 "/checkpoints/$PANTHEON_USER/$EXPERIMENT_TAG"

  EVAL_DATA=""
  TAUS="-"
  case $ENVNAME in
    cube)
      pixi run tool tool=fetch_dataset dataset=ogb_cube
      MODEL=$BASE
      EXTRA=""            # held-out range is pinned in the cube eval roots
      ;;
    tworoom)
      pixi run tool tool=fetch_dataset dataset=tworoom
      [ "$BASE" = lejepa ] && MODEL=tworoom_lewm_h5 || MODEL=tworoom_pldm_h5
      EXTRA='evaluation.episode_range=8000:10000'
      ;;
    reacher)
      pixi run tool tool=fetch_dataset dataset=reacher
      DATASET=$(find "$RLP_DATA_HOME/datasets/reacher" -maxdepth 3 -name '*.lance' | head -1 || true)
      [ -n "$DATASET" ] || DATASET=$(find "$RLP_DATA_HOME/datasets/reacher" -maxdepth 3 -name '*.h5' | head -1 || true)
      [ -n "$DATASET" ] || { echo "no reacher dataset under $RLP_DATA_HOME/datasets/reacher"; exit 1; }
      EVAL_DATA="data.path=$DATASET"
      [ "$BASE" = lejepa ] && MODEL=reacher_lewm || MODEL=reacher_pldm
      EXTRA=""            # held-out range is pinned in configs/eval/reacher.yaml
      # the paper's Reacher table reports first-hit success at both tolerances
      TAUS="0.1 0.05"
      ;;
    *) echo "unknown ENVNAME=$ENVNAME"; exit 1;;
  esac

  N=$NUM_EPISODES
  if [ "$SMOKE" = 1 ]; then
    N=2
    EVAL_SEEDS=50
    LRS=$(echo $LRS | awk '{print $1}')
    NSTEPS=$(echo $NSTEPS | awk '{print $1}')
    [ "$TAUS" = "-" ] || TAUS=$(echo $TAUS | awk '{print $1}')
  fi

  SUMMARY=$D/summary.txt
  : > "$SUMMARY.part"

  for LR in $LRS; do
    for NS in $NSTEPS; do
      for H in $HORIZONS; do
        for TAU in $TAUS; do
          TOL=""; TAUTAG=""
          if [ "$TAU" != "-" ]; then
            TOL="environment.success_threshold=$TAU"; TAUTAG="_tau${TAU}"
          fi
          for ES in $EVAL_SEEDS; do
            LABEL="${ENVNAME}_${BASE}_lr${LR}_n${NS}_h${H}${TAUTAG}_d${ES}"
            echo "===== EVAL $LABEL ====="
            pixi run eval model=$MODEL core/solver=adam \
              core.solver.n_steps=$NS core.solver.optimizer_kwargs.lr=$LR \
              core.solver.num_samples=$NUM_SAMPLES \
              runtime.seed=$ES evaluation.num_episodes=$N \
              evaluation.goal_offset_steps=$H evaluation.budget=$((H * 2)) \
              ${EVAL_DATA:+$EVAL_DATA} $TOL $EXTRA
            RUN=$(ls -dt logs/*/* | head -1)
            OUT="$D/result_${LABEL}.txt"
            find "$RUN" -name '*results*.txt' -exec cp {} "$OUT" \;
            echo "----- RESULT $LABEL -----"; cat "$OUT"
            echo "$LABEL $(head -1 "$OUT")" >> "$SUMMARY.part"
          done
        done
      done
    done
  done

  mv "$SUMMARY.part" "$SUMMARY"
  echo "===== SUMMARY ====="; cat "$SUMMARY"
  echo "ADAM_SWEEP_DONE env=$ENVNAME base=$BASE tag=$EXPERIMENT_TAG"
