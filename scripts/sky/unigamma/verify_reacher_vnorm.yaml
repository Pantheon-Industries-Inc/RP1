# One-shot: torch.load the reacher smoke actor and print its stored vnorm +
# train_args — durable proof that --vnorm/--gamma threaded (reacher has no
# [args-ok] guard; the trainer's [vnorm] print lands on node-local disk).
name: verify-re-vnorm
envs:
  TAG: rlp-re-unig-smoke-20260818
  PANTHEON_USER: armin@pantheon.inc
resources:
  cpus: 4
  memory: 16
volumes:
  /checkpoints: checkpoints
run: |
  set -euo pipefail
  pip install -q torch --index-url https://download.pytorch.org/whl/cpu 2>&1 | tail -1
  python3 - <<'PY'
  import glob, os, torch
  pat = f"/checkpoints/{os.environ['PANTHEON_USER']}/{os.environ['TAG']}/actors/*.pt"
  files = sorted(glob.glob(pat))
  print(f"{len(files)} actors under {pat}")
  for f in files:
      ck = torch.load(f, map_location="cpu", weights_only=False)
      ta = ck.get("train_args", {}) or {}
      print(f"VERIFY {os.path.basename(f)}: vnorm={ck.get('vnorm', 'MISSING')} "
            f"amax={ck.get('amax')} gamma={ta.get('gamma', 'n/a')} "
            f"ta_vnorm={ta.get('vnorm', 'n/a')} ta_amax={ta.get('amax', 'n/a')}")
  PY
