# PushT RLP training ("counterstrike") on the Pantheon cluster.
#
#   sky jobs launch scripts/sky/counterstrike_pusht.yaml -n counterstrike \
#       --env EXPERIMENT_TAG=counterstrike-$(date +%Y%m%d) -y
#
# Runs the full model=rlp pipeline on the official PushT release:
#   base     `quentinll/lewm-pusht` weights.pt (transformers-4 HF ViT key
#            naming) converted in-job via tool=convert_pldm (the identical
#            1:1 rename, verified on the 2026-07 PushT campaign) + release
#            config.json
#   data     `pixi run tool tool=fetch_dataset dataset=pusht`
#            (pusht_expert_train.h5, 18,685 episodes x 109 steps, 224px)
#   split    train episodes 0-15999, eval tasks draw from 16000-18685
#   value    the PushT-specific TD corner from the 2026-07-12 campaign
#            (WRITEUP_pusht_lip.md): gamma=1.0, expectile=0.01, n_step=1 —
#            single-frame PushT latents alias velocity, so long backups
#            compound noise; shortest backup + sharpest optimism won 46 cells
#   planner  cube-recipe defaults; amax has never been swept on PushT under
#            the modern lip_ac stack, so AMAX is exposed (default 1.6)
# then evaluates RLP / CEM-latent / no-op floor at h25 (goal_offset 25,
# budget 50) on report seeds 42/43/44. Reference points from the old-stack
# campaign (h25): latent+CEM 86.7, TD+CEM 88.0, LIP+8restarts 84.7.
#
# Caches and the converted world model persist on /checkpoints so a
# preempted job resumes past the download/convert/encode stages.

name: counterstrike

envs:
  AMAX: "1.6"           # residual clip; unswept on PushT — sweep if RLP lags CEM
  MEAN_WEIGHT: "0.1"    # planner mean-anchor weight (0.1 cube, 0.3/0.5 won elsewhere)
  ACTOR_LR: "3e-4"      # actor LR; final LR is always LR/10
  TD_MODE: "cube"       # planner co-critic TD: cube (gamma .98, n50, exp .1->.03)
                        # | pusht (gamma 1.0, n1, exp .03->.01 — the PushT value
                        # corner applied to the co-trained critic as well)
  EXPAND: "1.0"         # planner.expand_weight: value expansion through WM
                        # rollouts. 1.0 = cube recipe; 0 won on Reacher —
                        # per-env, and a value-error question (expansion
                        # amplifies WM error at the read points)
  ITERS: ""             # planner.iterations (refinement steps K; empty = the
                        # LIPv4 default 8). Trained unrolled — eval reads K
                        # from the checkpoint, so no eval-side change.
  REPLAY: ""            # planner.replay_prob override (empty = recipe 0.5)
  STEPS: ""             # planner.steps override (empty = recipe 6000)
  VALUE_GAMMA: "1.0"
  VALUE_EXPECTILE: "0.01"
  VALUE_NSTEP: "1"
  TRAIN_EPISODES: "16000"
  WAIT_CACHE_MIN: "0"   # sweep cells: minutes to wait for CACHE_TAG's shared
                        # caches before falling back to building them
  EVAL_SEEDS: "42 43 44"
  SMOKE: "0"            # 1 = tiny steps/episodes end-to-end path check
  SEED: "0"             # actor/value training seed. Reportable numbers average
                        # THREE actor seeds (0,1,2) — launch one job per seed
                        # with CACHE_TAG pointing at the shared caches.
  CACHE_TAG: ""         # reuse another experiment's caches (default: own tag)
  PLANNER_GAMMA: ""     # co-critic discount override (unified-gamma arms; empty
                        # = TD_MODE default). NOTE $TD_EXTRA comes after
                        # $ITER_EXTRA on the command line -- use TD_MODE=cube
                        # (empty TD_EXTRA) with this override.
  PLANNER_NSTEP: ""     # co-critic n-step override
  MAX_DELTA: ""         # planner.max_delta override (unified band: 20)
  CKPT_SELECT: "0"      # 1 = within-run early stopping over planner snapshots
  CKPT_VAL_SEEDS: "50 51"  # selection draws (report draws 42-44 untouched)
  CKPT_AVG: "0"         # k>0: deploy the weight average of the k best-scoring
                        # snapshots when it matches/beats the best single one
  TRAIN_OVERRIDES: ""   # extra hydra overrides for the model=rlp train call,
                        # e.g. "planner.ac_weight=0.2 core.planner.transformer_layers=3
                        # core.value.depth=3" (deepcap + anti-constancy)
  PHASES: "1"           # actor fs5 cache: residue classes of the stride kept (5 = all; 5x the
                        # actor's block-aligned start states from the same episodes, no re-encode)
  NEAR_FRAC: "0"        # fraction of in-episode hindsight goals drawn 1..NEAR_MAX steps
                        # ahead, teacher + co-critic (0 = balanced buckets only)
  NEAR_MAX: "3"
  DEPLOY_AMAX: ""       # space-separated deploy clips: each value gets a
                        # rewritten-checkpoint eval (top-level ck['amax'];
                        # train_args untouched) alongside the native rlp eval
  EVAL_CONDS: "rlp cem_latent noop"
                         # diagnostics (2026-09-08): rlp_ceminit (K refinements from a
                         # CEM plan), rlp_ceminit_k0 (the CEM plan through the LIP
                         # path, K=0 control), rlp_k64 (continuation, 64 iterations)
  ACTOR_TAG: ""          # reuse another tag's train_checkpoints/ (eval-only job)
  HYB_LAMS: "1.0"        # blend weights for the cem_hybrid / cem_hybrid_td conditions (E11)
  PROBES: "0"            # 1 = per-replan probe dumps for every rlp-family eval
  GD_LRS: "0.03"         # gd_* conditions: space-separated learning rates for the plain step
  RECORD: "0"            # 1 = record real rollouts (pixels, action) per eval
  L2O_CKPT: ""          # trained L2O actor for the l2o_* conditions (none = skipped)
  DMPO_CKPT: ""         # trained DMPO actor for the dmpo_* conditions (none = skipped)
  RECORD_CONDS: "rlp cem_latent"   # conditions that record when RECORD=1 (E3 needs only these)
  RECORD_MIN_LEN: "25"   # recorder drops episodes shorter than this (25 = WM window; 1 = keep all, for videos)
  WM_DIR: ""            # pre-installed world model dir (overrides the LeWM base)
  OUT_ROOT: "/newcheckpoints"      # where $D is written; /checkpoints reads remain legacy
  POST_ONLY: "0"         # 1 = skip training/evals, only run POST_SCRIPT_B64 on an existing $D
  POST_ENV: ""           # extra "KEY=VALUE KEY2=VALUE2" exported for the POST script
  SAVE_VIDEOS: "0"        # 1 = persist per-eval video panels to $D
  POST_SCRIPT_B64: ""     # optional python (base64) run in the pixi env after evals
  EVAL_EXTRA: ""         # extra hydra overrides for every eval call
                         # (__SEED__/__LABEL__ substituted per call)
  PANTHEON_USER: armin@pantheon.inc
  EXPERIMENT_TAG: counterstrike

workdir: .

resources:
  accelerators: H200:1
  cpus: 20
  memory: 230
  image_id: docker:pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel
  labels:
    telemetry-contract: opt-out
    telemetry-opt-out-reason: replication-validation

volumes:
  /checkpoints: checkpoints                  # legacy PVC: read-side (actors, caches, WM); quota-exhausted for writes
  /newcheckpoints: armin-rlp-checkpoints     # 2026-09-08: outputs go here (OUT_ROOT)

setup: |
  set -euo pipefail
  sudo apt-get update -qq >/dev/null 2>&1 || apt-get update -qq
  (sudo apt-get install -yqq curl git libegl1 libgl1 libosmesa6 >/dev/null 2>&1 \
    || apt-get install -yqq curl git libegl1 libgl1 libosmesa6 >/dev/null)
  curl -fsSL https://pixi.sh/install.sh | bash
  export PATH=$HOME/.pixi/bin:$PATH
  cd ~/sky_workdir
  pixi install -e default

run: |
  set -euo pipefail
  export PATH=$HOME/.pixi/bin:$PATH
  cd ~/sky_workdir
  # The base image presets LD_LIBRARY_PATH to system dirs whose libstdc++ is
  # older than the pixi env's toolchain; put the env's own runtime first.
  export LD_LIBRARY_PATH=$PWD/.pixi/envs/default/lib:${LD_LIBRARY_PATH:-}
  export MUJOCO_GL=egl MUJOCO_EGL_DEVICE_ID=0 RLP_RECORD_MIN_LEN=${RECORD_MIN_LEN:-25}
  export RLP_DATA_HOME=/tmp/rlp-data
  mkdir -p "$RLP_DATA_HOME"
  D=${OUT_ROOT:-/checkpoints}/$PANTHEON_USER/$EXPERIMENT_TAG
  mkdir -p "$D" && chmod 777 "$D"
  CD=/checkpoints/$PANTHEON_USER/${CACHE_TAG:-$EXPERIMENT_TAG}/caches && mkdir -p "$CD"
  FS5SUF=""; [ "${PHASES:-1}" != 1 ] && FS5SUF="p${PHASES}"  # phase-multiplexed actor cache is a separate artefact

  pixi run tool tool=fetch_dataset dataset=pusht
  H5=$RLP_DATA_HOME/datasets/pusht/pusht_expert_train.h5

  # World model: official release weights, converted once to this stack's
  # vit_hf (transformers-5 q_proj) key naming. Durable on /checkpoints.
  # WM_DIR: use an already-installed world model instead of the official LeWM
  # base (e.g. the in-house PushT WM on the volume). Takes precedence over the
  # ACTOR_TAG copy and the HF download; the latent caches are WM-specific, so
  # pair it with its OWN CACHE_TAG.
  if [ -n "${WM_DIR:-}" ]; then
    [ -f "$WM_DIR/weights.pt" ] || { echo "WM_DIR has no weights.pt: $WM_DIR" >&2; exit 1; }
    WM="$WM_DIR"; echo "[wm] using $WM"
  else
  WM=$D/lewm_pusht_official
  if [ ! -f "$WM/weights.pt" ] && [ -n "${ACTOR_TAG:-}" ]; then
    for ROOT in /checkpoints ${OUT_ROOT:-/checkpoints}; do
      if [ -f $ROOT/$PANTHEON_USER/$ACTOR_TAG/lewm_pusht_official/weights.pt ]; then
        cp -r $ROOT/$PANTHEON_USER/$ACTOR_TAG/lewm_pusht_official "$WM"; echo "[wm] copied from $ROOT/$ACTOR_TAG"; break
      fi
    done
  fi
  if [ ! -f "$WM/weights.pt" ] || [ ! -f "$WM/config.json" ]; then
    mkdir -p "$WM"
    RAW=$RLP_DATA_HOME/wm_raw
    pixi run hf download quentinll/lewm-pusht weights.pt config.json \
      --revision 22b330c28c27ead4bfd1888615af1340e3fe9052 --local-dir "$RAW"
    pixi run tool tool=convert_pldm src="$RAW/weights.pt" dst="$WM/weights.pt"
    cp "$RAW/config.json" "$WM/config.json"
  fi
  fi

  # Sweep cells share the seed-0 run's caches: wait for the encode stages to
  # land (saves are atomic — crash-safe .tmp + rename) instead of rebuilding
  # a ~2 h encode per cell. Falls back to building after the timeout.
  if [ "$WAIT_CACHE_MIN" != 0 ] && [ -n "$CACHE_TAG" ]; then
    WAITED=0
    until [ -f "$CD/counterstrike_fs1.pt" ] && [ -f "$CD/counterstrike_fs5${FS5SUF}.pt" ] \
        && [ -f "$CD/counterstrike_actions.h5" ]; do
      if [ "$WAITED" -ge "$WAIT_CACHE_MIN" ]; then
        echo "cache wait timed out after ${WAITED}m; building locally"
        break
      fi
      echo "waiting for shared caches in $CD (${WAITED}m/${WAIT_CACHE_MIN}m)"
      sleep 300; WAITED=$((WAITED + 5))
    done
  fi

  SKIP=""
  [ -f "$CD/counterstrike_fs1.pt" ] && SKIP="cache"
  [ -f "$CD/counterstrike_fs5${FS5SUF}.pt" ] && SKIP="$SKIP,subsample"
  [ -f "$CD/counterstrike_actions.h5" ] && SKIP="$SKIP,actions"
  AUG_EXTRA=""
  if [ "${NEAR_FRAC:-0}" != 0 ]; then
    AUG_EXTRA="value.near_frac=$NEAR_FRAC planner.near_frac=$NEAR_FRAC value.near_max=${NEAR_MAX:-3} planner.near_max=${NEAR_MAX:-3}"
  fi
  SKIP=$(echo "$SKIP" | sed 's/^,//')

  TRAIN_EXTRA=""
  EVAL_N=50
  if [ "$SMOKE" = 1 ]; then
    TRAIN_EXTRA="train_episodes=64 value.steps=60 planner.steps=30"
    EVAL_N=2
    EVAL_SEEDS=42
  else
    TRAIN_EXTRA="train_episodes=$TRAIN_EPISODES"
  fi
  # appended AFTER the smoke/full assignment above, which replaces TRAIN_EXTRA wholesale
  [ "${PHASES:-1}" != 1 ] && TRAIN_EXTRA="$TRAIN_EXTRA actor_phases=$PHASES"

  ACTOR_LR_FINAL=$(awk -v lr="$ACTOR_LR" 'BEGIN { printf "%.0e", lr / 10 }')
  ITER_EXTRA=""
  [ -n "$ITERS" ] && ITER_EXTRA="planner.iterations=$ITERS"
  [ -n "$REPLAY" ] && ITER_EXTRA="$ITER_EXTRA planner.replay_prob=$REPLAY"
  [ -n "$STEPS" ] && ITER_EXTRA="$ITER_EXTRA planner.steps=$STEPS"
  [ -n "$PLANNER_GAMMA" ] && ITER_EXTRA="$ITER_EXTRA planner.gamma=$PLANNER_GAMMA"
  [ -n "$PLANNER_NSTEP" ] && ITER_EXTRA="$ITER_EXTRA planner.n_step=$PLANNER_NSTEP"
  [ -n "$MAX_DELTA" ] && ITER_EXTRA="$ITER_EXTRA planner.max_delta=$MAX_DELTA"
  TD_EXTRA=""
  if [ "$TD_MODE" = pusht ]; then
    TD_EXTRA="planner.gamma=1.0 planner.n_step=1 planner.expectile=0.03 planner.expectile_final=0.01"
  fi

  if [ -n "${ACTOR_TAG:-}" ] && [ ! -f "$D/train_checkpoints/planner.pt" ]; then
    SRC=/checkpoints/$PANTHEON_USER/$ACTOR_TAG/train_checkpoints
    [ -f "$SRC/planner.pt" ] || SRC=${OUT_ROOT:-/checkpoints}/$PANTHEON_USER/$ACTOR_TAG/train_checkpoints  # actors trained since 2026-09-08 live on the new volume
    [ -f "$SRC/planner.pt" ] || { echo "ACTOR_TAG has no planner.pt: $SRC" >&2; exit 1; }
    cp -r "$SRC" "$D/train_checkpoints"; echo "[actor-import] $ACTOR_TAG -> $D/train_checkpoints"
  fi
  if [ "${POST_ONLY:-0}" != 1 ] && [ ! -f "$D/train_checkpoints/planner.pt" ]; then
    pixi run train model=rlp \
      wm="$WM" \
      dataset="$H5" \
      name=counterstrike cache_directory="$CD" seed=$SEED \
      value.gamma=$VALUE_GAMMA value.expectile=$VALUE_EXPECTILE \
      value.n_step=$VALUE_NSTEP \
      planner.amax=$AMAX planner.mean_weight=$MEAN_WEIGHT \
      planner.expand_weight=$EXPAND \
      planner.actor_lr=$ACTOR_LR planner.actor_lr_final=$ACTOR_LR_FINAL \
      $ITER_EXTRA $TD_EXTRA "skip=[$SKIP]" $TRAIN_EXTRA $AUG_EXTRA ${TRAIN_OVERRIDES:-}
    RUN=$(ls -dt logs/*/* | head -1)
    rm -rf "$D/train_checkpoints"
    cp -r "$RUN/checkpoints" "$D/train_checkpoints"
  fi

  # ---- within-run early stopping: score each planner snapshot on the
  # SELECTION draws (50/51), deploy the argmax as planner.pt. Snapshots come
  # from planner.ckpt_every (core lip_ac); report draws stay untouched.
  # ---- TRAIN_BASELINE=l2o|dmpo: the learned inner-loop MPC baselines have never
  # been trained on PushT. Both imitate/optimise through the FROZEN world model
  # against a frozen objective, chosen by BASELINE_OBJ:
  #   value  -> the deployed offline TD teacher (value_td)
  #   latent -> a parameter-free single-frame latent-L2 metric, built here
  # Paper defaults are kept for the baseline itself; only the objective changes.
  if [ -n "${TRAIN_BASELINE:-}" ]; then
    BOBJ=${BASELINE_OBJ:-value}
    if [ "$BOBJ" = latent ]; then
      IV="$D/train_checkpoints/value_l2"
      if [ ! -d "$IV" ]; then
        pixi run train model=metric learner=l2 cache="$CD/counterstrike_fs1.pt" \
          window_frames=1 window_lag=5 output.checkpoint=value_l2 device=cpu
        RUNL=$(ls -dt logs/*/* | head -1); mkdir -p "$D/train_checkpoints"
        cp -r "$RUNL/checkpoints/value_l2" "$D/train_checkpoints/"
      fi
    else
      IV="$D/train_checkpoints/value_td"
    fi
    [ -e "$IV" ] || { echo "[baseline] missing objective $IV" >&2; exit 1; }
    BCKPT="$D/train_checkpoints/${TRAIN_BASELINE}_${BOBJ}.pt"
    if [ ! -f "$BCKPT" ]; then
      pixi run train model=$TRAIN_BASELINE wm="$WM" \
        cache="$CD/counterstrike_fs5.pt" h5="$CD/counterstrike_actions.h5" \
        init_value="$IV" seed=$SEED ${BASELINE_OVERRIDES:-}
      RUNB=$(ls -dt logs/*/* | head -1)
      cp "$RUNB/checkpoints/${TRAIN_BASELINE}.pt" "$BCKPT"
      echo "[baseline] trained $TRAIN_BASELINE ($BOBJ) -> $BCKPT"
    else
      echo "[baseline] reusing $BCKPT"
    fi
    [ "$TRAIN_BASELINE" = l2o ] && export L2O_CKPT="$BCKPT"
    [ "$TRAIN_BASELINE" = dmpo ] && export DMPO_CKPT="$BCKPT"
  fi

  score_ckpt () {  # score_ckpt <checkpoint> -> mean success over CKPT_VAL_SEEDS, or empty
    local CKP=$1 TOT=0 CNT=0 V
    for VS in ${CKPT_VAL_SEEDS:-50 51}; do
      pixi run eval model=pusht_lewm core.world_model.checkpoint="$WM" \
        runtime.seed=$VS evaluation.num_episodes=$EVAL_N \
        core/solver=lip core.solver.actor_path="$CKP" > /tmp/ckv.log 2>&1 || true
      V=$(grep -oE "'success_rate': [0-9.]+" /tmp/ckv.log | tail -1 | grep -oE "[0-9.]+")
      [ -n "$V" ] && { TOT=$(awk -v a=$TOT -v b=$V 'BEGIN{print a+b}'); CNT=$((CNT+1)); }
    done
    [ "$CNT" -gt 0 ] && awk -v t=$TOT -v c=$CNT 'BEGIN{printf "%.2f", t/c}'
  }
  if [ "${CKPT_SELECT:-0}" = 1 ] && ls "$D"/train_checkpoints/planner_step*.pt >/dev/null 2>&1; then
    BEST=""; BESTV="-1"; SCORES=/tmp/ckpt_scores.txt; : > $SCORES
    SEEN=/tmp/ckpt_seen.txt; : > $SEEN
    for CKP in "$D"/train_checkpoints/planner_step*.pt "$D/train_checkpoints/planner.pt"; do
      # An imported ACTOR_TAG carries planner.pt = the snapshot a previous
      # selection already deployed, so the same weights appear twice. Score
      # each distinct actor once, or the average would double-weight it.
      SUM=$(md5sum "$CKP" | cut -d' ' -f1)
      if grep -qx "$SUM" $SEEN; then echo "[ckpt-select] $(basename $CKP) duplicate, skipped"; continue; fi
      echo "$SUM" >> $SEEN
      MEAN=$(score_ckpt "$CKP" || true)
      [ -n "$MEAN" ] || { echo "[ckpt-select] $(basename $CKP) val=none"; continue; }
      echo "[ckpt-select] $(basename $CKP) val=$MEAN"
      echo "$MEAN $CKP" >> $SCORES
      if awk -v m=$MEAN -v b=$BESTV 'BEGIN{exit !(m>b)}'; then BESTV=$MEAN; BEST=$CKP; fi
    done
    # ---- CKPT_AVG=k: average the k best-scoring snapshots into ONE actor and
    # deploy it when it is at least as good on the SELECTION draws. Still one
    # actor and one K-pass; report draws stay untouched.
    if [ "${CKPT_AVG:-0}" -gt 0 ] && [ -s "$SCORES" ]; then
      TOPK=$(sort -k1,1gr "$SCORES" | head -n "${CKPT_AVG}" | awk '{print $2}')
      NK=$(printf '%s\n' "$TOPK" | grep -c . || true)
      if [ "$NK" -ge 2 ]; then
        SOUP="$D/train_checkpoints/planner_soup.pt"
        pixi run python scripts/avg_snapshots.py "$SOUP" $TOPK
        SOUPV=$(score_ckpt "$SOUP" || true)
        echo "[ckpt-avg] soup of $NK val=${SOUPV:-none} (best single $BESTV)"
        if [ -n "$SOUPV" ] && awk -v s=$SOUPV -v b=$BESTV 'BEGIN{exit !(s>=b)}'; then
          BEST="$SOUP"; BESTV="$SOUPV"; echo "[ckpt-avg] soup deployed"
        else
          echo "[ckpt-avg] soup rejected, keeping best single"
        fi
      else
        echo "[ckpt-avg] only $NK scored snapshot(s), skipping"
      fi
    fi
    if [ -n "$BEST" ] && [ "$BEST" != "$D/train_checkpoints/planner.pt" ]; then
      echo "[ckpt-select] winner $(basename $BEST) (val $BESTV) -> deployed"
      cp "$BEST" "$D/train_checkpoints/planner.pt"
    else
      echo "[ckpt-select] final wins (val $BESTV)"
    fi
  fi

  run_eval () {  # run_eval <label> <seed> <overrides...>
    local label=$1 seed=$2; shift 2
    echo "===== EVAL $label seed=$seed ====="
    # EVAL_EXTRA: extra hydra overrides appended to every eval call;
    # __SEED__/__LABEL__ are substituted per call (probe dirs etc.).
    local extra="${EVAL_EXTRA:-}"
    extra="${extra//__SEED__/$seed}"; extra="${extra//__LABEL__/$label}"
    if [ "${RECORD:-0}" = 1 ]; then case " ${RECORD_CONDS:-rlp cem_latent} " in *" $label "*) extra="$extra environment.record_path=$D/rec_${label}_s${seed}.lance";; esac; fi
    case "$label" in rlp*|gd_*) [ "${PROBES:-0}" = 1 ] && extra="$extra core.solver.record_probes=true core.solver.probe_directory=$D/probes_${label}_s${seed}";; esac
    # episode_range 16000:18685 and h25 (goal_offset 25 / budget 50) are the
    # shipped config defaults; the run exercises them rather than overriding.
    pixi run eval model=pusht_lewm core.world_model.checkpoint="$WM" \
      runtime.seed=$seed \
      evaluation.num_episodes=$EVAL_N \
      "$@" $extra 2>&1 | tee "$D/evallog_${label}_s${seed}.txt" | grep -v "Solver\|solve completed" \
      || echo "[eval-failed] $label seed=$seed (see evallog_${label}_s${seed}.txt)"
    local run=$(ls -dt logs/*/* | head -1)
    local out="$D/results_${label}_s${seed}.txt"
    cp "$run"/*results*.txt "$out" 2>/dev/null || find "$run" -name '*.txt' -exec cp {} "$out" \;
    if [ "${SAVE_VIDEOS:-0}" = 1 ]; then
      VD=$(find "$run" -type d -name 'videos' | head -1)
      [ -n "$VD" ] && cp -r "$VD" "$D/videos_${label}_s${seed}"
    fi
    echo "----- RESULT $label seed=$seed -----"
    cat "$out" 2>/dev/null || echo "metrics: MISSING"
  }

  [ "${POST_ONLY:-0}" = 1 ] && EVAL_SEEDS=""
  for ES in $EVAL_SEEDS; do
    for COND in $EVAL_CONDS; do
      case $COND in
        rlp)
          run_eval rlp $ES core/solver=lip \
            core.solver.actor_path="$D/train_checkpoints/planner.pt"
          for DA in ${DEPLOY_AMAX:-}; do
            DTAG=da${DA/./p}
            pixi run python -c "import torch; f='$D/train_checkpoints/planner.pt'; ck=torch.load(f, map_location='cpu', weights_only=False); ck['amax']=float('$DA'); torch.save(ck, f.replace('planner.pt', 'planner_${DTAG}.pt')); print('[deploy-rewrite] amax ->', '$DA')"
            run_eval "rlp_${DTAG}" $ES core/solver=lip \
              core.solver.actor_path="$D/train_checkpoints/planner_${DTAG}.pt"
          done;;
        rlp_ng)  # grounding-trained actor deployed WITHOUT the grounding term (training-time-only ablation)
          run_eval rlp_ng $ES core/solver=lip core.solver.ground_weight=0 \
            core.solver.actor_path="$D/train_checkpoints/planner.pt";;
        rlp_ceminit)
          run_eval rlp_ceminit $ES core/solver=lip core.solver.init_mode=cem \
            core.solver.actor_path="$D/train_checkpoints/planner.pt";;
        rlp_ceminit_bl*)  # band-limited updates from the CEM plan (E25): keep N temporal DCT modes
          run_eval "$COND" $ES core/solver=lip core.solver.init_mode=cem \
            core.solver.band_limit=${COND#rlp_ceminit_bl} \
            core.solver.actor_path="$D/train_checkpoints/planner.pt";;
        rlp_bl*)          # band-limited updates from zero init (the deployed setting)
          run_eval "$COND" $ES core/solver=lip core.solver.band_limit=${COND#rlp_bl} \
            core.solver.actor_path="$D/train_checkpoints/planner.pt";;
        rlp_ceminit_k*)   # K ladder from the CEM plan: rlp_ceminit_k0 is E1's control
          run_eval "$COND" $ES core/solver=lip core.solver.init_mode=cem \
            core.solver.iters_override=${COND#rlp_ceminit_k} \
            core.solver.actor_path="$D/train_checkpoints/planner.pt";;
        gd_ceminit_k*)    # same loop, same energy, plain gradient step instead of the learned rule
          for LR in ${GD_LRS:-0.03}; do
            run_eval "${COND}_lr${LR/./p}" $ES core/solver=lip core.solver.init_mode=cem \
              core.solver.update_rule=gradient core.solver.gd_lr=$LR \
              core.solver.iters_override=${COND#gd_ceminit_k} \
              core.solver.actor_path="$D/train_checkpoints/planner.pt"
          done;;
        gd_k*)            # plain gradient from zero init
          for LR in ${GD_LRS:-0.03}; do
            run_eval "${COND}_lr${LR/./p}" $ES core/solver=lip \
              core.solver.update_rule=gradient core.solver.gd_lr=$LR \
              core.solver.iters_override=${COND#gd_k} \
              core.solver.actor_path="$D/train_checkpoints/planner.pt"
          done;;
        rlp_k*)           # K ladder from zero init (rlp_k64 = E2's divergence check)
          run_eval "$COND" $ES core/solver=lip core.solver.iters_override=${COND#rlp_k} \
            core.solver.actor_path="$D/train_checkpoints/planner.pt";;
        cem_value)   # E4: CEM driven by the co-trained critic energy (windowed) instead of latent L2
          run_eval cem_value $ES core/solver=cem core/value=metric core.value.mode=replacement \
            "core.value.checkpoints=[$D/train_checkpoints/value_ac]";;
        cem_tdvalue)  # E4b: CEM on the offline TD teacher
          run_eval cem_tdvalue $ES core/solver=cem core/value=metric core.value.mode=replacement \
            "core.value.checkpoints=[$D/train_checkpoints/value_td]";;
        cem_hybrid)   # E11: CEM on standardized latent L2 + lam * standardized critic (near-goal precision from
                      # the latent, long-range ordering from the critic); one eval per lam in HYB_LAMS
          for LAM in ${HYB_LAMS:-1.0}; do
            run_eval "cem_hybrid_l${LAM/./p}" $ES core/solver=cem core/value=metric core.value.mode=hybrid \
              core.value.blend_weight=$LAM "core.value.checkpoints=[$D/train_checkpoints/value_ac]"
          done;;
        cem_hybrid_td)  # E11b: same blend with the offline TD teacher
          for LAM in ${HYB_LAMS:-1.0}; do
            run_eval "cem_hybrid_td_l${LAM/./p}" $ES core/solver=cem core/value=metric core.value.mode=hybrid \
              core.value.blend_weight=$LAM "core.value.checkpoints=[$D/train_checkpoints/value_td]"
          done;;
        rlp_tdvalue)  # E6a: same actor, deploy critic swapped to the offline TD teacher
          run_eval rlp_tdvalue $ES core/solver=lip core.solver.value_path="$D/train_checkpoints/value_td" \
            core.solver.actor_path="$D/train_checkpoints/planner.pt";;
        cem_latent) run_eval cem_latent $ES core/solver=cem;;
        # ---- solver matrix (2026-09-19, user request): the same energy, optimised by
        # every solver in the campaign, at BOTH objectives. "_latent" = parameter-free
        # latent L2 (no value override); "_value" = the deployed critic. Sampler budgets
        # are the published defaults (CEM/MPPI 300x30 = 9,000 rollouts; Adam 100x30),
        # against RLP's single K=8 pass -- the asymmetry is the point of the comparison.
        mppi_latent) run_eval mppi_latent $ES core/solver=mppi;;
        mppi_value)
          run_eval mppi_value $ES core/solver=mppi core/value=metric core.value.mode=replacement \
            "core.value.checkpoints=[$D/train_checkpoints/value_ac]";;
        adam_latent) run_eval adam_latent $ES core/solver=adam;;
        adam_value)
          run_eval adam_value $ES core/solver=adam core/value=metric core.value.mode=replacement \
            "core.value.checkpoints=[$D/train_checkpoints/value_ac]";;
        # L2O / DMPO are LEARNED inner loops: each needs its own trained checkpoint,
        # supplied via L2O_CKPT / DMPO_CKPT (they have never been trained on PushT).
        l2o_latent)
          [ -n "${L2O_CKPT:-}" ] || { echo "[skip] l2o_latent: no L2O_CKPT"; continue; }
          run_eval l2o_latent $ES core/solver=l2o core.solver.actor_path="$L2O_CKPT";;
        l2o_value)
          [ -n "${L2O_CKPT:-}" ] || { echo "[skip] l2o_value: no L2O_CKPT"; continue; }
          run_eval l2o_value $ES core/solver=l2o core.solver.actor_path="$L2O_CKPT" \
            core.solver.value_path="$D/train_checkpoints/value_ac";;
        dmpo_latent)
          [ -n "${DMPO_CKPT:-}" ] || { echo "[skip] dmpo_latent: no DMPO_CKPT"; continue; }
          run_eval dmpo_latent $ES core/solver=dmpo core.solver.actor_path="$DMPO_CKPT";;
        dmpo_value)
          [ -n "${DMPO_CKPT:-}" ] || { echo "[skip] dmpo_value: no DMPO_CKPT"; continue; }
          run_eval dmpo_value $ES core/solver=dmpo core.solver.actor_path="$DMPO_CKPT" \
            core.solver.value_path="$D/train_checkpoints/value_ac";;
        cem_l2w4)   # windowed latent-L2 control: 4-frame window vs the tiled goal, same input as the w4 critic
          if [ ! -d "$D/train_checkpoints/value_l2w4" ]; then
            pixi run train model=metric learner=l2 cache="$CD/counterstrike_fs1.pt" window_frames=4 window_lag=5 \
              output.checkpoint=value_l2w4 device=cpu
            RUNL=$(ls -dt logs/*/* | head -1); mkdir -p "$D/train_checkpoints"
            cp -r "$RUNL/checkpoints/value_l2w4" "$D/train_checkpoints/"
          fi
          run_eval cem_l2w4 $ES core/solver=cem core/value=metric core.value.mode=replacement \
            "core.value.checkpoints=[$D/train_checkpoints/value_l2w4]";;
        noop) run_eval noop $ES core/policy=no_move;;
      esac
    done
  done
  echo "COUNTERSTRIKE_DONE tag=$EXPERIMENT_TAG"
  if [ -n "${POST_SCRIPT_B64:-}" ]; then
    echo "$POST_SCRIPT_B64" | base64 -d > /tmp/post.py
    echo "[post] running post script"
    env $POST_ENV D="$D" CD="$CD" H5="$H5" pixi run python /tmp/post.py || echo "[post] FAILED"
  fi
