# Reacher paper-winner replication (2026-08-13) -- copy of the rlp12
# campaign yaml (campaigns/rlp12_reacher_w1/reacher_w1.yaml @ origin/eval-sweep,
# already clean-split: train 0:8000 / eval 8000:10000) with file mounts
# vendored into scripts/sky/overlays_reacher/ and EXPAND made effective in
# GRID=latched_terminal_search (paper winners are expand=0 on Reacher).
#
# rlp12_reacher_w1 campaign copy of configs/rlp_reacher_grid_sweep.yaml
# (working-tree state that launched jobs 4759/4760/4804/4805), plus:
#   1. the latent measurement arm honors VALUE_FRAMES (l2window${VALUE_FRAMES}
#      via make_l2window_n.py) instead of hardcoding l2window3.pt — VALUE_FRAMES=1
#      is the paper's own terminal-L2 cost through the identical metric hook;
#   2. GRID=w1_diagnosis: PLDM window-1 RLP deconfound, {expand 0,1} x
#      {amax 1.0,1.8} at mw0.3/lr1e-4 — separates expand-weight co-exploitation
#      from amax transfer in the w1 collapse (87.8/60.7 vs w3 99.8/90.7).
# Defaults VALUE_FRAMES=3: behavior identical to the parent yaml.
#
# Canonical Reacher RLP grid-sweep configuration.
#
# Runs the EXACT paper code (reacher/pod_src_20260804 snapshot, patched
# pad-context/vframes3/detseed) with the campaign-standardized protocol:
#   data      episodes 0:8000 train / 8000:10000 eval (clean split)
#   training  steps 6000, batch 256, replay-prob 0.5; expand-weight is 0 for
#             LeWM and 1.0 for PLDM (the independently established winners),
#             freeze-critic-frac 0.5, gamma 0.98, expectile 0.1->0.03,
#             critic-lr 1e-3->1e-4, n-step 50, iters 8, horizon 5, max-delta 12
#   TD/value  3-frame window quasimetric (reacher's latent interface) at the
#             standardized numbers: expectile 0.03, gamma 0.98, steps 12000
# RLP-specific hypers stay reacher-specific: LeWM amax=2.4, mean-weight=.3,
# actor-lr=1e-4; PLDM amax=1.4, mean-weight=.1, actor-lr=3e-4. Searches must
# override those settings explicitly.
# Eval: either legacy held-at-end or separate latched first-hit passes at
# tau=0.1/0.05. First-hit passes terminate each environment immediately on
# reaching their threshold; h25, budget 50, reporting seeds 42-44, egl.
# Reference (paper, steps 1000 / batch 128 / expand 0, leaked data):
# LIP lejepa 98.2 +- 1.2, pldm 94.2 +- 4.1 @0.1; clean-split lejepa 97.7.

name: reacher-sweep-w1

envs:
  BASE: lejepa             # lejepa | pldm  (tarball: lejepa<-lewm, pldm<-pldm)
  TRAIN_SEEDS: "0 1 2"
  SMOKE: "0"
  GRID: "amax"              # amax | cross | pldm_refine | telescoping | measurements | latched_measurements | latched_terminal_search
  AMFIX: ""                 # cross mode: pinned amax (default per base)
  CROSS_EXPANDS: "0 0.5 1.0 3.0"  # override for targeted per-base dose screens
  CROSS_REPLAYS: "0 0.25 0.5"
  PWM_AMAX: ""              # GRID=pwm: space-separated amax values to sweep.
                            # Empty = the single RLP-tuned value per base, which
                            # is how the collapsed 2505/2506 runs were produced.
                            # PWM's own amax optimum has never been measured;
                            # it was inherited from the RLP arm on the assumption
                            # that a knob tuned for one solver transfers to another.
  REPLAY: "0.5"             # replay-prob; SWEPT in cross mode
  EXPAND: ""                # auto: LeWM 0, PLDM 1; any other value is explicit
  STEPS: "6000"             # actor optimization steps; long-data sweep uses 12k/18k
  CKPT_EVERY: "0"           # final actor only; no intermediate actor snapshots
  TRAIN_TIMEOUT: "64800"    # long actor runs: 18 hours per configuration
  ONLYCFG: ""
  PLANNERS: "cem adam mppi"   # GRID=planners: sampling/gradient arms
  # 2026-08-12 user-set reacher default: 10 optimization steps per decision
  # (CEM/MPPI 300x10, Adam 100x10). NOTE: the solver YAML default, the
  # upstream stable-worldmodel default, and the LeWM paper's appendix are all
  # 30 steps; every reacher measurement recorded before 2026-08-12 used 30.
  # Do not mix 10-step and 30-step cells in one table.
  PLANNER_STEPS: "10"
  PLANNER_RH: "5"             # deadline-CEM comparison overrides to 1
  PLANNER_DEADLINE: ""        # graded environment step; e.g. 50
  SUCCESS_THRESHOLDS: "0.1 0.05" # separate first-hit simulator passes
  MEASUREMENT_COSTS: "latent value" # latched measurements: same-window L2 vs learned value
  INCLUDE_PAPER: "0"        # 1 = add the checkpoint-verified paper recipe cell
  REPORT_DRAWS: "42 43 44"  # paper reacher protocol reported 42-47
  VALUE_EXPECTILE: "0.03"   # paper init value artifact used 0.05 (window3_*_e005)
  VALUE_FRAMES: "3"           # frames in the window value/critic; 1 = single-frame ablation
  PRE_MEASUREMENT_SMOKE: "0" # tiny exact-protocol gate before the reporting cells
  CELL_TIMEOUT: "21600"
  COST: "value"             # value = the window quasimetric | latent = l2window3
                            # (parameter-free L2 in the SAME 3-frame window space;
                            #  this is what the paper calls "Latent + CEM" on reacher)
  MAXPAR: "4"
  ACTOR_ONLY: "0"          # established recipe co-trains critic for first half
  FINAL_ONLY: "1"          # evaluate only the final actor checkpoint
  SELECTION_ONLY: "0"      # 1 = draws 50/51 now; report 42-44 after winner selection
  REPORT_ONLY: "0"         # 1 = draws 42-44 only; suppress 50/51
  REUSE_ONLY: "0"          # 1 = missing final actor is fatal; never retrain
  ACTOR_IMPORT_TAG: ""     # reuse-only: copy final actors from these persist tags (space-separated)
  GRAPHED_MODE: "false"    # lip eval: false | true | verify (CUDA-graphed inference)
  HELD_AT_END: "0"         # 1 = score the latched grid held-at-end (evone; no early termination)
  W1_AMS: "0.6 1.0 1.4 1.8 2.4"  # GRID=w1_grid: amax axis (one value per shard job)
  W1_MWS: "0.1 0.3 0.5"          # GRID=w1_grid: mean-weight axis
  W1_LRS: "1e-4 3e-4"            # GRID=w1_grid: actor-lr axis
  W1_EXPANDS: "0 1"              # GRID=w1_grid: expand-weight axis
  BATCH: "256"
  PANTHEON_USER: armin@pantheon.inc
  EXPERIMENT_TAG: rlp-pldm-reacher-refine-20260810
  WANDB_PROJECT: RLP
  WANDB_ENTITY: armin-sommer

secrets:
  WANDB_API_KEY: null
  GIT_TOKEN: null

resources:
  accelerators: H200:4
  cpus: 80
  memory: 920
  image_id: docker:pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel
  labels:
    telemetry-contract: training-v1

volumes:
  /checkpoints: checkpoints

config:
  kubernetes:
    pod_config:
      spec:
        nodeSelector:
          pantheon.inc/raid0: "enabled"
        volumes:
          - name: raid0
            hostPath:
              path: /mnt/raid0
              type: Directory
        containers:
          - volumeMounts:
              - mountPath: /mnt/raid0
                name: raid0

file_mounts:
  /tmp/codex-overlays/train_lip_ac.py: ./scripts/sky/overlays_reacher/train_lip_ac.py
  /tmp/codex-overlays/latent_cache.py: ./scripts/sky/overlays_reacher/latent_cache.py
  /tmp/codex-overlays/lip.py: ./scripts/sky/overlays_reacher/lip.py
  /tmp/codex-overlays/policy.py: ./scripts/sky/overlays_reacher/policy.py
  /tmp/codex-overlays/eval_wm.py: ./scripts/sky/overlays_reacher/eval_wm.py
  /tmp/codex-overlays/world.py: ./scripts/sky/overlays_reacher/world.py
  /tmp/codex-overlays/make_l2window_n.py: ./scripts/sky/overlays_reacher/make_l2window_n.py

setup: |
  set -euo pipefail
  sudo apt-get update -qq
  sudo apt-get install -yqq git git-lfs zstd libegl1 libgl1 libglew-dev libosmesa6 patchelf >/dev/null 2>&1 || true

  cd ~
  if [ ! -d repo ]; then
    git clone -q --depth 1 --branch eval-sweep \
      "https://x-access-token:${GIT_TOKEN}@github.com/armin-sommer/Value_Metric_LeWM.git" repo
  fi
  cd ~/repo && git remote set-url origin https://github.com/armin-sommer/Value_Metric_LeWM.git
  echo "[repo] $(git rev-parse --short HEAD)"

  # deps: main-tree extras for the common stack, then the reacher campaign's
  # load-bearing pin (transformers 4.49 => NO encoder key renames at convert)
  pip install -q -e "$HOME/repo/stable-worldmodel[train,format]" \
    opencv-python-headless hdf5plugin hf_transfer wandb dm_control mujoco 2>&1 | tail -2
  pip install -q "transformers==4.49.0" 2>&1 | tail -1
  cp /tmp/codex-overlays/train_lip_ac.py "$HOME/repo/reacher/pod_src_20260804/scripts/plan/train_lip_ac.py"
  cp /tmp/codex-overlays/latent_cache.py "$HOME/repo/reacher/pod_src_20260804/stable_worldmodel/trm/latent_cache.py"
  cp /tmp/codex-overlays/lip.py "$HOME/repo/reacher/pod_src_20260804/stable_worldmodel/solver/lip.py"
  cp /tmp/codex-overlays/policy.py "$HOME/repo/reacher/pod_src_20260804/stable_worldmodel/policy.py"
  cp /tmp/codex-overlays/eval_wm.py "$HOME/repo/reacher/pod_src_20260804/scripts/plan/eval_wm.py"
  cp /tmp/codex-overlays/world.py "$HOME/repo/reacher/pod_src_20260804/stable_worldmodel/world/world.py"
  python3 -c 'import os, torch; n=torch.cuda.device_count(); m=int(os.environ.get("MAXPAR","8")); assert n>=m, f"{n} GPUs < MAXPAR {m}"; print(f"[env] torch {torch.__version__} gpus {n}")'

  WANDB_ROOT=/mnt/raid0/rlp-wandb/${EXPERIMENT_TAG}
  sudo mkdir -p "$WANDB_ROOT"/{runs,artifacts,cache}
  sudo chmod 777 "$WANDB_ROOT" "$WANDB_ROOT"/{runs,artifacts,cache}
  export WANDB_DIR="$WANDB_ROOT/runs"
  export WANDB_ARTIFACT_DIR="$WANDB_ROOT/artifacts"
  export WANDB_CACHE_DIR="$WANDB_ROOT/cache"

  python3 -c "
  import os, wandb
  wandb.login(key=os.environ['WANDB_API_KEY'], relogin=True)
  r = wandb.init(project=os.environ['WANDB_PROJECT'], entity=os.environ['WANDB_ENTITY'],
                 name='reacher-sweep-probe-' + os.environ['BASE'], job_type='probe', reinit=True)
  r.log({'probe': 1}); r.finish(); print('[wandb] verified')
  "

  SCRATCH=/mnt/raid0/${EXPERIMENT_TAG}
  sudo mkdir -p "$SCRATCH" && sudo chmod 777 "$SCRATCH"
  if [ -e /workspace ] && [ ! -L /workspace ]; then
    sudo rmdir /workspace || { echo "refusing non-empty image /workspace"; exit 1; }
  fi
  sudo ln -sfn "$SCRATCH" /workspace

  # recreate the pod's /workspace layout so every hardcoded path in the
  # snapshot works verbatim
  sudo mkdir -p /workspace && sudo chown $(whoami) /workspace
  mkdir -p /workspace/datasets_canon/lewm-reacher /workspace/pretrained_tars \
           /workspace/pretrained /workspace/swm_home /workspace/caches \
           /workspace/metrics /workspace/actors /workspace/logs /workspace/results /workspace/_hfdl
  ln -sfn ~/repo/reacher/pod_src_20260804 /workspace/swm_cem
  ln -sf ~/repo/reacher/pod_src_20260804/workspace_drivers/train_window.py /workspace/train_window.py

  export STABLEWM_HOME=/workspace/swm_home PYTHONPATH=/workspace/swm_cem
  export HDF5_PLUGIN_PATH=$(python3 -c 'import hdf5plugin; print(hdf5plugin.PLUGIN_PATH)')
  CANON=/workspace/datasets_canon/lewm-reacher/reacher.h5

  # dataset (93G extracted)
  if [ ! -f "$CANON" ]; then
    cd /workspace/_hfdl
    HF_HUB_ENABLE_HF_TRANSFER=1 python3 -c "from huggingface_hub import hf_hub_download; hf_hub_download('quentinll/lewm-reacher','reacher.tar.zst',repo_type='dataset',local_dir='.')"
    tar -I zstd --no-same-owner -xf reacher.tar.zst -C /workspace/datasets_canon/lewm-reacher/
    rm -f reacher.tar.zst
  fi
  df -h /workspace | tail -1

  # slim h5 FIRST: renames ep_idx -> episode_idx; the converter reads it
  cp ~/repo/reacher/pod_src_20260804/workspace_drivers/build_slim_h5.py /workspace/
  [ -f /workspace/reacher_slim.h5 ] || python3 /workspace/build_slim_h5.py 2>&1 | tail -2

  # base from the wandb artifact (tarball names: lejepa<-lewm, pldm<-pldm)
  TAR=lewm; [ "$BASE" = pldm ] && TAR=pldm
  if [ ! -d /workspace/swm_home/checkpoints/${BASE}_reacher ]; then
    python3 - <<'PY'
  import os, shutil, wandb
  api = wandb.Api()
  tar = "lewm" if os.environ["BASE"] == "lejepa" else "pldm"
  a = api.artifact(f"armin-sommer/RLP/reacher_base_{tar}:latest", type="wm_base")
  d = a.download()
  for f in os.listdir(d):
      shutil.copy(os.path.join(d, f), "/workspace/pretrained_tars/")
      print("[base]", f, flush=True)
  PY
    tar -I zstd --no-same-owner -xf /workspace/pretrained_tars/${TAR}.tar.zst -C /workspace/pretrained/
    # converter patch: source parity pixels + episode bookkeeping from the h5
    # (handles the ep_idx rename); committed in dino_patch_metric
    cp ~/repo/reacher/dino_patch_metric/patch_convert_h5.py /workspace/
    (cd /workspace && python3 patch_convert_h5.py 2>&1 | tail -1) || true
    cd /workspace/swm_cem
    CUDA_VISIBLE_DEVICES=0 python3 scripts/plan/convert_reacher_bases.py \
      --only ${BASE} --from-h5 --h5 "$CANON" 2>&1 | tail -3
  fi
  [ -d /workspace/swm_home/checkpoints/${BASE}_reacher ] || { echo "convert failed"; exit 1; }

  # slim h5 (actions + episode bookkeeping; renames ep_idx -> episode_idx)
  [ -f /workspace/reacher_slim.h5 ] || python3 /workspace/build_slim_h5.py 2>&1 | tail -2

  # caches: fs1 (state-key qpos) -> filter to episodes 0:7999 -> fs5
  cd /workspace/swm_cem
  C1F=/workspace/caches/canon_${BASE}_fs1_full.pt
  C1=/workspace/caches/tr_${BASE}_fs1.pt
  C5=/workspace/caches/tr_${BASE}_fs5.pt
  if [ ! -f "$C5" ]; then
    CUDA_VISIBLE_DEVICES=0 python3 scripts/trm/cache_latents.py \
      --wm /workspace/swm_home/checkpoints/${BASE}_reacher --dataset "$CANON" \
      --out "$C1F" --state-key qpos --batch-size 512 > /workspace/logs/cache1.log 2>&1
    python3 - <<'PY'
  import os, torch, numpy as np
  B = os.environ["BASE"]
  src, dst = f"/workspace/caches/canon_{B}_fs1_full.pt", f"/workspace/caches/tr_{B}_fs1.pt"
  c = torch.load(src, map_location="cpu", weights_only=False)
  e = np.asarray(c["episode_idx"]); m = e < 8000
  out = {k: (v[torch.from_numpy(m)] if torch.is_tensor(v) and len(v) == len(e)
             else (v[m] if hasattr(v, "shape") and len(v) == len(e) else v)) for k, v in c.items()}
  assert np.asarray(out["episode_idx"]).max() < 8000
  torch.save(out, dst)
  print(f"[filter] {len(e)} -> {len(np.asarray(out['episode_idx']))} rows", flush=True)
  PY
    rm -f "$C1F"
    CUDA_VISIBLE_DEVICES=0 python3 scripts/trm/subsample_cache.py --in "$C1" --out "$C5" \
      --frameskip 5 > /workspace/logs/cache5.log 2>&1
  fi

  # window value, STANDARDIZED numbers on the clean split
  W3=/workspace/metrics/window${VALUE_FRAMES:-3}_${BASE}_std.pt
  WSTEPS=12000; [ "${SMOKE:-0}" = 1 ] && WSTEPS=2000
  [ -f "$W3" ] || CUDA_VISIBLE_DEVICES=0 python3 /workspace/train_window.py \
    --cache "$C1" --lag 5 --frames ${VALUE_FRAMES:-3} --expectile ${VALUE_EXPECTILE:-0.03} --gamma 0.98 \
    --n-step 50 --steps $WSTEPS --seed 0 --out "$W3" > /workspace/logs/w3.log 2>&1 || true
  [ -f "$W3" ] || { echo "window value failed"; tail -20 /workspace/logs/w3.log; exit 1; }
  echo "[setup] reacher/${BASE} ready"

run: |
  set -uo pipefail
  # pod_src_20260804's LIPSolver predates the graphed kwarg; pass it only when enabled
  GRAPHED_FLAG=""
  [ "${GRAPHED_MODE:-false}" != false ] && GRAPHED_FLAG="+solver.graphed=${GRAPHED_MODE}"
  # node + physical GPU identity, so an XID alert (which names only a node
  # and a PCI address) can be tied to a job by grep instead of by hand.
  echo "[node] $(hostname) | gpus: $(nvidia-smi --query-gpu=index,uuid --format=csv,noheader 2>/dev/null | tr '\n' ' ' || echo unavailable)"
  cd /workspace/swm_cem
  export STABLEWM_HOME=/workspace/swm_home PYTHONPATH=/workspace/swm_cem TQDM_DISABLE=1
  export OMP_NUM_THREADS=8 MKL_NUM_THREADS=8
  export HDF5_PLUGIN_PATH=$(python3 -c 'import hdf5plugin; print(hdf5plugin.PLUGIN_PATH)')
  export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  CANON=/workspace/datasets_canon/lewm-reacher/reacher.h5
  SLIM=/workspace/reacher_slim.h5
  WM=/workspace/swm_home/checkpoints/${BASE}_reacher
  PROFILE=reacher-lewm; [ "$BASE" = pldm ] && PROFILE=reacher-pldm
  if [ -z "${EXPAND:-}" ]; then
    EXPAND=0
    [ "$BASE" = pldm ] && EXPAND=1
  fi
  export EXPAND
  C1=/workspace/caches/tr_${BASE}_fs1.pt
  C5=/workspace/caches/tr_${BASE}_fs5.pt
  W3=/workspace/metrics/window${VALUE_FRAMES:-3}_${BASE}_std.pt
  PERSIST=/checkpoints/${PANTHEON_USER}/${EXPERIMENT_TAG}
  export PERSIST
  ACTORS=$PERSIST/actors; METRICS=$PERSIST/metrics; RESULTS=$PERSIST/results
  if [ -n "${ACTOR_IMPORT_TAG:-}" ]; then
    mkdir -p "$ACTORS"
    for _t in ${ACTOR_IMPORT_TAG}; do
      cp -n /checkpoints/${PANTHEON_USER}/${_t}/actors/*.pt "$ACTORS"/ 2>/dev/null || true
    done
    echo "[import] $(ls "$ACTORS" | wc -l) actors from: ${ACTOR_IMPORT_TAG}"
  fi
  LOGDIR=$PERSIST/logs
  FAILDIR=$RESULTS/failures
  mkdir -p "$ACTORS" "$METRICS" "$RESULTS" "$LOGDIR" "$FAILDIR"
  # Failure sentinels are attempt-local.  A corrected managed-job relaunch uses
  # the same EXPERIMENT_TAG to resume training state and must not inherit a
  # stale hard-failure verdict from the previous payload.
  find "$FAILDIR" -maxdepth 1 -type f -delete
  DRV=$RESULTS/driver.log
  SUM=$RESULTS/summary.csv; touch "$SUM"
  SLOT=/workspace/logs/slots; mkdir -p "$SLOT"
  # GRANULAR amax (0.2 steps) around each base's carded winner -- the old
  # amax closure predates the standardized recipe and must be re-found.
  # mw/lr pinned to two anchors: the base's carded winner + the cross-env
  # winner (m0.3, 3e-4).
  AMS="1.4 1.6 1.8 2.0 2.2 2.4 2.6"; COMBOS="0.3:1e-4 0.3:3e-4"
  [ "$BASE" = pldm ] && { AMS="1.2 1.4 1.6 1.8 2.0 2.2 2.4"; COMBOS="0.1:3e-4 0.3:3e-4"; }
  SEL="50 51"; REP="${REPORT_DRAWS:-42 43 44}"
  [ "${SELECTION_ONLY:-0}" = 1 ] && REP=""
  [ "${REPORT_ONLY:-0}" = 1 ] && SEL=""
  # Planner arms have no hyperparameter/checkpoint selection; measure only the
  # three predeclared reporting draws. RLP keeps 50/51 for model selection.
  CFG=()
  for AM in $AMS; do
    for CO in $COMBOS; do
      MW=${CO%%:*}; LR=${CO##*:}
      CFG+=("rs_a${AM}_m${MW}_l${LR} $AM $MW $LR")
    done
  done
  STEPS=${STEPS:-6000}
  if [ "${SMOKE:-0}" = 1 ]; then
    CFG=("${CFG[0]}"); TRAIN_SEEDS="0"; STEPS=60; SEL="50"; REP=""
    echo "[smoke] one config, 60 steps"
  fi
  # GRID=cross: the expand x replay ablation at a pinned amax. Rows carry
  # their own expand/replay so one job measures the whole 4x3 cross.
  if [ "${GRID}" = cross ]; then
    AF=${AMFIX:-2.2}
    [ "$BASE" = pldm ] && AF=${AMFIX:-1.4}
    CO_MW=0.3; CO_LR=1e-4
    [ "$BASE" = pldm ] && { CO_MW=0.1; CO_LR=3e-4; }
    CFG=()
    for XW in ${CROSS_EXPANDS:-0 0.5 1.0 3.0}; do
      for RP in ${CROSS_REPLAYS:-0 0.25 0.5}; do
        CFG+=("rs_x${XW}_r${RP} $AF $CO_MW $CO_LR $XW $RP")
      done
    done
  fi
  # Twelve targeted PLDM refinements, evaluated at all three training seeds:
  # amax {1.2,1.4,1.6} x mean-weight {0.2,0.5} x actor-lr {1e-4,6e-4}.
  # The already-completed m0.3/l3e-4 runs are the centre anchor. This factorial
  # probes both sides of mean weighting and learning rate while leaving all
  # critic/data/co-training hypers untouched.
  if [ "${GRID}" = pldm_refine ]; then
    [ "$BASE" = pldm ] || { echo "GRID=pldm_refine requires BASE=pldm"; exit 2; }
    CFG=()
    for AM in 1.2 1.4 1.6; do
      for MW in 0.2 0.5; do
        for LR in 1e-4 6e-4; do
          CFG+=("rs_ref_a${AM}_m${MW}_l${LR} $AM $MW $LR")
        done
      done
    done
  fi
  # Six stop-gradient telescoping configs plus one fixed terminal control.
  # Fields: name amax mean-weight actor-lr expand replay temporal-objective.
  if [ "${GRID}" = telescoping ] || [ "${GRID}" = telescoping_all ]; then
    CFG=()
    if [ "$BASE" = pldm ]; then AMS="1.2 1.4 1.6"; CONTROL=1.4; MW=0.1; CLR=3e-4
    else AMS="2.0 2.4 2.8"; CONTROL=2.4; MW=0.3; CLR=1e-4; fi
    for AM in $AMS; do
      for LR in 1e-4 3e-4; do
        CFG+=("telex_a${AM}_l${LR} $AM $MW $LR 0 0.5 tel-exact")
      done
    done
    CFG+=("terminal_control_a${CONTROL} ${CONTROL} $MW $CLR 0 0.5 terminal")
  fi
  # Standard terminal-objective search under the replacement first-hit
  # reporting protocol. Thresholds affect evaluation only: every final actor
  # is evaluated in separate tau=.1 and tau=.05 simulator passes.
  if [ "${GRID}" = latched_terminal_search ]; then
    CFG=()
    if [ "$BASE" = pldm ]; then AMS="1.0 1.4 1.8"; BEST_EXPAND=1
    else AMS="2.0 2.4 2.8"; BEST_EXPAND=0; fi
    # paper App C.3 winners use expand 0 everywhere on Reacher; honor an
    # explicit EXPAND override (2026-08-13 split replication)
    [ -n "${EXPAND:-}" ] && BEST_EXPAND=$EXPAND
    if [ "${INCLUDE_PAPER:-0}" = 1 ]; then
      # the checkpoint-verified recipe behind the paper's reacher numbers
      # (reacher/HYPERS_20260802.md): LeWM a2.2/m0.3/lr1e-4, PLDM a1.8/m0.5/lr3e-4
      CFG+=("rs_latched_terminal_a2.2_m0.3_l1e-4 2.2 0.3 1e-4 ${BEST_EXPAND} 0.5 terminal")
    fi
    for AM in $AMS; do
      for MW in 0.1 0.3 0.5; do
