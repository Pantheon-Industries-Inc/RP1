      r.summary[f"cell/{k}_held05"] = a; r.summary[f"cell/{k}_held10"] = b
  art = wandb.Artifact(f"reacher_valueplanners_{base}_cells", type="results")
  art.add_file(f"/workspace/results/{cost}_planners_{readout}.csv")
  r.log_artifact(art); r.finish()
  print("[wandb] logged")
  PY
    echo "[${COST}-planners] complete"
    done
    [ "${GRID}" = telescoping_all ] || exit 0
  fi

  for SEED in ${TRAIN_SEEDS}; do
  for row in "${CFG[@]}"; do
    set -- $row; NM=$1; AMAX=$2; MW=$3; LR=$4; XW=${5:-$EXPAND}; RP=${6:-$REPLAY}; TOBJ=${7:-terminal}
    [ "${ACTOR_ONLY:-0}" = 1 ] && XW=0
    OUT=$ACTORS/${NM}_${BASE}_s${SEED}.pt
    S=$(acquire)
    (
      if [ ! -f "$OUT" ]; then
        if [ "${REUSE_ONLY:-0}" = 1 ]; then
          echo "[reuse-only] missing final actor: $OUT" >&2
          touch "$FAILDIR/train_${NM}_s${SEED}"
        else
          LRF=$(python3 -c "print('%g' % (float('$LR') / 10))")
          STATE=${OUT}.trainstate.pt
          STATE_ARGS=()
          if [ "${ACTOR_ONLY:-0}" = 1 ]; then
            STATE_ARGS=(--save-train-state "$STATE" --state-every 100)
            [ -f "$STATE" ] && STATE_ARGS+=(--resume-state "$STATE")
          fi
          DGFLAG=""; [ "${DROP_GRAD:-0}" = 1 ] && DGFLAG="--drop-grad"
          CUDA_VISIBLE_DEVICES=$S timeout ${TRAIN_TIMEOUT:-64800} python3 scripts/plan/train_lip_ac.py \
          --cache "$C5" --cache-td "$C1" --h5 "$SLIM" --wm "$WM" --pad-context ${DGFLAG} \
          --init-value "$W3" \
          --recipe-profile "$PROFILE" \
          --arch v4 --iters 8 --horizon 5 --max-delta 12 --n-step 50 \
          --gamma 0.98 --expectile 0.1 --expectile-final 0.03 \
          --critic-lr 1e-3 --critic-lr-final 1e-4 \
          --replay-prob $RP --expand-weight $XW --freeze-critic-frac 0.5 ${FROZEN_ARGS} \
          --lambda-schedule uniform --mean-weight $MW --amax $AMAX \
          --temporal-objective "$TOBJ" \
          --steps $STEPS --batch ${BATCH:-128} --ckpt-every ${CKPT_EVERY:-0} \
          --actor-lr $LR --actor-lr-final $LRF --seed ${SEED} \
          "${STATE_ARGS[@]}" \
          --wandb-run-name "reacher_train_${NM}_${BASE}_s${SEED}" \
          --wandb-run-id "${EXPERIMENT_TAG}-${NM}-${BASE}-s${SEED}" \
          --out "$OUT" --out-value $METRICS/${NM}_${BASE}_s${SEED}_value.pt \
          > /workspace/logs/train_${NM}_s${SEED}.log 2>&1 \
            || { touch "$FAILDIR/train_${NM}_s${SEED}";
                 echo "[train-fail] ${NM} s${SEED}:" >&2;
                 tail -80 /workspace/logs/train_${NM}_s${SEED}.log | sed 's/^/  | /' >&2; }
        fi
      else
        echo "TRAIN ${NM} s${SEED}: REUSED persistent final actor" >> "$DRV"
      fi
      if [ -f "$OUT" ]; then
        echo "TRAIN ${NM} s${SEED}: OK" >> "$DRV"
        evone() { local ck=$1 tag=$2 es=$3 nm="${NM}_s${SEED}_${2}_e${3}"
          if ! grep -q "^${nm}," "$SUM"; then
            MUJOCO_GL=egl MUJOCO_EGL_DEVICE_ID=$S CUDA_VISIBLE_DEVICES=$S \
            timeout 9000 python3 scripts/plan/eval_wm.py --config-name reacher \
              policy="$WM" eval.dataset_name="$CANON" dataset.stats="$CANON" \
              +eval.ep_range=8000:10000 seed=$es \
              eval.goal_offset_steps=25 eval.eval_budget=50 \
              solver=lip solver.actor_path="$ck" solver.rollout_compat=false $GRAPHED_FLAG \
              solver.batch_size=10 output.filename=${nm}.txt \
              > /workspace/logs/ev_${nm}.log 2>&1
            local h05 h10
            h05=$(grep -oE "HELD-at-end [0-9.]+" /workspace/logs/ev_${nm}.log | tail -1 | grep -oE "[0-9.]+")
            h10=$(grep -oE "0\.1rad [0-9.]+" /workspace/logs/ev_${nm}.log | tail -1 | sed -E "s/0\.1rad //")
            [ -z "$h05" ] && { echo "EVAL ${nm}: FAIL" >> "$DRV"
              touch "$FAILDIR/eval_${nm}"
              { echo "[eval-fail] ${nm}:"; tail -20 /workspace/logs/ev_${nm}.log | sed 's/^/  | /'; } >&2; }
            echo "${nm},held05=${h05:-FAIL},held10=${h10:-FAIL}" >> "$SUM"
            echo "[cell] ${nm} held05=${h05:-FAIL} held10=${h10:-FAIL}" >&2
          fi
          grep "^${nm}," "$SUM" | tail -1 | grep -oE "held10=[0-9.]+" | cut -d= -f2
        }
        evone_latched() {
          local ck=$1 tag=$2 es=$3 nm="${NM}_s${SEED}_${2}_e${3}"
          if ! grep -q "^${nm}," "$SUM"; then
            local v10=FAIL v05=FAIL tau tautag score
            for tau in ${SUCCESS_THRESHOLDS}; do
              tautag=${tau/./p}
              MUJOCO_GL=egl MUJOCO_EGL_DEVICE_ID=$S CUDA_VISIBLE_DEVICES=$S \
              timeout 9000 python3 scripts/plan/eval_wm.py --config-name reacher \
                policy="$WM" eval.dataset_name="$CANON" dataset.stats="$CANON" \
                +eval.ep_range=8000:10000 seed=$es \
                eval.goal_offset_steps=25 eval.eval_budget=50 \
                +eval.success_threshold=$tau +eval.terminate_on_success=true \
                plan_config.receding_horizon=5 \
                solver=lip solver.actor_path="$ck" solver.rollout_compat=false $GRAPHED_FLAG \
                solver.batch_size=10 output.filename=${nm}_tau${tautag}.txt \
                > /workspace/logs/ev_${nm}_tau${tautag}.log 2>&1
              score=$(grep -E "LATCHED-first-hit tau=${tau}rad" \
                /workspace/logs/ev_${nm}_tau${tautag}.log | tail -1 \
                | sed -E 's/.*rad ([0-9.]+).*/\1/')
              [ -z "$score" ] && {
                echo "EVAL ${nm} tau=${tau}: FAIL" >> "$DRV"
                touch "$FAILDIR/eval_${nm}_tau${tautag}"
                { echo "[eval-fail] ${nm} tau=${tau}:";
                  tail -25 /workspace/logs/ev_${nm}_tau${tautag}.log \
                    | sed 's/^/  | /'; } >&2
              }
              [ "$tau" = "0.1" ] && v10=${score:-FAIL}
              [ "$tau" = "0.05" ] && v05=${score:-FAIL}
            done
            echo "${nm},latched10=${v10},latched05=${v05}" >> "$SUM"
            echo "[cell] ${nm} latched10=${v10} latched05=${v05}" >&2
          fi
        }
        if [ "${GRID}" = latched_terminal_search ] || [ "${GRID}" = w1_diagnosis ] || [ "${GRID}" = w1_grid ]; then
          # The 6k training budget fixes the checkpoint. Tau only changes the
          # first-hit evaluator, never the learned actor. HELD_AT_END=1 scores
          # the same actors without early termination (held10/held05 keys).
          for ES in $SEL $REP; do
            if [ "${HELD_AT_END:-0}" = 1 ]; then
              evone "$OUT" final "$ES" > /dev/null
            else
              evone_latched "$OUT" final "$ES"
            fi
          done
          echo "SELECT ${NM} s${SEED}: final (fixed step ${STEPS})" >> "$DRV"
        elif [ "${FINAL_ONLY:-1}" = 1 ]; then
          # The training budget fixes the checkpoint. Evaluate it once per
          # seed; one simulator run yields both held10 and held05.
          for ES in $SEL $REP; do evone "$OUT" final "$ES" > /dev/null; done
          echo "SELECT ${NM} s${SEED}: final (fixed step ${STEPS})" >> "$DRV"
        else
          # Historical independent checkpoint selection for both thresholds.
          BESTTAG10=final; BESTV10=-1; BESTTAG05=final; BESTV05=-1
          CKPTS=()
          for CK in "$OUT".step*.pt; do [ -f "$CK" ] && CKPTS+=("$CK"); done
          CKPTS+=("$OUT")
          for CK in "${CKPTS[@]}"; do
            [ -f "$CK" ] || continue
            TAG=$(basename "$CK" | grep -oE 'step[0-9]+' || echo final)
            T10=0; T05=0; N=0
            for ES in $SEL; do
              evone "$CK" "$TAG" "$ES" > /dev/null
              LN=$(grep "^${NM}_s${SEED}_${TAG}_e${ES}," "$SUM" | tail -1)
              V10=$(echo "$LN" | grep -oE 'held10=[0-9.]+' | cut -d= -f2)
              V05=$(echo "$LN" | grep -oE 'held05=[0-9.]+' | cut -d= -f2)
              if [ -n "$V10" ] && [ -n "$V05" ]; then
                T10=$(awk "BEGIN{print $T10+$V10}")
                T05=$(awk "BEGIN{print $T05+$V05}")
                N=$((N+1))
              fi
            done
            if [ "$N" -gt 0 ]; then
              V10=$(awk "BEGIN{print $T10/$N}"); V05=$(awk "BEGIN{print $T05/$N}")
            else
              V10=-1; V05=-1
            fi
            echo "[ladder] ${NM} s${SEED} ${TAG}: sel10=${V10} sel05=${V05}"
            awk "BEGIN{exit !($V10 > $BESTV10)}" && { BESTV10=$V10; BESTTAG10=$TAG; BESTCK10=$CK; }
            awk "BEGIN{exit !($V05 > $BESTV05)}" && { BESTV05=$V05; BESTTAG05=$TAG; BESTCK05=$CK; }
          done
          echo "SELECT10 ${NM} s${SEED}: ${BESTTAG10} (${BESTV10})" >> "$DRV"
          echo "SELECT05 ${NM} s${SEED}: ${BESTTAG05} (${BESTV05})" >> "$DRV"
          for ES in $SEL $REP; do
            evone "${BESTCK10:-$OUT}" "${BESTTAG10}_sel10" "$ES" > /dev/null
            evone "${BESTCK05:-$OUT}" "${BESTTAG05}_sel05" "$ES" > /dev/null
          done
        fi
      else
        echo "TRAIN ${NM} s${SEED}: FAIL" >> "$DRV"
        touch "$FAILDIR/train_${NM}_s${SEED}"
        echo "[train-fail] ${NM} s${SEED}, last 30 lines:"; tail -30 /workspace/logs/train_${NM}_s${SEED}.log | sed 's/^/  | /'
      fi
      rmdir "$SLOT/$S" 2>/dev/null
    ) &
    echo "launched ${NM} seed ${SEED} (amax $AMAX, mw $MW, lr $LR) slot $S"
  done
  done
  wait
  sort "$DRV" 2>/dev/null | uniq -c

  # log everything to wandb: one run per actor with selection/report means,
  # actor+value artifact attached (pod trainer has no wandb of its own)
  python3 - <<'PY'
  import csv, glob, os, statistics as st
  import wandb
  BASE = os.environ["BASE"]
  rows = {}
  root = os.environ["PERSIST"]
  for ln in open(os.path.join(root, "results", "summary.csv")):
      if "," not in ln: continue
      parts = ln.strip().split(",")
      nm = parts[0]
      d = dict(p.split("=") for p in parts[1:] if "=" in p)
      rows[nm] = d
  for actor in sorted(glob.glob(os.path.join(root, "actors", f"rs_*_{BASE}_s?.pt"))):
      stem = os.path.basename(actor)[:-3]           # rs_m0.1_l1e-4_<base>_s0
      cfg, seed = stem.rsplit("_", 2)[0], stem.rsplit("_", 1)[1]
      row_prefix = f"{cfg}_{seed}_"
      pre = f"{cfg}_{seed}_e"
      def mean(seeds, key):
          vs = []
          for s in seeds:
              cand = [v for k, v in rows.items()
                      if k.startswith(stem + "_") and k.endswith(f"_e{s}") and v.get(key, "FAIL") != "FAIL"]
              if cand: vs.append(float(cand[-1][key]))
          return (sum(vs) / len(vs), len(vs)) if vs else (None, 0)
      final_only = os.environ.get("FINAL_ONLY", "1") == "1"
      latched = (os.environ.get("GRID") in ("latched_terminal_search", "w1_diagnosis", "w1_grid")
                 and os.environ.get("HELD_AT_END", "0") != "1")
      r = wandb.init(project=os.environ["WANDB_PROJECT"], entity=os.environ["WANDB_ENTITY"],
                     name=f"reacher_{stem}", job_type="reacher_sweep",
                     config={"base": BASE, "config": cfg, "train_seed": seed,
                             "steps": int(os.environ.get("STEPS", "6000")),
                             "expand": float(os.environ.get("EXPAND", "1.0")),
                             "selection": ("fixed final training checkpoint" if final_only else
                                           "independent held10 and held05 on draws 50/51"),
                             "success_convention": ("latched-first-hit-terminate" if latched else
                                                    "held-at-end"),
                             "thresholds_rad": ([0.1, 0.05] if latched else None),
                             "temporal_objective": "terminal",
                             "protocol": "batch256 replay0.5 freeze0.5 g0.98 window-e0.03-12k clean-split"},
                     reinit=True)
      selected_tags = ("final",) if final_only else ("sel10", "sel05")
      for selected in selected_tags:
          for split, seeds in (("sel", ["50", "51"]), ("rep", ["42", "43", "44"])):
              keys = (("latched10", "latched05") if latched
                      else ("held10", "held05"))
              for key in keys:
                  vs = []
                  for s in seeds:
                      cand = [v for k, v in rows.items()
                              if k.startswith(row_prefix) and f"_{selected}_e{s}" in k
                              and v.get(key, "FAIL") != "FAIL"]
                      if cand: vs.append(float(cand[-1][key]))
                  if vs:
                      r.summary[f"eval/{selected}_{split}_{key}"] = sum(vs) / len(vs)
                      r.summary[f"eval/{selected}_{split}_{key}_n"] = len(vs)
          for s in ("50", "51", "42", "43", "44"):
              cand = [(k, v) for k, v in rows.items()
                      if k.startswith(row_prefix) and f"_{selected}_e{s}" in k
                      and v.get(keys[0], "FAIL") != "FAIL"]
              if cand:
                  _, v = cand[-1]
                  for key in keys:
                      r.summary[f"eval/{selected}_cell_e{s}_{key}"] = float(v[key])
      art = wandb.Artifact(f"reacher_{stem}", type="lip_actor")
      art.add_file(actor)
      for ckpt in sorted(glob.glob(actor + ".step*.pt")):
          art.add_file(ckpt)
      val = os.path.join(root, "metrics", f"{cfg}_{BASE}_{seed}_value.pt")
      if os.path.exists(val): art.add_file(val)
      art.add_file(os.path.join(root, "results", "summary.csv"))
      train_log = f"/workspace/logs/train_{cfg}_{seed}.log"
      if os.path.exists(train_log): art.add_file(train_log)
      for eval_log in sorted(glob.glob(f"/workspace/logs/ev_{cfg}_{seed}_*.log")):
          art.add_file(eval_log)
      r.log_artifact(art); r.finish()
      print(f"[wandb] {stem} logged", flush=True)
  print("[wandb] all runs logged", flush=True)
  PY
  if find "$FAILDIR" -type f -print -quit | grep -q .; then
    echo "[reacher] hard failure: $(find "$FAILDIR" -type f | wc -l) failed cells" >&2
    exit 1
  fi
  echo "[reacher] ${BASE} complete"
