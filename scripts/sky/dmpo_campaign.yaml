# DMPO baseline campaign (arXiv:2310.04590) on the Pantheon cluster — one
# environment x base (x value window) cell per job, clean-tree pipeline only
# (`model=rlp skip=[planner]` -> `model=dmpo` -> `core/solver=dmpo`).
#
#   sky jobs launch scripts/sky/dmpo_campaign.yaml -n dmpo-cube-lewm --priority p1 \
#       --env ENVNAME=cube --env BASE=lewm --env AMAX=1.6 \
#       --env EXPERIMENT_TAG=dmpo-cube-lewm-20260814 -y
#   sky jobs launch scripts/sky/dmpo_campaign.yaml -n dmpo-tworoom-lejepa --priority p1 \
#       --env ENVNAME=tworoom --env BASE=lejepa --env EXPERIMENT_TAG=dmpo-tw-lejepa-20260814 -y
#   sky jobs launch scripts/sky/dmpo_campaign.yaml -n dmpo-reacher-pldm-w3 --priority p1 \
#       --env ENVNAME=reacher --env BASE=pldm --env VALUE_FRAMES=3 --env AMAX=1.8 \
#       --env EXPERIMENT_TAG=dmpo-re-pldm-w3-20260814 -y
#
# Each job: dataset -> latent caches (fs1 + fs5) -> action h5 -> offline
# quasimetric critic (value_td) -> DMPO learned optimizer (one per train seed)
# -> evaluation at h25 on report seeds 42/43/44, 50 episodes. MPPI is evaluated
# under the same learned value as the like-for-like sampling baseline (DMPO is
# a learned residual on exactly that update). Caches and checkpoints are durable
# on /checkpoints so a preempted job resumes past the encode stages.
#
# The critic is trained once per cell and shared by every DMPO seed: DMPO is a
# planner baseline, so the critic must not vary with it.

name: dmpo

envs:
  ENVNAME: cube             # cube | tworoom | reacher
  BASE: lewm                # cube: lewm|pldm   tworoom/reacher: lejepa|pldm
  VALUE_FRAMES: "1"         # frames in the critic window (reacher runs 1 and 3)
  ACTION_RANGE: "1.0"       # the env's raw action box; DMPO clips per-dimension
                            # to it after z-scoring, as the reference does.
                            # "null" falls back to the symmetric AMAX below.
  AMAX: "2.5"               # symmetric fallback only (unused when ACTION_RANGE is set)
  OBJECTIVE: pathwise       # pathwise (model=dmpo) | ppo (model=dmpo_ppo, offline DMPO)
  PPO_ITERATIONS: "400"     # policy-improvement rounds when OBJECTIVE=ppo
  PPO_DECISIONS: "4"        # closed-loop decisions per imagined episode
  NUM_SAMPLES: "256"        # DMPO particles per iteration (paper's headline budget)
  DMPO_ITERS: "1"           # inner-loop iterations per decision (reference: 1)
  DMPO_STEPS: "2000"
  DMPO_BATCH: "32"
  TRAIN_SEEDS: "0 1 2"      # reportable cells average three optimizer seeds
  EVAL_SEEDS: "42 43 44"
  EVAL_CONDS: "dmpo mppi_value"  # dmpo | mppi_value | cem_value | noop
  SAVE_EVERY: "0"           # >0: snapshot the optimizer every N PPO iterations (enables SELECT)
  SELECT: "0"                # 1 = choose the deployed snapshot on VAL_SEEDS, as the RLP rows do
  VAL_SEEDS: "48 49 50 51"   # validation draws (never the report draws)
  EVAL_PAR: "8"             # eval cells in flight at once (bit-exact across GPUs).
                            # Cube and Reacher-LeJEPA cells died at 8 wide on a
                            # 920 GB node (killed, no traceback) — lower it for
                            # heavy environments until the cause is pinned.
  SMOKE: "0"                # 1 = tiny end-to-end path check (one seed, 2 episodes)
  TWOROOM_SPLIT: "1"        # 1 = held-out (train 0-7999, eval 8000-9999); 0 = authors' full pool
  TWOROOM_COLLECT: "0"      # 1 = re-collect the pool instead of fetching the authors' set
  TWOROOM_EPISODES: "10000" # random-play pool size when collecting
  TWOROOM_ENVS: "100"       # parallel envs while recording that pool
  CACHE_TAG: ""             # reuse another experiment's caches (default: own tag)
  PANTHEON_USER: armin@pantheon.inc
  VALUE_EXTRA_OVERRIDE: ""  # uniJ critic recipe, e.g. "value.gamma=0.99 value.expectile=0.03 value.n_step=1"
  VALUE_STEPS_OVERRIDE: ""  # uniJ teacher budget (18000)
  HORIZONS_OVERRIDE: ""     # one stack per job (25 | 100)
  MAX_DELTA_OVERRIDE: ""    # uniJ band (20)
  EXPERIMENT_TAG: dmpo

workdir: .

resources:
  # Eval is CPU-bound (50 synchronous envs stepped in python) and training is
  # GPU-bound, so the cell throughput scales with cores, not with one fast GPU.
  # Mirrors the pre-refactor harness that ran 8 cells wide.
  accelerators: H200:4
  cpus: 80
  memory: 920
  image_id: docker:pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel
  labels:
    telemetry-contract: training-v1

volumes:
  /checkpoints: checkpoints

setup: |
  set -euo pipefail
  sudo apt-get update -qq >/dev/null 2>&1 || apt-get update -qq
  (sudo apt-get install -yqq curl git libegl1 libgl1 libosmesa6 >/dev/null 2>&1 \
    || apt-get install -yqq curl git libegl1 libgl1 libosmesa6 >/dev/null)
  curl -fsSL https://pixi.sh/install.sh | bash
  export PATH=$HOME/.pixi/bin:$PATH
  cd ~/sky_workdir
  pixi install -e default

run: |
  set -euo pipefail
  export PATH=$HOME/.pixi/bin:$PATH
  cd ~/sky_workdir
  # The base image presets LD_LIBRARY_PATH to system dirs whose libstdc++ is
  # older than the pixi env's toolchain; put the env's own runtime first.
  export LD_LIBRARY_PATH=$PWD/.pixi/envs/default/lib:${LD_LIBRARY_PATH:-}
  # EGL only, with a pinned render index (osmesa silently costs points, and the
  # winning index does not carry across pods — see docs/campaigns).
  export MUJOCO_GL=egl MUJOCO_EGL_DEVICE_ID=0
  export RLP_DATA_HOME=/tmp/rlp-data
  mkdir -p "$RLP_DATA_HOME"
  D=/checkpoints/$PANTHEON_USER/$EXPERIMENT_TAG
  mkdir -p "$D" && chmod 777 "$D"
  CD=/checkpoints/$PANTHEON_USER/${CACHE_TAG:-$EXPERIMENT_TAG}/caches && mkdir -p "$CD"

  # SMOKE shrinks the data stages too, so it is resolved before they run.
  if [ "$SMOKE" = 1 ]; then TWOROOM_EPISODES=64; TWOROOM_ENVS=10; fi

  # ---------------------------------------------------------------- per-cell wiring
  case $ENVNAME in
    cube)
      pixi run tool tool=fetch_dataset dataset=ogb_cube
      DATASET="$RLP_DATA_HOME/datasets/ogb_cube_single.lance"
      WM="$PWD/assets/core/world_model/${BASE}_cube"
      EVAL_MODEL="$BASE"
      EVAL_DATA=""
      VALUE_EXTRA="value.gamma=0.98 value.expectile=0.03 value.n_step=50"
      VALUE_STEPS=12000; MAX_DELTA=10
      TRAIN_EPISODES=8000
      HORIZONS="25 100"
      ;;
    tworoom)
      # The authors' TwoRoom pool (10,000 episodes), fetched rather than
      # re-collected: `tool=collect_tworoom_mixed` degrades as the lance grows
      # (3,443 episodes in 11 h and still slowing — job 6766), so regenerating
      # the pool is not a viable job stage. That h5 stores the agent position
      # as `pos_agent`, so evaluation runs through the *_h5 roots, which carry
      # the matching reset callables. TWOROOM_COLLECT=1 forces collection.
      if [ "$TWOROOM_COLLECT" = 1 ]; then
        POOL="$CD/tworoom_play.lance"
        if [ ! -d "$POOL" ]; then
          pixi run tool tool=collect_tworoom_mixed expert=0 random=$TWOROOM_EPISODES \
            num_envs=$TWOROOM_ENVS out=tworoom_play.lance
          cp -r "$HOME/.stable_worldmodel/datasets/tworoom_play.lance" "$POOL.tmp"
          mv "$POOL.tmp" "$POOL"
        fi
        DATASET="$POOL"
        EVAL_MODEL="tworoom_lewm"; [ "$BASE" = pldm ] && EVAL_MODEL="tworoom_pldm"
        EVAL_DATA="data.path=$POOL"
      else
        pixi run tool tool=fetch_dataset dataset=tworoom
        DATASET="$RLP_DATA_HOME/datasets/tworoom/tworoom.h5"
        [ -f "$DATASET" ] || { echo "tworoom h5 missing"; find "$RLP_DATA_HOME/datasets/tworoom" -maxdepth 2; exit 1; }
        EVAL_MODEL="tworoom_lewm_h5"; [ "$BASE" = pldm ] && EVAL_MODEL="tworoom_pldm_h5"
        EVAL_DATA=""
      fi
      WM="$PWD/assets/core/world_model/${BASE}_tworoom"
      VALUE_EXTRA="value.gamma=1.0 value.expectile=0.1 value.n_step=50"
      VALUE_STEPS=6000; MAX_DELTA=12
      HORIZONS="25 100"
      # Held-out by default, matching the replication record's RLP rows
      # (train 0-7999, eval 8000-9999). TWOROOM_SPLIT=0 restores the authors'
      # full-pool contract, whose numbers are upper bounds and are NOT
      # comparable to the held-out RLP row.
      if [ "$TWOROOM_SPLIT" = 1 ]; then
        TRAIN_EPISODES=8000
        EVAL_EXTRA='evaluation.episode_range="8000:10000"'
        NAME_SUFFIX="_split"
      else
        TRAIN_EPISODES=10000
      fi
      ;;
    reacher)
      pixi run tool tool=fetch_dataset dataset=reacher
      echo "----- reacher dataset layout -----"; find "$RLP_DATA_HOME/datasets/reacher" -maxdepth 3 | head -20
      DATASET=$(find "$RLP_DATA_HOME/datasets/reacher" -maxdepth 3 -name '*.lance' | head -1 || true)
      [ -n "$DATASET" ] || DATASET=$(find "$RLP_DATA_HOME/datasets/reacher" -maxdepth 3 -name '*.h5' | head -1 || true)
      [ -n "$DATASET" ] || { echo "no reacher dataset found under $RLP_DATA_HOME/datasets/reacher"; exit 1; }
      EVAL_DATA="data.path=$DATASET"
      WM="$PWD/assets/core/world_model/${BASE}_reacher"
      EVAL_MODEL="reacher_lewm"; [ "$BASE" = pldm ] && EVAL_MODEL="reacher_pldm"
      # the reacher critic is a window quasimetric (frames 1 or 3, lag 5)
      VALUE_EXTRA="value.gamma=0.98 value.expectile=0.05 value.n_step=50 \
        +value.window_frames=$VALUE_FRAMES +value.window_lag=5"
      VALUE_STEPS=12000; MAX_DELTA=12
      TRAIN_EPISODES=8000
      # the paper's Reacher table reports first-hit success at both tolerances
      TAUS="0.1 0.05"
      ;;
    *) echo "unknown ENVNAME=$ENVNAME"; exit 1;;
  esac
  # uniJ alignment (2026-09-24): override the per-env critic recipe / horizon list so the baseline trains
  # against the SAME teacher recipe as the unified RLP rows (gamma per stack, n-step 1, expectile 0.03, 18k steps)
  [ -n "${VALUE_EXTRA_OVERRIDE:-}" ] && VALUE_EXTRA="$VALUE_EXTRA_OVERRIDE"
  [ -n "${VALUE_STEPS_OVERRIDE:-}" ] && VALUE_STEPS=$VALUE_STEPS_OVERRIDE
  [ -n "${HORIZONS_OVERRIDE:-}" ] && HORIZONS="$HORIZONS_OVERRIDE"
  [ -n "${MAX_DELTA_OVERRIDE:-}" ] && MAX_DELTA=$MAX_DELTA_OVERRIDE

  # the cache filename must encode the episode split: a held-out cache and a
  # full-pool cache of the same cell are different data under one name
  NAME="${ENVNAME}_${BASE}_w${VALUE_FRAMES}${NAME_SUFFIX:-}"
  NGPU_TRAIN=$(nvidia-smi -L 2>/dev/null | wc -l); [ "$NGPU_TRAIN" -ge 1 ] || NGPU_TRAIN=1

  EVAL_N=50
  DMPO_EXTRA="max_delta=$MAX_DELTA"
  PPO_BATCH=16
  if [ "$SMOKE" = 1 ]; then
    TRAIN_EPISODES=64; EVAL_N=2; TRAIN_SEEDS=0; EVAL_SEEDS=42
    VALUE_STEPS=60
    DMPO_STEPS=20; DMPO_BATCH=8; PPO_ITERATIONS=4; PPO_BATCH=4; PPO_DECISIONS=2
  fi

  # ------------------------------------------------- caches + critic (shared per cell)
  SKIP="planner"
  [ -f "$CD/${NAME}_fs1.pt" ] && SKIP="$SKIP,cache"
  [ -f "$CD/${NAME}_fs5.pt" ] && SKIP="$SKIP,subsample"
  [ -f "$CD/${NAME}_actions.h5" ] && SKIP="$SKIP,actions"

  if [ ! -d "$D/value_td" ]; then
    pixi run train model=rlp wm="$WM" dataset="$DATASET" name="$NAME" \
      cache_directory="$CD" train_episodes=$TRAIN_EPISODES seed=0 \
      "skip=[$SKIP]" value.steps=$VALUE_STEPS $VALUE_EXTRA
    RUN=$(ls -dt logs/*/* | head -1)
    rm -rf "$D/value_td"; cp -r "$RUN/checkpoints/value_td" "$D/value_td"
  fi

  # ------------------------------------------------------------------ DMPO per seed
  SEED_INDEX=0
  for S in $TRAIN_SEEDS; do
    if [ ! -f "$D/dmpo_s${S}.pt" ]; then
    (  # one seed per GPU: the seeds are independent, so they run concurrently
      if [ "$OBJECTIVE" = ppo ]; then
        # offline DMPO: the paper's PPO objective, closed inside the world model
        TRAINER="model=dmpo_ppo ppo_iterations=$PPO_ITERATIONS batch=$PPO_BATCH decisions=$PPO_DECISIONS save_every=${SAVE_EVERY:-0}"
      else
        TRAINER="model=dmpo steps=$DMPO_STEPS batch=$DMPO_BATCH"
      fi
      CUDA_VISIBLE_DEVICES=$(( SEED_INDEX % ${NGPU_TRAIN:-1} )) \
      pixi run train $TRAINER wm="$WM" \
        cache="$CD/${NAME}_fs5.pt" h5="$CD/${NAME}_actions.h5" \
        init_value="$D/value_td" seed=$S \
        core.planner.action_range=$ACTION_RANGE core.planner.action_limit=$AMAX \
        core.planner.num_samples=$NUM_SAMPLES core.planner.iterations=$DMPO_ITERS \
        $DMPO_EXTRA
      # concurrent seeds make `ls -dt` ambiguous: read this seed's own run dir
      RUN=$(grep -a -m1 "Run directory:" "$D/log_train_s${S}.txt" | awk '{print $NF}')
      [ -d "$RUN" ] || { echo "seed $S: could not resolve its run directory"; exit 1; }
      cp "$RUN/checkpoints/dmpo.pt" "$D/dmpo_s${S}.pt"
      # periodic snapshots (save_every>0) for validation-based selection; the critic is frozen and
      # shared by every snapshot, so one value dir per seed is enough
      for f in "$RUN"/checkpoints/dmpo_step*.pt; do
        [ -e "$f" ] || continue; n=$(basename "$f" .pt); n=${n#dmpo_step}
        cp "$f" "$D/dmpo_s${S}_step${n}.pt"
      done
      rm -rf "$D/dmpo_value_s${S}"; cp -r "$RUN/checkpoints/value" "$D/dmpo_value_s${S}"
    ) > "$D/log_train_s${S}.txt" 2>&1 &
    SEED_INDEX=$((SEED_INDEX + 1))
    fi
  done
  wait
  for S in $TRAIN_SEEDS; do
    [ -f "$D/dmpo_s${S}.pt" ] || { echo "training seed $S produced no checkpoint"; tail -20 "$D/log_train_s${S}.txt"; exit 1; }
    echo "--- train seed $S ---"; grep -a "step \|Saved" "$D/log_train_s${S}.txt" | tail -3
  done

  # ------------------------------------------------------------------------- evaluate
  # Cells run EVAL_PAR wide (default 4): planning is milliseconds on the GPU
  # while python steps 50 envs serially, so concurrency converts idle GPU time
  # into throughput. Parallel same-GPU evals are bit-exact on healthy cards
  # (2026-08-05 audit); each cell gets a unique results filename so collection
  # never races, and starts are staggered because run dirs are second-stamped.
  run_eval () {  # run_eval <label> <seed> <overrides...>
    local label=$1 seed=$2; shift 2
    local unique="results_${label}_s${seed}"
    local out="$D/${unique}.txt"
    # resumable evals: a relaunch re-runs only the missing cells
    [ -s "$out" ] && { echo "===== EVAL $label seed=$seed (cached) ====="; cat "$out"; return 0; }
    echo "===== EVAL $label seed=$seed ====="
    # cap intra-op threads per process: EVAL_PAR torch processes at the
    # default thread count (= all cores each) oversubscribe the node and run
    # SLOWER than sequential (observed 2026-08-16: 4-wide, zero cells in 3 h)
    local threads=$(( $(nproc) / ${EVAL_PAR:-4} ))
    [ "$threads" -lt 1 ] && threads=1
    # compute roams across GPUs; the EGL *render* index stays pinned (an
    # unpinned render device silently costs points — see docs/campaigns)
    local gpu=$(( ${CELL_GPU:-0} % ${NGPU:-1} ))
    CUDA_VISIBLE_DEVICES=$gpu OMP_NUM_THREADS=$threads MKL_NUM_THREADS=$threads \
    pixi run eval model=$EVAL_MODEL runtime.seed=$seed evaluation.num_episodes=$EVAL_N \
      ${EVAL_DATA:+$EVAL_DATA} ${EVAL_EXTRA:+$EVAL_EXTRA} output.filename="${unique}.txt" \
      "$@" > "$D/log_${unique}.txt" 2>&1 \
      || { echo "EVAL FAILED $label seed=$seed"
           # the useful line is rarely the last: a killed process ends on warnings
           grep -a "Error\|error\|Traceback\|Killed\|out of memory\|assert" "$D/log_${unique}.txt" | head -5
           tail -3 "$D/log_${unique}.txt"
           echo "$label seed=$seed" >> "$D/.failed_cells"
           return 0; }
    local produced=$(find logs -name "${unique}.txt" | head -1)
    [ -n "$produced" ] && cp "$produced" "$out"
    echo "----- RESULT $label seed=$seed -----"; cat "$out" 2>/dev/null || echo "(missing)"
  }

  NGPU=$(nvidia-smi -L 2>/dev/null | wc -l); [ "$NGPU" -ge 1 ] || NGPU=1
  CELL_INDEX=0
  spawn () {  # slot-limited background run_eval, round-robin over GPUs
    while [ "$(jobs -rp | wc -l)" -ge "${EVAL_PAR:-4}" ]; do wait -n; done
    CELL_GPU=$CELL_INDEX run_eval "$@" &
    CELL_INDEX=$((CELL_INDEX + 1))
    sleep 3
  }

  # ------------------------------------------------- validation selection (SELECT=1)
  # The RLP rows choose their deployed (teacher, actor) pair on validation draws 48-51; handing the
  # baselines a fixed final iterate instead is not the same treatment, and the PPO return is a noisy
  # walk with no trend over the paper's 1000 iterations, so that iterate is arbitrary. Mirror RLP:
  # score every snapshot on the validation draws, take ONE shared step for the whole cell by the mean
  # over training seeds (ties -> the earlier step), and deploy that step for every seed.
  for S in $TRAIN_SEEDS; do ln -sf "$D/dmpo_s${S}.pt" "$D/deploy_s${S}.pt"; done
  if [ "$SELECT" = 1 ]; then
    SNAPS=$(ls "$D"/dmpo_s*_step*.pt 2>/dev/null | sed -E 's/.*_step([0-9]+)\.pt$/\1/' | sort -n -u)
    if [ -z "$SNAPS" ]; then
      echo "[select] no snapshots found (SAVE_EVERY=$SAVE_EVERY); deploying the final iterate"
    else
      VH=$(echo ${HORIZONS:-25} | awk '{print $1}')
      case $VH in
        25)  VHOR="evaluation.goal_offset_steps=25 evaluation.budget=50";;
        100) VHOR="evaluation.goal_offset_steps=100 evaluation.budget=200";;
      esac
      # reacher reports two tolerances but selects on ONE (the first), as the RLP reacher rows do
      VTAU=$(echo ${TAUS:--} | awk '{print $1}'); VTOL=""
      [ "$VTAU" != "-" ] && VTOL="environment.success_threshold=$VTAU"
      echo "[select] snapshots: $(echo $SNAPS | tr '\n' ' ') + final; val draws $VAL_SEEDS at h$VH ${VTAU}"
      for N in $SNAPS final; do
        for S in $TRAIN_SEEDS; do
          AP="$D/dmpo_s${S}_step${N}.pt"; [ "$N" = final ] && AP="$D/dmpo_s${S}.pt"
          [ -f "$AP" ] || continue
          for VS in $VAL_SEEDS; do
            spawn "val_a${S}_step${N}_h${VH}" $VS $VHOR $VTOL core/solver=dmpo \
              core.solver.actor_path="$AP" core.solver.value_path="$D/dmpo_value_s${S}"
          done
        done
      done
      wait
      BEST=$(python3 scripts/sky/tools/select_snapshot.py "$D" "$TRAIN_SEEDS" "$VAL_SEEDS" "$VH")
      echo "[select] deployed step: $BEST"
      for S in $TRAIN_SEEDS; do
        AP="$D/dmpo_s${S}_step${BEST}.pt"; [ "$BEST" = final ] && AP="$D/dmpo_s${S}.pt"
        [ -f "$AP" ] && ln -sf "$AP" "$D/deploy_s${S}.pt"
      done
      echo "SELECTED_STEP=$BEST" > "$D/selected_step.txt"
    fi
  fi

  for ES in $EVAL_SEEDS; do
    for H in ${HORIZONS:-25}; do
      case $H in
        25)  HOR="evaluation.goal_offset_steps=25 evaluation.budget=50";;
        100) HOR="evaluation.goal_offset_steps=100 evaluation.budget=200";;
        *) echo "unknown horizon $H"; exit 1;;
      esac
      for TAU in ${TAUS:--}; do
        TAG="h$H"; TOL=""
        if [ "$TAU" != "-" ]; then
          # first-hit at an explicit tolerance; the env's own test is 0.05 rad
          TOL="environment.success_threshold=$TAU"; TAG="h${H}_tau${TAU}"
        fi
        for COND in $EVAL_CONDS; do
          case $COND in
            dmpo)
              for S in $TRAIN_SEEDS; do
                spawn "dmpo_a${S}_${TAG}" $ES $HOR $TOL core/solver=dmpo \
                  core.solver.actor_path="$D/deploy_s${S}.pt" \
                  core.solver.value_path="$D/dmpo_value_s${S}"
              done;;
            # the sampling baseline DMPO learns a residual on, under the same
            # critic. h25 only: at h100 a cell is 8 replans x 9,000 rollouts x
            # 50 episodes, and the shipped tables already carry h100 MPPI rows.
            mppi_value) [ "$H" = 25 ] || continue
                  spawn "mppi_value_${TAG}" $ES $HOR $TOL core/solver=mppi \
                  core/value=metric "core.value.checkpoints=[$D/value_td]";;
            cem_value) spawn "cem_value_${TAG}" $ES $HOR $TOL core/solver=cem \
                  core/value=metric "core.value.checkpoints=[$D/value_td]";;
            noop) spawn "noop_${TAG}" $ES $HOR $TOL core/policy=no_move;;
          esac
        done
      done
    done
  done
  wait
  COMPLETED=$(ls "$D"/results_*.txt 2>/dev/null | wc -l | tr -d ' ')
  FAILED=$(wc -l < "$D/.failed_cells" 2>/dev/null | tr -d ' ' || echo 0)
  echo "Completed result cells: $COMPLETED   failed: ${FAILED:-0}"
  # A campaign that produced no cells must not report success: the eval loop
  # deliberately survives a single bad cell, which previously let a job whose
  # every cell died still print DMPO_CAMPAIGN_DONE and exit 0.
  if [ "$COMPLETED" = 0 ]; then
    echo "no eval cell completed — failing the job"; cat "$D/.failed_cells" 2>/dev/null | head -20; exit 1
  fi
  [ "${FAILED:-0}" != 0 ] && echo "WARNING: ${FAILED} eval cells failed; the grid is incomplete"
  echo "DMPO_CAMPAIGN_DONE env=$ENVNAME base=$BASE window=$VALUE_FRAMES tag=$EXPERIMENT_TAG"
