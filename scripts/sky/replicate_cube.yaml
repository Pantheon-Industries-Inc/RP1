# OGBench Cube RLP replication on the Pantheon cluster — one base per job.
#
#   sky jobs launch scripts/sky/replicate_cube.yaml -n rlp-repl-lewm \
#       --env BASE=lewm --env AMAX=1.6 --env EXPERIMENT_TAG=rlp-repl-lewm-<date> -y
#   sky jobs launch scripts/sky/replicate_cube.yaml -n rlp-repl-pldm \
#       --env BASE=pldm --env AMAX=4.5 --env EXPERIMENT_TAG=rlp-repl-pldm-<date> -y
#
# Runs the full model=rlp pipeline (train split episodes 0-7999), then
# evaluates RLP / CEM / no-op floor at h25 on report seeds 42/43/44 with
# eval draws from episodes 8000-9999. Caches are durable on /checkpoints so a
# preempted job resumes past the encode stages.

name: rlp-repl

envs:
  BASE: lewm            # lewm | pldm  (assets/core/world_model/${BASE}_cube)
  AMAX: "1.6"           # 1.6 for lewm, 4.5 for pldm (paper Tab. C.4)
  EVAL_SEEDS: "42 43 44"
  SMOKE: "0"            # 1 = tiny steps/episodes end-to-end path check
  PANTHEON_USER: armin@pantheon.inc
  EXPERIMENT_TAG: rlp-repl

workdir: .

resources:
  accelerators: H200:1
  cpus: 20
  memory: 230
  image_id: docker:pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel
  labels:
    telemetry-contract: opt-out
    telemetry-opt-out-reason: replication-validation

volumes:
  /checkpoints: checkpoints

setup: |
  set -euo pipefail
  sudo apt-get update -qq >/dev/null 2>&1 || apt-get update -qq
  (sudo apt-get install -yqq curl git libegl1 libgl1 libosmesa6 >/dev/null 2>&1 \
    || apt-get install -yqq curl git libegl1 libgl1 libosmesa6 >/dev/null)
  curl -fsSL https://pixi.sh/install.sh | bash
  export PATH=$HOME/.pixi/bin:$PATH
  cd ~/sky_workdir
  pixi install -e default

run: |
  set -euo pipefail
  export PATH=$HOME/.pixi/bin:$PATH
  cd ~/sky_workdir
  # The base image presets LD_LIBRARY_PATH to system dirs whose libstdc++ is
  # older than the pixi env's toolchain; put the env's own runtime first.
  export LD_LIBRARY_PATH=$PWD/.pixi/envs/default/lib:${LD_LIBRARY_PATH:-}
  export MUJOCO_GL=egl MUJOCO_EGL_DEVICE_ID=0
  export RLP_DATA_HOME=/tmp/rlp-data
  mkdir -p "$RLP_DATA_HOME"
  D=/checkpoints/$PANTHEON_USER/$EXPERIMENT_TAG
  mkdir -p "$D" && chmod 777 "$D"
  CD=$D/caches && mkdir -p "$CD"

  pixi run tool tool=fetch_dataset dataset=ogb_cube

  SKIP=""
  [ -f "$CD/cube_${BASE}_fs1.pt" ] && SKIP="cache"
  [ -f "$CD/cube_${BASE}_fs5.pt" ] && SKIP="$SKIP,subsample"
  [ -f "$CD/cube_${BASE}_actions.h5" ] && SKIP="$SKIP,actions"
  SKIP=$(echo "$SKIP" | sed 's/^,//')

  TRAIN_EXTRA=""
  EVAL_N=50
  if [ "$SMOKE" = 1 ]; then
    TRAIN_EXTRA="train_episodes=64 value.steps=60 planner.steps=30"
    EVAL_N=2
    EVAL_SEEDS=42
  fi

  if [ ! -f "$D/train_checkpoints/planner.pt" ]; then
    pixi run train model=rlp \
      wm="$PWD/assets/core/world_model/${BASE}_cube" \
      dataset="$RLP_DATA_HOME/datasets/ogb_cube_single.lance" \
      name="cube_${BASE}" cache_directory="$CD" \
      planner.amax=$AMAX "skip=[$SKIP]" $TRAIN_EXTRA
    RUN=$(ls -dt logs/*/* | head -1)
    rm -rf "$D/train_checkpoints"
    cp -r "$RUN/checkpoints" "$D/train_checkpoints"
  fi

  run_eval () {  # run_eval <label> <seed> <overrides...>
    local label=$1 seed=$2; shift 2
    echo "===== EVAL $label seed=$seed ====="
    pixi run eval model=$BASE runtime.seed=$seed \
      evaluation.episode_range=8000:10000 evaluation.num_episodes=$EVAL_N \
      evaluation.goal_offset_steps=25 evaluation.budget=50 \
      "$@"
    local run=$(ls -dt logs/*/* | head -1)
    local out="$D/results_${label}_s${seed}.txt"
    cp "$run"/*results*.txt "$out" 2>/dev/null || find "$run" -name '*.txt' -exec cp {} "$out" \;
    echo "----- RESULT $label seed=$seed -----"
    cat "$out"
  }

  for SEED in $EVAL_SEEDS; do
    run_eval rlp $SEED core/solver=lip \
      core.solver.actor_path="$D/train_checkpoints/planner.pt"
    run_eval cem_latent $SEED core/solver=cem
    run_eval noop $SEED core/policy=no_move
  done
  echo "REPLICATION_DONE base=$BASE tag=$EXPERIMENT_TAG"
