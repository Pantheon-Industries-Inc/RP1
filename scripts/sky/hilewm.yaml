# Hi-LeWM (arXiv 2607.12547) vs flat RLP — PushT and OGBench cube. Pantheon.
#
#   sky jobs launch scripts/sky/hilewm.yaml -n hilewm-verify \
#       --env EXPERIMENT_TAG=hilewm-$(date +%Y%m%d) -y
#
# Plan: docs/campaigns/2026-09-17/HILEWM_PLAN.md
#
# STAGE=verify (default) does the two things steps 3-4 depend on:
#   1. base identity — is the frozen low level bundled in their checkpoint
#      bit-identical to `quentinll/lewm-pusht` @ 22b330c2 (the base our PushT
#      actors were trained against)? Their ckpt carries the whole model
#      (model.encoder / model.low_predictor / model.action_encoder / ...), so
#      this is a tensor compare after the 1:1 convert_pldm rename.
#   2. repro — one published cell as released (flat CEM and naive hierarchical
#      at the offsets below) on THEIR protocol (train-split draws), to confirm
#      the artifact runs and reproduces their table.
#
# STAGE=heldout re-runs the same arms with our held-out episode filter
# (eval.episode_min=16000) and, when ROWS_FILE is set, on an explicit shared
# task list so arms are paired episode-for-episode. Both knobs come from
# scripts/hilewm/0001-heldout-and-paired-tasklist.patch (applied in-job).
#
# Their Hi-LeWM-C ("empirical-macro CEM", the paper's headline) is NOT wired
# into any shipped spec — empirical_macro defaults to enabled:false — so the
# constrained arm is reconstructed from the config knobs here (EMP_* envs).
#
# Their code is third-party research code run in a throwaway pod; the artifact
# is pinned by sha256 below.

name: hilewm

envs:
  PANTHEON_USER: armin@pantheon.inc
  EXPERIMENT_TAG: hilewm
  OUT_ROOT: /newcheckpoints

  CELL: "pusht"             # pusht | cube (OGBench). Selects configs, dataset,
                            # checkpoints and the baseline HF source together.
  STAGE: "verify"           # verify | heldout
  ARMS: "flat hier hierc"   # flat = their LeWM+CEM baseline; hier = naive
                            # hierarchy; hierc = empirical-macro (Hi-LeWM-C)
  OFFSETS: "75"             # 25 | 50 | 75 (their D-columns). Budget = 2x.
  SEEDS: "42"               # their baseline matrix uses seed 42 only
  NUM_EVAL: "50"
  EPISODE_MIN: ""           # "" = their default (draws from the training
                            # split); 16000 = our held-out protocol
  ROWS_FILE: ""             # optional dataset-row task list (paired arms)

  # empirical-macro (Hi-LeWM-C) knobs — paper/config values
  EMP_NUM_SEQUENCES: "4096"
  EMP_CHUNK_LEN: "5"
  EMP_RESIDUAL_SCALE: "0.1"
  EMP_TOP_CANDIDATES: "8"

  ZENODO_URL: "https://zenodo.org/records/21353240/files/package.zip?download=1"
  ZENODO_SHA256: "b89046841d679fe70f435540d62ae87b662ec34eb457919b098d152263f63967"
  LEWM_REPO: "https://github.com/lucas-maes/le-wm.git"
  CUBE_URL: "https://huggingface.co/datasets/quentinll/lewm-cube/resolve/main/cube_single_expert.tar.zst?download=true"
  CUBE_BYTES: "46184624478"
  BASE_REVISION: "22b330c28c27ead4bfd1888615af1340e3fe9052"

  SMOKE: "0"                # 1 = few episodes, tiny CEM budgets, both arms
  SMOKE_NUM_EVAL: "4"       # 1 sidesteps every batch-width issue: with a single
                            # env the alive set cannot shrink mid-run
  THEN_FULL: "0"            # with SMOKE=1: continue into the real ARMS/OFFSETS
                            # in the same admission once the smoke passes

workdir: .

resources:
  accelerators: H200:1
  # Eval-shaped job: a ViT-tiny plus a small cached dataset, so the guide's
  # training-sized 20 CPU / 230 GB (the full per-GPU share) is not needed —
  # and asking for it is why this job sat 6.5 h in Kueue on 2026-09-18 while
  # an identical 8/90 job was admitted immediately. Keeps the node's ~1:11
  # CPU:memory ratio so nothing is stranded.
  cpus: 8
  memory: 90
  image_id: docker:pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel
  labels:
    telemetry-contract: opt-out
    telemetry-opt-out-reason: replication-validation

volumes:
  /checkpoints: checkpoints
  /newcheckpoints: armin-rlp-checkpoints

setup: |
  set -euo pipefail
  sudo apt-get update -qq >/dev/null 2>&1 || apt-get update -qq
  # swig + build-essential: stable-worldmodel[env] pulls box2d-py, whose wheel
  # build shells out to swig and fails without it.
  PKGS="curl git unzip bzip2 swig build-essential libegl1 libgl1 libosmesa6"
  (sudo apt-get install -yqq $PKGS >/dev/null 2>&1 \
    || apt-get install -yqq $PKGS >/dev/null)
  curl -fsSL https://pixi.sh/install.sh | bash
  export PATH=$HOME/.pixi/bin:$PATH
  cd ~/sky_workdir
  pixi install -e default

  # Their artifact needs ITS OWN environment. Measured 2026-09-18: the released
  # checkpoints pickle transformers-4 ViT classes (ViTSelfAttention,
  # ViTSelfOutput, ViTIntermediate, ViTLayer) plus their own modules under bare
  # top-level names (hi_jepa.HiJEPA, module.ARPredictor). Our pixi env is
  # transformers 5, where the ViT refactor removed those paths — which is also
  # why their HF baseline converter dies with "Missing key(s) ...
  # encoder.layers.0.attention.q_proj.weight". Their code cannot run in our env;
  # ours stays for fetch_dataset / convert_pldm / compare_base only.
  # (the env itself is created in `run`, once the artifact's environment-gpu.yml
  # has been unpacked)
  curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest \
    | tar -xvj -C $HOME bin/micromamba

run: |
  set -euo pipefail
  export PATH=$HOME/.pixi/bin:$PATH
  cd ~/sky_workdir
  export LD_LIBRARY_PATH=$PWD/.pixi/envs/default/lib:${LD_LIBRARY_PATH:-}
  export RLP_DATA_HOME=/tmp/rlp-data
  mkdir -p "$RLP_DATA_HOME"

  D=${OUT_ROOT}/$PANTHEON_USER/$EXPERIMENT_TAG
  mkdir -p "$D" && chmod 777 "$D"
  ART=${OUT_ROOT}/$PANTHEON_USER/hilewm-artifact      # shared across runs
  mkdir -p "$ART"

  # ---------------------------------------------------------------- artifact
  ZIP=$ART/package.zip
  if [ ! -f "$ZIP" ]; then
    echo "[artifact] downloading 2.3 GB from Zenodo"
    curl -sL -o "$ZIP.tmp" "$ZENODO_URL" && mv "$ZIP.tmp" "$ZIP"
  fi
  GOT=$(sha256sum "$ZIP" | cut -d' ' -f1)
  [ "$GOT" = "$ZENODO_SHA256" ] || { echo "[artifact] sha256 MISMATCH: $GOT" >&2; exit 1; }
  echo "[artifact] sha256 ok"

  SRC=/tmp/hilewm
  rm -rf "$SRC" && mkdir -p "$SRC"
  unzip -q "$ZIP" -d "$SRC" -x "__MACOSX/*"
  CODE=$SRC/package/code
  CKPTS=$SRC/package/checkpoints

  # upstream LeWM source (not redistributed by the artifact)
  mkdir -p "$CODE/third_party"
  git clone -q "$LEWM_REPO" "$CODE/third_party/lewm" || echo "[warn] le-wm clone failed"

  # our eval patch: held-out episode filter + shared explicit task list
  ( cd "$CODE" && patch -p1 < ~/sky_workdir/scripts/hilewm/0001-heldout-and-paired-tasklist.patch )
  echo "[patch] applied"

  export CODE CKPTS
  export PYTHONPATH="$CODE:${PYTHONPATH:-}"
  export STABLEWM_HOME="$SRC/stablewm"
  mkdir -p "$STABLEWM_HOME"

  # ------------------------------------------------------- their conda env
  # environment-gpu.yml: python 3.10 + cuda-toolkit 12.1 + cudnn 8.9 +
  # stable-worldmodel[train,env]. Required: their checkpoints pickle
  # transformers-4 classes (see setup notes).
  export MAMBA_ROOT_PREFIX=$HOME/micromamba
  MM=$HOME/bin/micromamba
  ENV_NAME=$(awk '/^name:/{print $2; exit}' "$CODE/environment-gpu.yml")
  ENV_NAME=${ENV_NAME:-lewm-gpu}
  if ! $MM create -y -f "$CODE/environment-gpu.yml"; then
    # box2d-py (from the [env] extra) needs swig and is only used by gymnasium's
    # Box2D envs; swm/PushT-v1 is registered by stable-worldmodel itself, so a
    # [train]-only env is sufficient for these evals.
    echo "[env] full environment-gpu.yml failed; retrying without the [env] extra"
    $MM env remove -y -n "$ENV_NAME" >/dev/null 2>&1 || true
    sed 's/stable-worldmodel\[train,env\]/stable-worldmodel[train]/' \
      "$CODE/environment-gpu.yml" > /tmp/env-train-only.yml
    $MM create -y -f /tmp/env-train-only.yml
  fi
  # their commands run here; ours stay on pixi
  HRUN="$MM run -n $ENV_NAME"

  # THEIR ENV SPEC IS UNPINNED AND NO LONGER REPRODUCES ITSELF. environment-gpu.yml
  # asks only for `stable-worldmodel[train,env]`, whose `transformers>=4.50.0`
  # resolved to a 4.x release when the artifact was built and resolves to 5.17.0
  # today (measured 2026-09-18). transformers 5 refactored ViT, so it cannot load
  # their checkpoints -- which pickle ViTSelfAttention/ViTSelfOutput/ViTIntermediate
  # -- and their HF baseline converter dies with `Missing key(s) ... q_proj`.
  # Pin back to the 4.x line their weights were written under.
  $HRUN pip install -q "transformers>=4.50,<5"
  # Their spec also omits the `format` extra, which is what ships h5py. Without
  # it stable_worldmodel/data/__init__.py silently skips its conditional
  # `from .formats.hdf5 import HDF5Dataset` and their eval dies with
  # "module 'stable_worldmodel.data' has no attribute 'HDF5Dataset'" — even
  # though the dataset they ask for is an .h5 file.
  $HRUN pip install -q "stable-worldmodel[format]"
  # Their yml installs PyPI torch 2.14.0+cu130, newer than this cluster's 12.8
  # driver -- the eval then reports cuda_available=False and silently runs CEM
  # on CPU. Swap for a cu128 build. A plain `pip install` is a no-op here (torch
  # is already satisfied), so uninstall first; and the cu13 nvidia wheels must
  # go too, or they shadow cuDNN and give CUDNN_STATUS_NOT_INITIALIZED
  # (the pod-container-rebuild trap).
  $HRUN pip uninstall -y -q torch torchvision || true
  NV=$($HRUN pip list --format=freeze | sed 's/=.*//' | grep '^nvidia-' | tr '\n' ' ')
  [ -n "$NV" ] && $HRUN pip uninstall -y -q $NV || true
  $HRUN pip install -q --index-url https://download.pytorch.org/whl/cu128 \
    torch torchvision
  $HRUN python -c "import torch, transformers; \
    v = transformers.__version__; \
    print('[their-env] transformers', v, '| torch', torch.__version__, \
          '| cuda', torch.version.cuda, '| available', torch.cuda.is_available()); \
    assert int(v.split('.')[0]) == 4, f'need transformers 4.x, got {v}'; \
    assert torch.cuda.is_available(), 'their env cannot see the GPU'"
  $HRUN python -c "import transformers, torch; \
    v = transformers.__version__; \
    print('[their-env] transformers', v, '| torch', torch.__version__); \
    raise SystemExit(0 if int(v.split('.')[0]) == 4 else \
                     f'need transformers 4.x to load their checkpoints, got {v}')"

  # -------------------------------------------------------------------- cell
  case "$CELL" in
    pusht)
      HI_CONFIG=hi_pusht; FLAT_CONFIG=pusht
      DATASET_NAME=pusht_expert_train
      HI_CKPT="$CKPTS/pusht/main/pusht_hi_lewm_epoch15_object.ckpt"
      HI_REG=hierarchical/pusht/default_epoch15
      HI_POLICY=runs/pusht_hierarchical_default/pusht_hierarchical_default_epoch_15
      FLAT_POLICY=pusht/lewm; FLAT_REG=baseline/pusht/lewm
      BASE_HF=quentinll/lewm-pusht
      WORLD_DROP='~world.history_size ~world.frame_skip'
      ;;
    cube)
      HI_CONFIG=hi_cube; FLAT_CONFIG=cube
      DATASET_NAME=ogbench/cube_single_expert
      HI_CKPT="$CKPTS/cube/main/cube_hi_lewm_epoch15_object.ckpt"
      HI_REG=hierarchical/cube/default_epoch15
      HI_POLICY=runs/cube_hierarchical_default/cube_hierarchical_default_epoch_15
      FLAT_POLICY=cube/lewm; FLAT_REG=baseline/cube/lewm
      BASE_HF=quentinll/lewm-cube
      WORLD_DROP='~world.history_size ~world.frame_skip'
      ;;
    *) echo "unknown CELL '$CELL' (want pusht|cube)" >&2; exit 1;;
  esac
  echo "[cell] $CELL: config=$HI_CONFIG/$FLAT_CONFIG dataset=$DATASET_NAME base=$BASE_HF"

  # ----------------------------------------------------------------- dataset
  # HDF5Dataset resolves a name as get_cache_dir(cache_dir, sub_folder=
  # 'datasets')/<name>.h5, and get_cache_dir falls back to $STABLEWM_HOME.
  # Link our fetched copy into that layout instead of overriding cache_dir:
  # the hierarchical config has a `cache_dir` key but the upstream flat config
  # (third_party/lewm/config/eval/pusht.yaml) does not, so an override would
  # fail there.
  # Datasets live on the persistent volume so the cube h5 (~95 GB extracted from
  # a 46 GB tar.zst) survives between runs; STABLEWM_HOME/datasets points at it.
  DS_STORE=$ART/datasets
  mkdir -p "$DS_STORE" "$STABLEWM_HOME/datasets"

  if [ "$CELL" = pusht ]; then
    pixi run tool tool=fetch_dataset dataset=pusht
    ln -sf "$RLP_DATA_HOME/datasets/pusht/pusht_expert_train.h5" \
           "$STABLEWM_HOME/datasets/pusht_expert_train.h5"
  else
    # their downloader resolves cube -> HF dataset quentinll/lewm-cube and
    # extracts cube_single_expert.h5 (our memory: byte-identical to the h5 our
    # own cube evals already draw from)
    # NOTE their downloader (a) always fetches pusht AND cube via
    # setup_paper_datasets.sh -- 46 GB we do not need here, so call
    # setup_datasets.sh --datasets cube directly -- and (b) extracts into
    # $STABLEWM_HOME root, while swm's HDF5Dataset resolves the name to
    # <home>/datasets/<name>.h5. The ~102 GB extracted h5 stays on the node's
    # local NVMe (/tmp): it is too large for the shared checkpoint volume.
    TGT="$STABLEWM_HOME/datasets/${DATASET_NAME}.h5"
    if [ ! -s "$TGT" ]; then
      DL_HOME=/tmp/swm_dl
      mkdir -p "$DL_HOME"
      # Fetch the archive ourselves: their setup_datasets.sh has no resume, and
      # a single HTTP/2 stream reset ("curl: (92) ... CANCEL") throws away the
      # whole 46 GB transfer -- which is exactly how the first attempt died at
      # 29.6%. Keep the archive on the volume so this is paid once; extract to
      # node-local NVMe because the h5 is ~102 GB.
      ZST=$ART/cube_single_expert.tar.zst
      if [ "$(stat -c %s "$ZST" 2>/dev/null || echo 0)" != "$CUBE_BYTES" ]; then
        for i in 1 2 3 4 5 6; do
          curl -fL -C - --retry 10 --retry-all-errors --retry-delay 5 \
            -o "$ZST" "$CUBE_URL" && break
          echo "[dataset] attempt $i interrupted at $(stat -c %s "$ZST" 2>/dev/null || echo 0) bytes; resuming"
          sleep 10
        done
      fi
      GOT=$(stat -c %s "$ZST" 2>/dev/null || echo 0)
      [ "$GOT" = "$CUBE_BYTES" ] || { echo "cube archive incomplete: $GOT != $CUBE_BYTES" >&2; exit 1; }
      echo "[dataset] archive complete ($GOT bytes); extracting"
      tar -I zstd -xf "$ZST" -C "$DL_HOME"
      FOUND=$(find "$DL_HOME" -name 'cube_single_expert.h5' -size +1G | head -1)
      [ -n "$FOUND" ] || { echo "cube h5 not found under $DL_HOME after extract" >&2; find "$DL_HOME" -maxdepth 2 | head -20; exit 1; }
      mkdir -p "$(dirname $TGT)"
      ln -sf "$FOUND" "$TGT"
      echo "[dataset] linked $FOUND -> $TGT"
    else
      echo "[dataset] reusing $TGT"
    fi
  fi
  ls -laR "$STABLEWM_HOME/datasets/" | head -20

  # ------------------------------------------------------ base identity check
  REPORT=$D/base_identity_${STAGE}.txt
  if [ ! -s "$REPORT" ]; then
    RAW=$RLP_DATA_HOME/wm_raw
    REV_ARG=""
    [ "$CELL" = pusht ] && REV_ARG="--revision $BASE_REVISION"
    pixi run hf download "$BASE_HF" weights.pt config.json $REV_ARG --local-dir "$RAW"
    # Compare against the RAW release: their bundled base keeps the
    # transformers-4 HF ViT naming, and convert_pldm's 1:1 transformers-4 -> 5
    # rename is deterministic, so raw identity implies converted identity.
    # Informational — the repro arms do not depend on the verdict.
    pixi run python scripts/hilewm/compare_base.py \
      --theirs "${HI_CKPT%_object.ckpt}_weights.ckpt" \
      --ours "$RAW/weights.pt" --json "$D/base_identity.json" \
      2>&1 | tee "$REPORT" || echo "[base-identity] verdict: DIFFERENT (see $REPORT)"
  fi
  cat "$REPORT"

  # --------------------------------------------------------- stage checkpoint
  # Registry names (h_le_wm/checkpoint_registry.yaml) map to canonical
  # relpaths; `policy=` takes the relpath without the `_object.ckpt` suffix.
  # Run their scripts INSIDE the pixi env: their wrapper does `exec python -m
  # h_le_wm.checkpoints`, and fetch_hf_baselines re-spawns a converter with
  # sys.executable — outside the env that is the image's python, which has no
  # hydra, and the fetch dies with ModuleNotFoundError.
  export HI_REG HI_CKPT
  $HRUN bash -c 'cd "$CODE" && bash scripts/setup_checkpoints.sh --checkpoint "$HI_REG=$HI_CKPT"'
  [ -f "$STABLEWM_HOME/${HI_POLICY}_object.ckpt" ] || \
    { echo "staging did not produce ${HI_POLICY}_object.ckpt" >&2; exit 1; }

  # their flat baseline needs the HF base as a canonical object checkpoint
  # (the subcommand's flag is --checkpoint, not --name)
  export FLAT_REG
  if [ ! -f "$STABLEWM_HOME/${FLAT_POLICY}_object.ckpt" ]; then
    $HRUN bash -c 'cd "$CODE" && bash scripts/setup_baseline_checkpoints.sh \
        fetch-baselines --checkpoint "$FLAT_REG"'
  fi
  [ -f "$STABLEWM_HOME/${FLAT_POLICY}_object.ckpt" ] || \
    { echo "fetch-baselines did not produce ${FLAT_POLICY}_object.ckpt" >&2; exit 1; }

  # swm 0.1.1's AutoCostModel resolves run names under <cache_dir>/checkpoints/,
  # while their checkpoints.py stages to <cache_dir>/ directly (artifact-vs-
  # library drift). Mirror both staged trees into the layout the loader expects.
  # Link the OBJECT FILES, not their directories: `mkdir -p <dir>` followed by
  # `ln -sfn <src> <dir>` nests the link inside the freshly created directory
  # instead of replacing it, which is why the cube hierarchical arm could not
  # find its checkpoint.
  for POL in "$FLAT_POLICY" "$HI_POLICY"; do
    mkdir -p "$(dirname "$STABLEWM_HOME/checkpoints/$POL")"
    ln -sf "$STABLEWM_HOME/${POL}_object.ckpt" \
           "$STABLEWM_HOME/checkpoints/${POL}_object.ckpt"
    [ -e "$STABLEWM_HOME/checkpoints/${POL}_object.ckpt" ] || \
      { echo "checkpoint mirror broken for $POL" >&2; exit 1; }
  done
  ls -lR "$STABLEWM_HOME/checkpoints/" | head -20

  # ------------------------------------------------------------------- arms
  # Queue admission costs ~1.5 h and the work costs minutes, so SMOKE=1 with
  # THEN_FULL=1 runs the tiny path check and, if it passes, continues straight
  # into the real arms inside the SAME admission.
  FULL_NUM_EVAL=$NUM_EVAL; FULL_SEEDS="$SEEDS"; FULL_OFFSETS="$OFFSETS"; FULL_ARMS="$ARMS"
  if [ "$SMOKE" = 1 ]; then
    # both arms: they load different configs (upstream flat vs hi_pusht) and
    # different checkpoints, so a flat-only smoke leaves half the path untested
    NUM_EVAL=${SMOKE_NUM_EVAL:-4}; SEEDS=42; OFFSETS=25; ARMS="flat hier"
    HI_S=64; HI_N=5; HI_K=4; LO_S=64; LO_N=10; LO_K=8
  fi

  EXTRA=""
  [ -n "$EPISODE_MIN" ] && EXTRA="$EXTRA +eval.episode_min=$EPISODE_MIN"
  [ -n "$ROWS_FILE" ] && EXTRA="$EXTRA +eval.row_indices_file=$ROWS_FILE"

  budget_for () { echo $(( $1 * 2 )); }
  # high/low CEM budgets per offset, from their matrix CSVs
  # d200 is beyond their published grid (they stop at d75): reuse the d75
  # budgets, which are their largest, rather than inventing a scaling law.
  hi_budget () { case $1 in 25) echo "900 20 10";; 50) echo "1500 40 10";; *) echo "1200 60 10";; esac; }
  lo_budget () { case $1 in 25) echo "300 30 150";; 50) echo "900 30 150";; *) echo "1200 30 150";; esac; }
  # high/low plan geometry for the hierarchical rows (their best non-staged row)
  hi_geom ()   { case $1 in 25) echo "1 2";; *) echo "2 2";; esac; }   # high_horizon low_horizon

  run_arms () {
   for OFF in $OFFSETS; do
    BUD=$(budget_for $OFF)
    set -- $(hi_budget $OFF); HS=$1; HN=$2; HK=$3
    set -- $(lo_budget $OFF); LS=$1; LN=$2; LK=$3
    set -- $(hi_geom $OFF);   HH=$1; LH=$2
    [ "$SMOKE" = 1 ] && { HS=$HI_S; HN=$HI_N; HK=$HI_K; LS=$LO_S; LN=$LO_N; LK=$LO_K; }

    for SD in $SEEDS; do
      for ARM in $ARMS; do
        LABEL="${ARM}_d${OFF}_s${SD}"
        echo "===== HILEWM $LABEL (stage=$STAGE, episode_min=${EPISODE_MIN:-none}) ====="
        case $ARM in
          flat)
            # Their flat LeWM+CEM baseline row: horizon 5, receding 5, block 5,
            # 300x30 (baseline_matrix.csv `D25;50;5;5;5;300;30`) — identical to
            # our own PushT CEM protocol. NOTE baseline_manifest is hard-wired
            # to the UPSTREAM config (config_path=../../third_party/lewm/
            # config/eval, config_name=pusht): there is no `planning` block and
            # no `cache_dir` key there, and `eval.device` must be added with +.
            $HRUN python -m h_le_wm.eval.baseline_manifest \
              --config-name=$FLAT_CONFIG \
              policy=$FLAT_POLICY seed=$SD \
              eval.num_eval=$NUM_EVAL eval.goal_offset_steps=$OFF eval.eval_budget=$BUD \
              eval.dataset_name=$DATASET_NAME \
              +eval.device=cuda \
              plan_config.horizon=5 plan_config.receding_horizon=5 plan_config.action_block=5 \
              solver.num_samples=300 solver.n_steps=30 solver.topk=30 solver.device=cuda \
              output.filename=${LABEL}.txt +output.root_dir="$D/$LABEL" \
              $EXTRA 2>&1 | tee "$D/log_${LABEL}.txt" | tail -25 ;;
          hier|hierc)
            EMP="planning.high.empirical_macro.enabled=false"
            if [ "$ARM" = hierc ]; then
              EMP="planning.high.empirical_macro.enabled=true \
                   planning.high.empirical_macro.num_sequences=$EMP_NUM_SEQUENCES \
                   planning.high.empirical_macro.chunk_len=$EMP_CHUNK_LEN \
                   planning.high.empirical_macro.residual_scale=$EMP_RESIDUAL_SCALE \
                   planning.high.empirical_macro.return_top_candidates=$EMP_TOP_CANDIDATES"
            fi
            $HRUN python -m h_le_wm.eval.hierarchical \
              --config-name=$HI_CONFIG \
              policy=$HI_POLICY seed=$SD \
              planning.mode=hierarchical \
              $WORLD_DROP \
              eval.num_eval=$NUM_EVAL eval.goal_offset_steps=$OFF eval.eval_budget=$BUD \
              eval.dataset_name=$DATASET_NAME \
              planning.high.plan_config.horizon=$HH \
              planning.high.plan_config.receding_horizon=1 \
              planning.high.plan_config.action_block=1 \
              planning.high.replan_interval=5 \
              planning.high.solver.num_samples=$HS planning.high.solver.n_steps=$HN \
              planning.high.solver.topk=$HK planning.high.solver.device=cuda \
              planning.low.plan_config.horizon=$LH \
              planning.low.plan_config.receding_horizon=1 \
              planning.low.plan_config.action_block=5 \
              planning.low.solver.num_samples=$LS planning.low.solver.n_steps=$LN \
              planning.low.solver.topk=$LK planning.low.solver.device=cuda \
              solver.device=cuda \
              $EMP \
              output.filename=${LABEL}.txt +output.root_dir="$D/$LABEL" \
              $EXTRA 2>&1 | tee "$D/log_${LABEL}.txt" | tail -25 ;;
        esac
        echo "----- RESULT $LABEL -----"
        find "$D/$LABEL" -name "${LABEL}.txt" -exec cat {} \; 2>/dev/null \
          || echo "metrics: MISSING (see log_${LABEL}.txt)"
      done
    done
   done
  }

  run_arms
  if [ "$SMOKE" = 1 ] && [ "${THEN_FULL:-0}" = 1 ]; then
    echo "===== smoke passed; continuing into the full arms in this admission ====="
    SMOKE=0
    NUM_EVAL=$FULL_NUM_EVAL; SEEDS="$FULL_SEEDS"; OFFSETS="$FULL_OFFSETS"; ARMS="$FULL_ARMS"
    run_arms
  fi

  echo "HILEWM_DONE tag=$EXPERIMENT_TAG stage=$STAGE"
