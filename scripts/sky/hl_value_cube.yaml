# Macro-level high-level value on OGBench cube — Pantheon cluster.
#
#   sky jobs launch scripts/sky/hl_value_cube.yaml -n hlvalue-cube \
#       --priority p1 --env EXPERIMENT_TAG=hlvalue-cube-$(date +%Y%m%d) -y
#
# WHY. Every high-level value in the 2026-07 HWM campaign was an ENV-STEP
# critic (train_lip_hl.py trains on the dense fs1 cache in primitive steps),
# and the high-level CEM never used a learned value at all — solver/hlip.py
# `_cem_search` scores raw terminal latent MSE. So "hierarchical CEM + value"
# has never been deployed, and the h200 floor (every family <= 2.0,
# RESULTS_hwm.md F7) was read as a data-support boundary without that
# configuration ever being tried.
#
# The premise F7 did not test: at stride K=25 a 201-step cube episode is 9
# waypoints, so a 200-step goal is a distance-**8** query — a pair present
# in-episode in EVERY episode, learnable with n_step=8 and no bootstrap chain.
# The env-step critic had to reach 200 by chaining n-step-50 backups, which
# saturate. If a macro-level value is informative at separation 8, the h200
# floor is a units problem, not a data problem.
#
# STAGE 1 (this job): build the cube fs1 latent cache, train the macro value,
# and read the built-in probe (corr(V, delta) and V(g,g) at separation up to
# 8). That gates everything else and needs no F² and no hierarchical solver.
#
# STAGE 2 (not yet wired): retrain F² (train_hwm.py, stride 25 x horizon 8 =
# 200 env steps — our design reaches h200; Hi-LeWM's released cube high level
# cannot, its waypoints cap at 5 x max_span 15 = 75) and deploy
# HLIPSolver(hl=cem, ll=cem, hl_cost=value, hl_value_path=...) at goal offset
# 200. Requires porting hwm.py/hlip.py into this repo — the pasted swm tree
# they live in has no `trm` module in the installed wheel.

name: hlvalue-cube

envs:
  PANTHEON_USER: armin@pantheon.inc
  EXPERIMENT_TAG: hlvalue-cube
  OUT_ROOT: /newcheckpoints

  STRIDE: "25"          # env steps per macro; 201-step episodes -> 9 waypoints
  MAX_DELTA: "8"        # max goal separation in MACRO steps (= 200 env steps)
  N_STEP: "8"           # TD backup span in MACRO steps: one hop spans the episode
  VALUE_STEPS: "6000"
  EXPECTILE_FINALS: "0.03 0.09 0.2"
                            # 2026-09-19: corr(V,delta) peaked 0.861 at tau~0.09
                            # and decayed to 0.762 by tau 0.03 -- the env-step
                            # recipe's anneal may be wrong for macro units, so
                            # sweep the final expectile instead of inheriting it
  P_CROSS: "0.3"
  GAMMA: "1.0"          # undiscounted steps-to-go; nothing saturates at 8
  SEEDS: "0"
  TRAIN_EPISODES: "8000"  # held-out protocol: eval draws 8000-9999

  # control arm: the same trainer at env-step granularity (stride 1), capped at
  # the span the old critic could actually represent. Isolates "macro units"
  # from "this trainer".
  RUN_CONTROL: "1"

resources:
  accelerators: H200:1
  cpus: 8
  memory: 90
  image_id: docker:pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel
  labels:
    telemetry-contract: opt-out
    telemetry-opt-out-reason: replication-validation

volumes:
  /checkpoints: checkpoints
  /newcheckpoints: armin-rlp-checkpoints

workdir: .

setup: |
  set -euo pipefail
  sudo apt-get update -qq >/dev/null 2>&1 || apt-get update -qq
  (sudo apt-get install -yqq curl git libegl1 libgl1 libosmesa6 >/dev/null 2>&1 \
    || apt-get install -yqq curl git libegl1 libgl1 libosmesa6 >/dev/null)
  curl -fsSL https://pixi.sh/install.sh | bash
  export PATH=$HOME/.pixi/bin:$PATH
  cd ~/sky_workdir
  pixi install -e default

run: |
  set -euo pipefail
  export PATH=$HOME/.pixi/bin:$PATH
  cd ~/sky_workdir
  export LD_LIBRARY_PATH=$PWD/.pixi/envs/default/lib:${LD_LIBRARY_PATH:-}
  export MUJOCO_GL=egl MUJOCO_EGL_DEVICE_ID=0
  export RLP_DATA_HOME=/tmp/rlp-data
  mkdir -p "$RLP_DATA_HOME"

  D=${OUT_ROOT}/$PANTHEON_USER/$EXPERIMENT_TAG
  mkdir -p "$D" && chmod 777 "$D"
  CD=${OUT_ROOT}/$PANTHEON_USER/hlvalue-caches
  mkdir -p "$CD"

  WM=assets/core/world_model/lewm_cube      # v2WM, the base our cube RLP uses
  CACHE=$CD/cube_v2wm_fs1.pt

  # ------------------------------------------------------------ cube dataset
  pixi run tool tool=fetch_dataset dataset=ogb_cube
  DS=$(find "$RLP_DATA_HOME/datasets" -maxdepth 1 -name 'ogb_cube_single*' | head -1)
  [ -n "$DS" ] || { echo "cube dataset not found under $RLP_DATA_HOME/datasets" >&2; ls -la "$RLP_DATA_HOME/datasets"; exit 1; }
  echo "[data] $DS"

  # ------------------------------------------------------- fs1 latent cache
  # The long pole (~2 h encode). Cached on the volume so later stages and the
  # F² retrain reuse it.
  if [ ! -s "$CACHE" ]; then
    pixi run tool tool=cache_latents wm="$WM" dataset="$DS" out="$CACHE"
  else
    echo "[cache] reusing $CACHE"
  fi
  ls -la "$CACHE"

  # ------------------------------------------------- macro-level HL value
  for SD in $SEEDS; do
    for TAU in $EXPECTILE_FINALS; do
      TAG=t${TAU/./p}
      OUT=$D/hl_value_s${STRIDE}_${TAG}_seed${SD}
      echo "===== HL VALUE stride=$STRIDE max_delta=$MAX_DELTA n_step=$N_STEP tau_final=$TAU seed=$SD ====="
      pixi run python scripts/hierarchy/train_hl_value.py \
        --cache "$CACHE" --out "$OUT" \
        --stride "$STRIDE" --max-delta "$MAX_DELTA" --n-step "$N_STEP" \
        --gamma "$GAMMA" --steps "$VALUE_STEPS" --p-cross "$P_CROSS" \
        --expectile-final "$TAU" \
        --holdout-ep "$TRAIN_EPISODES" --seed "$SD" \
        2>&1 | tee "$D/log_hl_value_${TAG}_seed${SD}.txt"
    done

    # ---- control: same trainer, env-step units, span the old critic had.
    # A macro value that is informative where this one is not localises the
    # h200 floor in the UNITS rather than in the trainer or the data.
    if [ "${RUN_CONTROL:-0}" = 1 ]; then
      echo "===== CONTROL env-step units (stride 1, max_delta 200, n_step 50) seed=$SD ====="
      pixi run python scripts/hierarchy/train_hl_value.py \
        --cache "$CACHE" --out "$D/env_value_seed${SD}" \
        --stride 1 --max-delta 200 --n-step 50 \
        --gamma "$GAMMA" --steps "$VALUE_STEPS" --p-cross "$P_CROSS" \
        --holdout-ep "$TRAIN_EPISODES" --seed "$SD" \
        2>&1 | tee "$D/log_env_value_seed${SD}.txt"
    fi
  done

  echo "HLVALUE_DONE tag=$EXPERIMENT_TAG"
  grep -h "corr(V,delta)" "$D"/log_*.txt | tail -20 || true
