# Read-only: dump the per-snapshot selection logs (ckptval) of cluster jobs from the results volume
# into this job's log, for scripts/collect_ckptval.sh (fixed-stop selection). No GPU, no deletion.
#   sky jobs launch scripts/sky/tools/ckptval_read.yaml -n ckptval-read -y --async --env TAGS="rlp-cu-uniJ-20260921 rlp-cu-uniJ-p-20260921"
#   sky jobs logs <id> --no-follow | sed 's/.*rank=0)..//' | grep -E '^=== |\[summary\]' > cluster_ckptval.txt
name: ckptval-read
envs:
  TAGS: ""
  PANTHEON_USER: armin@pantheon.inc
resources:
  cpus: 2
  memory: 8
  image_id: docker:pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel
volumes:
  /checkpoints: armin-rlp-checkpoints
run: |
  set -u
  for t in $TAGS; do
    # driver log: every "[ckpt-select] <row> s<seed> <snapshot> val= h25= h100=" and winner line of the job
    # tworoom/cube yaml: <tag>/grid_driver.log ; reacher yaml: <tag>/results/driver.log
    for d in /checkpoints/$PANTHEON_USER/$t/grid_driver.log /checkpoints/$PANTHEON_USER/$t/results/driver.log; do
      [ -f "$d" ] || continue
      echo "=== DRIVER $t"; grep -h "\[ckpt-select\]" "$d"; echo "=== END DRIVER"
      # per-row report evals (draws 42-44) of the deployed winners, where the yaml still ran them
      echo "=== CELLS $t"; grep -h "^\[cell\]\|\[cell\] " "$d" | grep -v "rh5_h[0-9]*_s4[89]\|_s5[01]" ; echo "=== END CELLS"
    done
    # reacher: every measured (row, seed, snapshot, draw) score lives in results/summary.csv
    [ -f /checkpoints/$PANTHEON_USER/$t/results/summary.csv ] && { echo "=== SUMMARY $t"; cat /checkpoints/$PANTHEON_USER/$t/results/summary.csv; echo "=== END SUMMARY"; }
    # deployed / fixed-pair report evals: <tag>/logs/g_<row>_s<seed>_eval.log holds the [summary] json (draws 42-44)
    for f in /checkpoints/$PANTHEON_USER/$t/logs/g_*_eval.log; do
      [ -f "$f" ] || continue
      b=$(basename "$f" _eval.log); row=${b#g_}; row=${row%_s*}; seed=${b##*_s}
      echo "=== EVAL $t $row $seed"; grep -oE '\[summary\] \{[^}]*\}' "$f" | tail -1; echo "=== END EVAL"
    done
    for f in /checkpoints/$PANTHEON_USER/$t/logs/g_*_ckptval.log; do
      [ -f "$f" ] || continue
      b=$(basename "$f" _ckptval.log); row=${b#g_}; row=${row%_s*}; seed=${b##*_s}
      echo "=== $t $row $seed"; grep -oE '\[summary\] \{[^}]*\}' "$f"; echo "=== END"
    done
  done
  echo "[ckptval-read] done"
