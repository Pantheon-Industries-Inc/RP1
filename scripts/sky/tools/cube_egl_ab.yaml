    telemetry-contract: training-v1
file_mounts:
  /tmp/codex-overlays/train_lip_ac.py: ./scripts/sky/overlays/train_lip_ac.py
  /tmp/codex-overlays/latent_cache.py: ./scripts/sky/overlays/latent_cache.py
  /tmp/codex-overlays/lip.py: ./scripts/sky/overlays/lip.py
  /tmp/cube_staged.sh: ./scripts/sky/overlays/cube_staged.sh
  /tmp/codex-overlays/train_metric.py: ./scripts/sky/unigamma/overlays_boundary/train_metric.py
  /tmp/codex-overlays/td.py: ./scripts/sky/unigamma/overlays_boundary/td.py
setup: "set -euo pipefail\nsudo apt-get update -qq\nsudo apt-get install -yqq git git-lfs zstd util-linux libegl1 libgl1 libglew-dev libosmesa6 patchelf >/dev/null 2>&1 || true\n\n# ---- code + assets by\
  \ clone. The token is passed as a --secret so it is not in\n# the YAML or the job record; it is scrubbed from the remote URL immediately\n# after fetch so it does not persist in .git/config on the node.\n\
  cd ~\nif [ ! -d repo ]; then\n  # LFS budget exhausted 2026-08-18: never smudge on clone; real objects\n  # come from the volume stage (below) or a targeted pull as fallback.\n  GIT_LFS_SKIP_SMUDGE=1\
  \ git clone -q --depth 1 --branch eval-sweep \\\n    \"https://x-access-token:${GIT_TOKEN}@github.com/armin-sommer/Value_Metric_LeWM.git\" repo\nfi\ncd ~/repo\ngit remote set-url origin https://github.com/armin-sommer/Value_Metric_LeWM.git\n\
  git lfs install --local >/dev/null 2>&1 || true\ngit config lfs.url \"https://x-access-token:${GIT_TOKEN}@github.com/armin-sommer/Value_Metric_LeWM.git/info/lfs\"\nif [ \"$ENVNAME\" = tworoom ] && [ \"\
  ${WANDB_CKPT_RESTORE:-1}\" = 1 ]; then\n  echo \"[lfs-stage] deferring ${BASE}_tworoom restore to the W&B artifact (after pip install)\"\nelif [ \"$ENVNAME\" = tworoom ]; then\n  TDCANON_GLOB=td_canon_${BASE}_e0.1_n50_s*.pt\n\
  \  [ \"$BASE\" = dinowm ] && TDCANON_GLOB=td_canon_dinowm_r200000_e0.1_n50_s*.pt\n  git lfs pull -I \"tworoom_matrix_20260727/checkpoints/${BASE}_tworoom/**\" \\\n                -I \"tworoom_matrix_20260727/metrics/${TDCANON_GLOB}\"\
  \ 2>&1 | tail -1\nelse\n  CUBE_STAGE=/checkpoints/${PANTHEON_USER}/lfs_stage/swm_checkpoints\n  if [ -f \"$CUBE_STAGE/.staged\" ]; then\n    mkdir -p stable-worldmodel/checkpoints\n    for D in ogbench_cube_single_v2WM\
  \ PLDM_OgBench lewm_cube_dyna pldm_cube_dyna; do\n      [ -d \"$CUBE_STAGE/$D\" ] || continue\n      rm -rf \"stable-worldmodel/checkpoints/$D\"\n      cp -rL \"$CUBE_STAGE/$D\" stable-worldmodel/checkpoints/\n\
  \    done\n    echo \"[lfs-stage] cube checkpoints restored from the volume stage\"\n  else\n    git lfs pull -I \"stable-worldmodel/checkpoints/**\" 2>&1 | tail -1\n  fi\nfi\ngit config --unset lfs.url\
  \ || true\necho \"[repo] $(git rev-parse --short HEAD) on $(git rev-parse --abbrev-ref HEAD)\"\n\n# cube eval imports stable_worldmodel.envs.ogbench (dm_control, ogbench) and\n# stable_worldmodel.envs.utils\
  \ (pygame, pymunk, shapely). This is the FULL\n# transitive set: envs/__init__.py registers entry points lazily, so no other\n# env family's imports fire. Missing any of these = every cell scores None.\n\
  EXTRA=\"\"; [ \"$ENVNAME\" = cube ] && EXTRA=\"gymnasium-robotics mujoco<3.12 dm_control ogbench pygame pymunk shapely\"\npip install -q -e \"$HOME/repo/stable-worldmodel[train,format]\" \\\n  opencv-python-headless\
  \ hdf5plugin hf_transfer wandb $EXTRA 2>&1 | tail -2\n\n# ---- TwoRoom base WM restore via W&B artifact (GitHub LFS budget is\n# exhausted 2026-08-18; the clone above is stubs-only). Loud stub guard.\n\
  if [ \"$ENVNAME\" = tworoom ] && [ \"${WANDB_CKPT_RESTORE:-1}\" = 1 ]; then\n  # Volume stage first (stage_lfs.yaml, verified by stage_probe.yaml): real\n  # files on the shared volume, no artifact-layout\
  \ or LFS-budget exposure.\n  STAGE_D=/checkpoints/${PANTHEON_USER}/lfs_stage/tworoom_matrix_20260727/checkpoints\n  if [ -f \"$STAGE_D/.staged\" ] && [ -f \"$STAGE_D/${BASE}_tworoom/weights.pt\" ] \\\n\
  \     && [ ! -L \"$STAGE_D/${BASE}_tworoom/weights.pt\" ] \\\n     && [ \"$(stat -c %s \"$STAGE_D/${BASE}_tworoom/weights.pt\")\" -gt 50000000 ]; then\n    for B in lejepa pldm; do\n      rm -rf \"tworoom_matrix_20260727/checkpoints/${B}_tworoom\"\
  \n      cp -rL \"$STAGE_D/${B}_tworoom\" tworoom_matrix_20260727/checkpoints/\n    done\n    echo \"[lfs-stage] tworoom checkpoints restored from the volume stage\"\n  else\n    python3 -c 'import wandb;\
  \ wandb.Api().artifact(\"armin-sommer/RLP/tworoom_base_ckpts:latest\").download(root=\"/tmp/tw_ckpts\")'\n    for B in lejepa pldm; do\n      rm -rf \"tworoom_matrix_20260727/checkpoints/${B}_tworoom\"\
  \n      cp -rL \"/tmp/tw_ckpts/${B}_tworoom\" tworoom_matrix_20260727/checkpoints/\n    done\n  fi\n  SZ=$(stat -c %s \"tworoom_matrix_20260727/checkpoints/${BASE}_tworoom/weights.pt\")\n  [ \"$SZ\" -gt\
  \ 50000000 ] || { echo \"[wandb-restore] weights.pt only ${SZ}B\" >&2; exit 1; }\n  echo \"[wandb-restore] ${BASE}_tworoom restored (${SZ} bytes)\"\nfi\ncp /tmp/codex-overlays/train_lip_ac.py \"$HOME/repo/stable-worldmodel/scripts/plan/train_lip_ac.py\"\
  \ncp /tmp/codex-overlays/latent_cache.py \"$HOME/repo/stable-worldmodel/stable_worldmodel/trm/latent_cache.py\"\ncp /tmp/codex-overlays/lip.py \"$HOME/repo/stable-worldmodel/stable_worldmodel/solver/lip.py\"\
  \ncp /tmp/codex-overlays/train_metric.py \"$HOME/repo/stable-worldmodel/scripts/plan/train_metric.py\"\ncp /tmp/codex-overlays/td.py \"$HOME/repo/stable-worldmodel/stable_worldmodel/trm/learners/td.py\"\
  \n\npython3 -c 'import os, torch; n=torch.cuda.device_count(); m=int(os.environ.get(\"MAXPAR\",\"8\")); assert n>=1 and m<=2*n, f\"{n} GPUs, MAXPAR {m} (max 2 slots per GPU)\"; print(f\"[env] torch {torch.__version__}\
  \ gpus {n} slots {m}\")'\n\n# raid0 janitor: node-local caches accumulate across campaigns and a full\n# raid0 both ENOSPC-kills new jobs and leaves truncated files that poison\n# later jobs on the node.\
  \ Prune stale (>3 days), unlocked, non-current\n# dirs \u2014 caches are rebuildable by design.\nFREE_GB=$(df -BG --output=avail /mnt/raid0 2>/dev/null | tail -1 | tr -dc '0-9')\nif [ \"${FREE_GB:-999}\"\
  \ -lt 300 ]; then\n  echo \"[janitor] raid0 ${FREE_GB}GB free < 300GB; pruning stale dirs\"\n  for d in /mnt/raid0/rlp-cache/* /mnt/raid0/rlp-runs/* /mnt/raid0/rlp-wandb/* \\\n           /mnt/raid0/rlp-re-*\
  \ /mnt/raid0/rlp-reacher-* /mnt/raid0/rlp11-*reacher* /mnt/raid0/rlp-atlas-re-*; do\n    [ -d \"$d\" ] || continue\n    case \"$d\" in *\"${CACHE_VERSION}-${ENVNAME}-${BASE}\"*|*\"${EXPERIMENT_TAG}\"\
  *) continue;; esac\n    [ -n \"$(find \"$d\" -maxdepth 2 -mtime -3 -print -quit 2>/dev/null)\" ] && continue\n    if [ -f \"$d/build.lock\" ]; then flock -n \"$d/build.lock\" true 2>/dev/null || continue;\
  \ fi\n    echo \"[janitor] rm $(du -sh \"$d\" 2>/dev/null | cut -f1) $d\"; rm -rf \"$d\" 2>/dev/null || true\n  done\n  df -h /mnt/raid0 | tail -1\n  FREE_GB=$(df -BG --output=avail /mnt/raid0 2>/dev/null\
  \ | tail -1 | tr -dc '0-9')\nfi\necho \"[node] k8s=${K8S_NODE:-unknown} pod=$(hostname) raid0_free=${FREE_GB:-?}GB\"\nif [ \"${FREE_GB:-999}\" -lt 150 ]; then\n  echo \"[janitor] FATAL: only ${FREE_GB}GB\
  \ free on this node's raid0 after pruning; top consumers:\" >&2\n  du -sh /mnt/raid0/*/ 2>/dev/null | sort -h | tail -12 >&2\n  exit 3\nfi\nWANDB_ROOT=/mnt/raid0/rlp-wandb/${EXPERIMENT_TAG}/shard-${SHARD_INDEX:-0}\n\
  mkdir -p \"$WANDB_ROOT\"/{runs,artifacts,cache}\nexport WANDB_DIR=\"$WANDB_ROOT/runs\"\nexport WANDB_ARTIFACT_DIR=\"$WANDB_ROOT/artifacts\"\nexport WANDB_CACHE_DIR=\"$WANDB_ROOT/cache\"\n\n# wandb proven\
  \ BEFORE training: train_lip_ac wraps init in try/except so a\n# silent auth failure would be indistinguishable from success.\npython3 -c \"\nimport os, wandb\nk = os.environ.get('WANDB_API_KEY', '');\
  \ assert k, 'WANDB_API_KEY not set'\nwandb.login(key=k, relogin=True)\nr = wandb.init(project=os.environ['WANDB_PROJECT'], entity=os.environ['WANDB_ENTITY'],\n               name='grid-probe-' + os.environ['ENVNAME']\
  \ + '-' + os.environ['BASE'],\n               job_type='probe', reinit=True)\nr.log({'probe': 1}); u = getattr(r, 'url', None) or (r.get_url() if hasattr(r, 'get_url') else ''); r.finish(); print('[wandb]\
  \ verified ->', u)\n\"\n\nSCRATCH=/mnt/raid0/rlp-runs/${EXPERIMENT_TAG}/shard-${SHARD_INDEX:-0}\nCACHE_ROOT=/mnt/raid0/rlp-cache/${CACHE_VERSION}-${ENVNAME}-${BASE}\n# a non-READY cache older than 3h\
  \ is a crashed/truncated build (e.g. a\n# prior ENOSPC): wipe it rather than trust partial files\nif [ -d \"$CACHE_ROOT\" ] && [ ! -f \"$CACHE_ROOT/READY\" ] \\\n    && [ -z \"$(find \"$CACHE_ROOT\" -maxdepth\
  \ 1 -mmin -180 -print -quit 2>/dev/null)\" ] \\\n    && [ -n \"$(ls -A \"$CACHE_ROOT\" 2>/dev/null)\" ]; then\n  echo \"[janitor] wiping stale partial cache $CACHE_ROOT\"\n  rm -rf \"$CACHE_ROOT\"\nfi\n\
  mkdir -p \"$SCRATCH\" \"$CACHE_ROOT\" \"$CACHE_ROOT/hf\"\nchmod 777 \"$SCRATCH\" \"$CACHE_ROOT\"\nfor d in gh gm gc gd; do\n  mkdir -p \"$CACHE_ROOT/$d\"\n  [ ! -e \"$HOME/$d\" ] || { echo \"refusing\
  \ to replace existing $HOME/$d\"; exit 1; }\n  ln -s \"$CACHE_ROOT/$d\" \"$HOME/$d\"\ndone\nfor d in gl ga; do\n  mkdir -p \"$SCRATCH/$d\"\n  [ ! -e \"$HOME/$d\" ] || { echo \"refusing to replace existing\
  \ $HOME/$d\"; exit 1; }\n  ln -s \"$SCRATCH/$d\" \"$HOME/$d\"\ndone\nexport HF_HOME=\"$CACHE_ROOT/hf\"\nmkdir -p ~/gh/checkpoints ~/gm ~/gl ~/gc ~/gd ~/ga\nexec 9>\"$CACHE_ROOT/build.lock\"\nflock 9\n\
  echo \"[cache] lock acquired: $CACHE_ROOT\"\nA=~/repo/tworoom_matrix_20260727\nif [ \"$ENVNAME\" = tworoom ]; then\n  cp -r $A/checkpoints/${BASE}_tworoom ~/gh/checkpoints/ 2>/dev/null || true\n  if [\
  \ \"${FULLCACHE:-0}\" != 1 ] && [ \"${SPLIT:-0}\" != 1 ]; then\n    for TS in 0 1 2; do\n      SRC=$A/metrics/td_canon_${BASE}_e0.1_n50_s${TS}.pt\n      [ \"$BASE\" = dinowm ] && SRC=$A/metrics/td_canon_dinowm_r200000_e0.1_n50_s${TS}.pt\n\
  \      cp \"$SRC\" ~/gm/td_grid_s${TS}.pt\n    done\n  fi\nelse\n  # cube: LeWM = v2WM, PLDM = PLDM_OgBench, both LFS-tracked in the repo.\n  # One .pt per dir -- the loader refuses an ambiguous checkpoint\
  \ directory.\n  C=~/repo/stable-worldmodel/checkpoints\n  if [ -n \"${CU_DYNA_WM:-}\" ]; then\n    # Dyna v2 export (dyna2_collect_ft.yaml): fine-tuned WM on the volume\n    [ -d \"$CU_DYNA_WM\" ] ||\
  \ { echo \"missing CU_DYNA_WM dir: $CU_DYNA_WM\" >&2; exit 1; }\n    SRC=$CU_DYNA_WM; DST=${BASE}_cube\n  elif [ \"${CU_DYNA:-0}\" = 1 ]; then\n    # Dyna-finetuned WMs (one Dyna iteration on the planner's\
  \ own failure\n    # rollouts, h25 collection; the paper's RP1_Dyna row). WM-side only --\n    # the unified planner config is unchanged.\n    if [ \"$BASE\" = lewm ]; then SRC=$C/lewm_cube_dyna; DST=lewm_cube\n\
  \    else                        SRC=$C/pldm_cube_dyna; DST=pldm_cube; fi\n  elif [ \"$BASE\" = lewm ]; then SRC=$C/ogbench_cube_single_v2WM; DST=lewm_cube\n  else                          SRC=$C/PLDM_OgBench;\
  \             DST=pldm_cube; fi\n  mkdir -p ~/gh/checkpoints/$DST\n  cp \"$SRC\"/*.pt ~/gh/checkpoints/$DST/ 2>/dev/null || true\n  cp \"$SRC\"/config.json ~/gh/checkpoints/$DST/ 2>/dev/null || true\n\
  fi\nfind ~/gh ~/gm -name '._*' -delete 2>/dev/null || true\nif [ \"$ENVNAME\" = tworoom ]; then CK=~/gh/checkpoints/${BASE}_tworoom\nelse CK=~/gh/checkpoints/${BASE}_cube; fi\nPROFILE=tworoom-lewm\n[\
  \ \"$ENVNAME\" = tworoom ] && [ \"$BASE\" = pldm ] && PROFILE=tworoom-pldm\n[ \"$ENVNAME\" = cube ] && PROFILE=ogbench-lewm\n[ \"$ENVNAME\" = cube ] && [ \"$BASE\" = pldm ] && PROFILE=ogbench-pldm\n[\
  \ -d \"$CK\" ] || { echo \"missing expected WM directory: $CK\" >&2; exit 1; }\nfind \"$CK\" -maxdepth 1 -type f -name '*.pt' | grep -q . \\\n  || { echo \"no checkpoint .pt in expected WM directory:\
  \ $CK\" >&2; exit 1; }\necho \"[assets] wm=$(basename \"$CK\") | $(ls ~/gm/ 2>/dev/null | tr '\\n' ' ')\"\n\n# ---- dataset, fetched on the node (never uploaded)\nif [ \"$ENVNAME\" = tworoom ]; then\n\
  \  REPO=quentinll/lewm-tworooms; FILE=tworoom.tar.zst\nelse\n  REPO=quentinll/lewm-cube;     FILE=cube_single_expert.tar.zst\nfi\n# A preempted job can leave a TRUNCATED h5 behind (tar interrupted mid-extract):\
  \ an\n# existence check then passes and h5py fails (\"truncated file: eof < stored_eof\").\n# Validate by opening; on failure wipe and fetch again (one retry, then fail loudly).\nfor _attempt in 1 2;\
  \ do\n  if ! ls ~/gd/*.h5 >/dev/null 2>&1; then\n    cd ~/gd\n    HF_HUB_ENABLE_HF_TRANSFER=1 python3 -c \"from huggingface_hub import hf_hub_download; hf_hub_download('$REPO','$FILE',repo_type='dataset',local_dir='.')\"\
  \n    tar --use-compress-program=unzstd -xf \"$FILE\" && rm -f \"$FILE\"\n  fi\n  if python3 -c \"\nimport hdf5plugin, h5py, glob, os\nf = sorted(glob.glob(os.path.expanduser('~/gd/*.h5')))[0]\nh = h5py.File(f,\
  \ 'r')\nprint('[dataset]', os.path.basename(f), h['action'].shape[0], 'frames',\n      '| %.1f GB' % (os.path.getsize(f) / 1e9))\nh.close()\n\"; then break; fi\n  echo \"[dataset] h5 unreadable (truncated\
  \ download/extract?) -- wiping ~/gd and refetching (attempt $_attempt)\"\n  rm -f ~/gd/*.h5 ~/gd/*.tar.zst ~/gd/*.tar\n  [ \"$_attempt\" = 2 ] && { echo \"[dataset] still unreadable after refetch\" >&2;\
  \ exit 1; }\ndone\n\necho \"[ab-setup] done (no TD cache build)\"\n"
run: |
  set -uo pipefail
  echo "[node] $(hostname) | gpus: $(nvidia-smi --query-gpu=index,uuid --format=csv,noheader 2>/dev/null | tr '\n' ' ')"
  cd ~/repo/stable-worldmodel
  export STABLEWM_HOME=~/gh PYTHONPATH=$PWD HF_HOME=/mnt/raid0/rlp-cache/${CACHE_VERSION}-${ENVNAME}-${BASE}/hf TQDM_DISABLE=1
  export OMP_NUM_THREADS=8 MKL_NUM_THREADS=8 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True WANDB_MODE=disabled
  export HDF5_PLUGIN_PATH=$(python3 -c 'import hdf5plugin; print(hdf5plugin.PLUGIN_PATH)')
  export MUJOCO_GL=egl PYOPENGL_PLATFORM=egl
  H5=$(ls ~/gd/*.h5 | head -1); CK=~/gh/checkpoints/${BASE}_cube
  SNAP=""; for c in $AB_SNAPSHOTS; do [ -f "$c" ] && SNAP=$c && break; done
  [ -n "$SNAP" ] || { echo "[ab] no candidate snapshot found on the volume"; ls /checkpoints/$PANTHEON_USER/rlp-cu-uniJ-h100-p-20260921/actors | head; exit 1; }
  EXTRAEVAL="--override ++bf16=true +eval.ep_range=8000:10000"
  mkdir -p ~/gl
  run_eval(){ # $1 gpu, $2 label
    mkdir -p ~/gl/$2
    CUDA_VISIBLE_DEVICES=$1 MUJOCO_EGL_DEVICE_ID=$1 python3 scripts/plan/eval_log.py --actor "$SNAP" --env-config "$ENVNAME" --h5 "$H5" --policy "$CK" \
      --rh 5 --seeds $AB_DRAWS --offsets $AB_OFF $EXTRAEVAL --log-dir ~/gl/$2 --tag ckv5 > ~/gl/ab_$2.log 2>&1
    echo "[ab] $2 gpu$1 rc=$? $(grep -oE '\[summary\] \{[^}]*\}' ~/gl/ab_$2.log | tail -1)"
    grep -oE '"rh5_h[0-9]+_s[0-9]+": [0-9.]+' ~/gl/ab_$2.log | tr '\n' ' ' | sed "s/^/[ab-cells] $2: /"; echo
  }
  echo "[ab] snapshot $SNAP | draws $AB_DRAWS | offset $AB_OFF"
  t0=$(date +%s); run_eval 0 solo;                                  echo "[ab] solo: $(( $(date +%s)-t0 )) s"
  t0=$(date +%s); for g in 0 1 2 3; do run_eval $g par$g & done; wait; echo "[ab] 4-parallel (one per GPU): $(( $(date +%s)-t0 )) s"
  t0=$(date +%s); run_eval 0 share0a & run_eval 0 share0b & wait;      echo "[ab] 2-on-GPU0 (shared render device): $(( $(date +%s)-t0 )) s"
  echo "[ab] done"
volumes:
  /checkpoints: armin-rlp-checkpoints
  /old_checkpoints: checkpoints
secrets:
- secrets:WANDB_API_KEY
- secrets:GIT_TOKEN
config:
  kubernetes:
    pod_config:
      spec:
        nodeSelector:
          pantheon.inc/raid0: enabled
        volumes:
        - name: raid0
          hostPath:
            path: /mnt/raid0
            type: Directory
        containers:
        - volumeMounts:
          - mountPath: /mnt/raid0
            name: raid0
          env:
          - name: K8S_NODE
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
