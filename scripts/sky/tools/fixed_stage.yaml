# Stage chosen actor SNAPSHOTS (fixed-stop protocol) under an import tag on the results volume so the
# rescue yaml can re-evaluate them with REUSE_ONLY=1 ACTOR_IMPORT_TAG=<tag>-fixedimport
# EVAL_TAG=rh5fixed UNIG_OFF=<horizon>. Copies only; nothing is deleted.
#   sky jobs launch scripts/sky/tools/fixed_stage.yaml -n fixed-stage -y --async \
#     --env ITEMS="rlp-cu-uniJ-20260921:cube:lewm:unig_ctrl_a2.5_t9000:1:2000 rlp-cu-uniJ-20260921:cube:lewm:unig_ctrl_a2.5_t3000:2:final"
name: fixed-stage
envs:
  ITEMS: ""                 # space-separated tag:env:base:row:seed:step|final
  DEST_TAG: ""              # optional single destination import tag (default <tag>-fixedimport per item)
  PANTHEON_USER: armin@pantheon.inc
resources:
  cpus: 2
  memory: 8
  image_id: docker:pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel
volumes:
  /checkpoints: armin-rlp-checkpoints
run: |
  set -u
  for it in $ITEMS; do
    IFS=: read -r tag env base row seed step <<< "$it"
    if [ "$env" = reacher ]; then
      # reacher yaml naming: <row>_<base>_s<seed>.pt, snapshots <out>.pt.step<N>.pt
      src=/checkpoints/$PANTHEON_USER/$tag/actors/${row}_${base}_s${seed}.pt$([ "$step" = final ] && echo "" || echo ".step${step}.pt")
      dst_dir=/checkpoints/$PANTHEON_USER/${tag}-fixedimport/actors; mkdir -p "$dst_dir"
      dst=$dst_dir/${row}_${base}_s${seed}.pt
    else
      src=/checkpoints/$PANTHEON_USER/$tag/actors/g_${env}_${base}_${row}_s${seed}$([ "$step" = final ] && echo "" || echo "_step${step}").pt
      # DEST_TAG: stage several source tags (seed splits -s345/-s5) into ONE import tag per cell
      dtag=${DEST_TAG:-${tag}-fixedimport}
      dst_dir=/checkpoints/$PANTHEON_USER/$dtag/actors; mkdir -p "$dst_dir" "/checkpoints/$PANTHEON_USER/$dtag/values"
      dst=$dst_dir/g_${env}_${base}_${row}_s${seed}.pt
      # the row's co-trained critic: a snapshot's ck["value"] points at the training node's ~/gm path; the
      # rescue yaml's import fixup repaths it to values/<stem>_value.pt, so ship the row's final critic too
      vsrc=/checkpoints/$PANTHEON_USER/$tag/values/g_${env}_${base}_${row}_s${seed}_value.pt
      [ -f "$vsrc" ] && cp -f "$vsrc" "/checkpoints/$PANTHEON_USER/$dtag/values/" && echo "[stage] critic $(basename "$vsrc")" || echo "[stage] no critic file for ${row} s${seed} (embedded critic assumed)"
    fi
    if [ -f "$src" ]; then cp -f "$src" "$dst" && echo "[stage] $(basename "$src") -> ${dtag:-${tag}-fixedimport}/actors/$(basename "$dst")"; else echo "[stage] MISSING $src" >&2; fi
  done
  echo "[fixed-stage] done"
