# Dyna v2, stage 1 of an iteration: COLLECT with the deployed config-B planner
# at BOTH offsets (25 and 100), MIX 50/50 with the expert 0:8000 slice,
# FINE-TUNE the world model with a latent anchor, export ONE weights.pt +
# config.json to the volume. Stage 2 (caches -> TD -> config-B actors -> eval,
# per-task arrays) is the unified harness with CU_DYNA_WM pointing at the
# export (scripts/sky/dyna2/run_dyna2.sh chains the two).
#
# Differences from the shipped-WM builder (tworoom_matrix_20260727/sky/dyna_lewm.yaml):
#   collection planner = the CURRENT actors (ACTOR_TAG on the volume), not the
#   2026-08-05 open-loop actors; offsets 25 AND 100; anchored fine-tune
#   (ANCHOR_WEIGHT) with the native PLDM objective for the PLDM base; chained
#   iterations (ITER>1 collects with the post-Dyna actors against WM_SRC and
#   fine-tunes from WM_SRC).
name: dyna2-collect-ft

envs:
  BASE: lewm                  # lewm | pldm
  ITER: "1"
  ACTOR_TAG: rlp-cu-v2l05-20260902     # volume tag holding actors/ + values/ (3 finals)
  ACTOR_GLOB: "g_cube_lewm_unig_ctrl_a2.5_s*.pt"
  WM_SRC: ""                  # "" = base WM from the LFS stage; else a volume dir with one .pt + config.json
  OUT_TAG: rlp-cu-dyna2-lewm-it1-20260903
  NCALL: "12"                 # collection calls per (actor, offset), 50 episodes each
  OFFSETS: "25 100"
  SEEDBAND: "20000"
  EPHI: "8000"                # collect/expert episodes < EPHI; eval draws EPHI:10000 (stage 2)
  ANCHOR_WEIGHT: "1.0"
  FREEZE_ENCODER: "0"
  EPOCHS: "1"
  FT_LR: "1e-5"
  COLLECT_FROM_TAG: ""        # reuse this tag's onpolicy/ + collogs/ (ablations: fine-tune only)
  MAXPAR: "4"
  SMOKE: "0"
  WANDB_PROJECT: RLP
  WANDB_ENTITY: armin-sommer
  PANTHEON_USER: armin@pantheon.inc

secrets:
  WANDB_API_KEY: null
  GIT_TOKEN: null

resources:
  infra: kubernetes/Skypilot
  accelerators: H200:4
  cpus: 64+
  memory: 600+
  image_id: docker:pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel

volumes:
  /checkpoints: armin-rlp-checkpoints

config:
  kubernetes:
    pod_config:
      spec:
        nodeSelector:
          pantheon.inc/raid0: "enabled"
        volumes:
          - name: raid0
            hostPath:
              path: /mnt/raid0
              type: Directory
        containers:
          - volumeMounts:
              - mountPath: /mnt/raid0
                name: raid0

file_mounts:
  /tmp/dyna2/wm_finetune.py: ./scripts/sky/dyna2/overlays/wm_finetune.py
  /tmp/codex-overlays/lip.py: ./scripts/sky/overlays/lip.py

setup: |
  set -euo pipefail
  sudo apt-get update -qq || true
  sudo apt-get install -yqq git git-lfs zstd libegl1 libgl1 libglew-dev libosmesa6 patchelf >/dev/null 2>&1 || true
  cd ~
  if [ ! -d repo ]; then
    GIT_LFS_SKIP_SMUDGE=1 git clone -q --depth 1 --branch eval-sweep \
      "https://x-access-token:${GIT_TOKEN}@github.com/armin-sommer/Value_Metric_LeWM.git" repo
  fi
  cd ~/repo && git remote set-url origin https://github.com/armin-sommer/Value_Metric_LeWM.git
  echo "[repo] $(git rev-parse --short HEAD) on eval-sweep"
  cp /tmp/dyna2/wm_finetune.py stable-worldmodel/scripts/train/wm_finetune.py
  cp /tmp/codex-overlays/lip.py stable-worldmodel/stable_worldmodel/solver/lip.py
  pip install -q -e "$HOME/repo/stable-worldmodel[train,format]" \
    opencv-python-headless hdf5plugin hf_transfer wandb pylance \
    gymnasium-robotics "mujoco<3.12" dm_control ogbench pygame pymunk shapely 2>&1 | tail -2
  python3 -c 'import torch; n=torch.cuda.device_count(); assert n>=int("'"$MAXPAR"'"), n; print(f"[env] torch {torch.__version__} gpus {n}")'
  python3 -c "
  import os, wandb
  wandb.login(key=os.environ['WANDB_API_KEY'], relogin=True)
  r = wandb.init(project=os.environ['WANDB_PROJECT'], entity=os.environ['WANDB_ENTITY'],
                 name='dyna2-probe-'+os.environ['BASE'], job_type='probe', reinit=True)
  r.log({'probe': 1}); r.finish(); print('[wandb] verified')
  "
  # node-local scratch on raid0 (dataset + lances + fine-tune dir); ~ symlinks
  # raid0 hygiene + guard: the 46 GB h5, the expert lance and a ~2x mix need
  # ~250 GB; a node with a full raid0 must fail here, fast, not 40 min in.
  for d in /mnt/raid0/rlp-dyna2/rlp-cu-dyna2-*; do
    [ -d "$d" ] || continue
    [ -n "$(find "$d" -maxdepth 2 -mtime -2 -print -quit 2>/dev/null)" ] && continue
    echo "[janitor] rm stale $d"; rm -rf "$d" 2>/dev/null || true
  done
  FREE_GB=$(df -BG --output=avail /mnt/raid0 2>/dev/null | tail -1 | tr -dc '0-9')
  if [ "${FREE_GB:-0}" -lt 300 ]; then
    for d in /mnt/raid0/rlp-cache/* /mnt/raid0/rlp-runs/*; do
      [ -d "$d" ] || continue
      [ -n "$(find "$d" -maxdepth 2 -mtime -3 -print -quit 2>/dev/null)" ] && continue
      if [ -f "$d/build.lock" ]; then flock -n "$d/build.lock" true 2>/dev/null || continue; fi
      echo "[janitor] rm $d"; rm -rf "$d" 2>/dev/null || true
    done
    FREE_GB=$(df -BG --output=avail /mnt/raid0 2>/dev/null | tail -1 | tr -dc '0-9')
  fi
  [ "${FREE_GB:-0}" -ge 250 ] || { echo "[disk] raid0 has ${FREE_GB}GB free < 250GB on $(hostname); relaunch to land elsewhere" >&2; exit 1; }
  SCR=/mnt/raid0/rlp-dyna2/${OUT_TAG}; SHARED=/mnt/raid0/rlp-dyna2/shared
  mkdir -p $SCR/{gh/checkpoints,ga,gm,gl,dyna} $SHARED/gd
  chmod -R 777 $SCR $SHARED 2>/dev/null || true
  for d in gh ga gm gl dyna; do [ -e ~/$d ] || ln -s $SCR/$d ~/$d; done
  [ -e ~/gd ] || ln -s $SHARED/gd ~/gd          # dataset shared across jobs on this node
  [ "${SMOKE:-0}" = 1 ] && { rm -f ~/gd; mkdir -p $SCR/gd; ln -s $SCR/gd ~/gd; }   # smoke: 400-ep lance, keep private
  df -h /mnt/raid0 | tail -1
  # ---- world model to PLAN with and to INIT from (one .pt per dir)
  C=/checkpoints/${PANTHEON_USER}/lfs_stage/swm_checkpoints
  WMD=~/gh/checkpoints/${BASE}_cube; mkdir -p $WMD
  if [ -n "${WM_SRC:-}" ]; then SRC=$WM_SRC
  elif [ "$BASE" = lewm ]; then SRC=$C/ogbench_cube_single_v2WM
  else SRC=$C/PLDM_OgBench; fi
  [ -d "$SRC" ] || { echo "missing WM source $SRC" >&2; exit 1; }
  rm -f $WMD/*; cp -L "$SRC"/*.pt $WMD/; cp -L "$SRC"/config.json $WMD/
  [ "$(ls $WMD/*.pt | wc -l)" = 1 ] || { echo "WM dir must hold exactly one .pt"; ls -la $WMD; exit 1; }
  echo "[wm] planning/init WM from $SRC: $(ls $WMD)"
  # ---- dataset: HF h5, then the expert lance the mixer needs
  if ! ls ~/gd/*.h5 >/dev/null 2>&1; then
    cd ~/gd
    HF_HUB_ENABLE_HF_TRANSFER=1 python3 -c "from huggingface_hub import hf_hub_download; hf_hub_download('quentinll/lewm-cube','cube_single_expert.tar.zst',repo_type='dataset',local_dir='.')"
    tar --use-compress-program=unzstd -xf cube_single_expert.tar.zst && rm -f cube_single_expert.tar.zst
  fi
  cd ~/repo/stable-worldmodel
  export PYTHONPATH=$PWD STABLEWM_HOME=~/gh
  export HDF5_PLUGIN_PATH=$(python3 -c 'import hdf5plugin; print(hdf5plugin.PLUGIN_PATH)')
  H5=$(ls ~/gd/*.h5 | head -1)
  MAXEP=""; [ "${SMOKE:-0}" = 1 ] && MAXEP="--max-episodes 400"
  if [ ! -f ~/gd/expert.lance/.done ]; then
    exec 8>~/gd/lance.lock; flock 8
    if [ ! -f ~/gd/expert.lance/.done ]; then
      for TRY in 1 2; do
        rm -rf ~/gd/expert.lance
        if python3 ~/repo/Dyna/dyna_harness/h5_to_lance.py "$H5" ~/gd/expert.lance $MAXEP 2>&1 | tail -3 | grep -q H5_TO_LANCE_DONE; then
          touch ~/gd/expert.lance/.done; break
        fi
        echo "[lance] conversion attempt $TRY failed"; df -h /mnt/raid0 | tail -1; sleep 30
      done
    fi
    flock -u 8
    [ -f ~/gd/expert.lance/.done ] || { echo "expert lance conversion failed twice" >&2; exit 1; }
  fi
  df -h /mnt/raid0 | tail -1
  # ---- actors (+ tandem critics) from the volume; repath a final-won ck["value"]
  AR=/checkpoints/${PANTHEON_USER}/${ACTOR_TAG}
  ls $AR/actors/$ACTOR_GLOB | grep -v _step | head -3 | while read f; do cp "$f" ~/ga/; done
  cp $AR/values/*_value.pt ~/gm/ 2>/dev/null || true
  python3 - <<'PY'
  import glob, os, torch
  from stable_worldmodel.trm import load_metric
  n_fix = 0
  acts = sorted(glob.glob(os.path.expanduser('~/ga/*.pt')))
  assert len(acts) == 3, acts
  for f in acts:
      ck = torch.load(f, map_location='cpu', weights_only=False)
      v = ck.get('value'); ok = os.path.isfile(v) if isinstance(v, str) else False
      if not ok and not isinstance(v, str):
          try: load_metric(v, device='cpu'); ok = True
          except Exception: ok = False
      if not ok:
          stem = os.path.splitext(os.path.basename(f))[0]
          cand = os.path.expanduser(f'~/gm/{stem}_value.pt'); assert os.path.isfile(cand), cand
          ck['value'] = cand; torch.save(ck, f); n_fix += 1
      ta = ck.get('train_args', {})
      print(f"[actor] {os.path.basename(f)} amax={ta.get('amax')} md={ta.get('max_delta')} iters={ta.get('iters')} ac={ta.get('ac_weight')}", flush=True)
  print(f'[value-fixup] repathed {n_fix}/3')
  PY
  echo "[setup] dyna2 ready"

run: |
  set -uo pipefail
  echo "[node] $(hostname) | gpus: $(nvidia-smi --query-gpu=index,uuid --format=csv,noheader 2>/dev/null | tr '\n' ' ')"
  cd ~/repo/stable-worldmodel
  export PYTHONPATH=$PWD STABLEWM_HOME=~/gh HF_HOME=~/.cache/hf TQDM_DISABLE=1
  export OMP_NUM_THREADS=8 MKL_NUM_THREADS=8 MUJOCO_GL=egl PYOPENGL_PLATFORM=egl
  export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  export HDF5_PLUGIN_PATH=$(python3 -c 'import hdf5plugin; print(hdf5plugin.PLUGIN_PATH)')
  H5=$(ls ~/gd/*.h5 | head -1); EXPERT=~/gd/expert.lance
  WMD=~/gh/checkpoints/${BASE}_cube
  PERSIST=/checkpoints/${PANTHEON_USER}/${OUT_TAG}; mkdir -p $PERSIST/{logs,wm,onpolicy,collogs}
  # resume across preemptions: collected lances and per-call logs are on the
  # volume, not on node-local raid0 (5 recoveries x 15 h with nothing kept, 2026-09-04)
  if [ -n "${COLLECT_FROM_TAG:-}" ]; then
    SRCP=/checkpoints/${PANTHEON_USER}/${COLLECT_FROM_TAG}
    [ -d "$SRCP/onpolicy" ] || { echo "COLLECT_FROM_TAG has no onpolicy/: $SRCP" >&2; exit 1; }
    rmdir $PERSIST/onpolicy 2>/dev/null; ln -sfn $SRCP/onpolicy $PERSIST/onpolicy
    cp -n $SRCP/collogs/*.log $PERSIST/collogs/ 2>/dev/null || true
    echo "[collect] reusing collection from $COLLECT_FROM_TAG ($(ls $SRCP/onpolicy | wc -l) lances)"
  fi
  rm -rf ~/dyna/onp_*.lance 2>/dev/null; ln -sfn $PERSIST/onpolicy ~/dyna/onpolicy
  DRV=$PERSIST/logs/driver.log
  log(){ echo "[$(date -u +%m%d-%H:%M:%S)] $*" | tee -a "$DRV"; }
  ACTORS=$(ls ~/ga/*.pt); CALLS=${NCALL}; OFFS="${OFFSETS}"
  [ "${SMOKE:-0}" = 1 ] && { ACTORS=$(ls ~/ga/*.pt | head -1); CALLS=1; OFFS="25"; }
  SLOT=~/gl/slots; mkdir -p $SLOT
  acquire(){ local s; while :; do for s in $(seq 0 $((MAXPAR-1))); do mkdir "$SLOT/$s" 2>/dev/null && { echo $s; return; }; done; sleep 15; done; }
  log "=== DYNA2 collect+ft BASE=$BASE ITER=$ITER actors=$ACTOR_TAG wm=${WM_SRC:-base} out=$OUT_TAG anchor=$ANCHOR_WEIGHT freeze=$FREEZE_ENCODER"

  # ---------------- P1: on-policy collection, (actor x offset) lanes over MAXPAR GPUs
  a=0
  for ACT in $ACTORS; do
    for OFF in $OFFS; do
      (
        S=$(acquire)
        REC=$PERSIST/onpolicy/onp_a${a}_h${OFF}.lance
        for i in $(seq 0 $((CALLS-1))); do
          lg=$PERSIST/collogs/col_a${a}_h${OFF}_c${i}.log
          grep -q "kept=50 dropped=0" "$lg" 2>/dev/null && { grep -q "COLLECT a$a h$OFF c$i: OK" "$DRV" || log "COLLECT a$a h$OFF c$i: OK (resumed)"; continue; }
          SEED=$((SEEDBAND + ITER*100000 + OFF*100 + a*1000 + i))
          SWM_RECORD_PATH=$REC SWM_RECORD_OUTCOME=1 CUDA_VISIBLE_DEVICES=$S MUJOCO_EGL_DEVICE_ID=$S timeout 14400 \
          python3 scripts/plan/eval_wm.py --config-name cube seed=$SEED \
            eval.dataset_name="$H5" dataset.stats="$H5" ++bf16=true eval.img_size=224 \
            eval.goal_offset_steps=$OFF eval.eval_budget=$((2*OFF)) eval.num_eval=50 \
            "+eval.ep_range=0:${EPHI}" world.terminate_at_goal=False plan_config.receding_horizon=5 \
            policy="$WMD" solver=lip solver.batch_size=1 "solver.actor_path=$ACT" \
            output.filename="col_a${a}_h${OFF}_c${i}.txt" > "$lg" 2>&1
          rec=$(grep -h "\[record\]\|Recorded dataset" "$lg" | tail -1)
          if echo "$rec" | grep -q "kept=50 dropped=0"; then
            log "COLLECT a$a h$OFF c$i: OK $(echo "$rec" | grep -oE 'kept_success=[0-9]+')"
          else
            log "COLLECT a$a h$OFF c$i: FAIL"; tail -20 "$lg" | sed 's/^/  | /'
          fi
        done
        rmdir "$SLOT/$S"
      ) &
    done
    a=$((a+1))
  done
  wait
  NOK=$(grep "COLLECT.*OK" "$DRV" | sort -u | wc -l); NF=$(grep "COLLECT.*FAIL" "$DRV" | grep -v OK | wc -l)
  log "P1 collection: $NOK ok / $NF fail"
  [ "$NF" -le 2 ] || { log "collection FAILED"; exit 1; }
  ls -d $PERSIST/onpolicy/onp_*.lance | tee -a "$DRV"

  # ---------------- P2: 50/50 outcome-labelled mix vs the expert 0:EPHI slice
  MIX=~/dyna/mix_5050.lance
  EXHI=${EPHI}; [ "${SMOKE:-0}" = 1 ] && EXHI=400
  if [ ! -f "$MIX/.done" ]; then
    python3 ~/repo/Dyna/dyna_harness/build_dyna_mix.py --expert "$EXPERT" \
      --onpolicy $(ls -d $PERSIST/onpolicy/onp_*.lance) --out "$MIX" --onpolicy-frac 0.5 --expert-ep-hi "$EXHI" \
      2>&1 | tee ~/gl/mix.log | tail -8
    grep -q BUILD_MIX_DONE ~/gl/mix.log || { log "mix FAILED"; tail -30 ~/gl/mix.log; exit 1; }
    grep -q "\[split\] expert restricted" ~/gl/mix.log || { log "expert slice NOT restricted"; exit 1; }
    touch "$MIX/.done"
  fi
  cp ~/gl/mix.log $PERSIST/logs/; log "P2 mix done"

  # ---------------- P3: anchored fine-tune from the planning WM
  INITW=$(ls $WMD/*.pt | head -1)
  CFGNAME=lewm; EXPORT_CFG=$WMD/config.json
  if [ "$BASE" = pldm ]; then
    CFGNAME=pldm
    # eval stack loads pldm_cube as a LeWM-class model (identical parameter
    # names); export with that config so stage 2 needs no special casing
    EXPORT_CFG=~/repo/stable-worldmodel/checkpoints/PLDM_OgBench/config_lewm_target.json
    [ -f "$EXPORT_CFG" ] || { git -C ~/repo lfs pull -I "stable-worldmodel/checkpoints/PLDM_OgBench/config_lewm_target.json" >/dev/null 2>&1 || true; }
    [ -s "$EXPORT_CFG" ] && ! grep -q "oid sha256" "$EXPORT_CFG" || EXPORT_CFG=/checkpoints/${PANTHEON_USER}/lfs_stage/swm_checkpoints/PLDM_OgBench/config_lewm_target.json
    # ITER>1 WM_SRC dirs already carry the LeWM-target config: init the PLDM
    # class from it (names identical) and keep exporting LeWM-target
  fi
  FTD=~/gh/checkpoints/ft
  if [ ! -f "$FTD/weights_epoch_${EPOCHS}.pt" ]; then
    log "P3 fine-tune: cfg=$CFGNAME init=$INITW anchor=$ANCHOR_WEIGHT freeze=$FREEZE_ENCODER epochs=$EPOCHS lr=$FT_LR"
    INIT_WEIGHTS=$INITW ANCHOR_WEIGHT=$ANCHOR_WEIGHT FREEZE_ENCODER=$FREEZE_ENCODER EXPORT_CONFIG=$EXPORT_CFG \
    CUDA_VISIBLE_DEVICES=0 timeout 86400 python3 scripts/train/wm_finetune.py --config-name $CFGNAME \
      data=ogb data.dataset.name="$MIX" "data.dataset.keys_to_load=[pixels,action]" \
      "data.dataset.keys_to_cache=[action]" "data.dataset.keys_to_merge=null" \
      optimizer.lr=$FT_LR trainer.max_epochs=$EPOCHS trainer.devices=1 \
      output_model_name=ft subdir=ft +action_stats_pin=expert wandb.enabled=false \
      2>&1 | tee ~/gl/ft.log | grep -E "\[init-weights\]|\[anchor\]|\[freeze\]|\[lr-probe\]|\[loss-probe\]|\[grad-guard\]|\[export\]|Error|error" | tail -40
  fi
  cp ~/gl/ft.log $PERSIST/logs/ 2>/dev/null || true
  EP=$FTD/weights_epoch_${EPOCHS}.pt
  [ -f "$EP" ] || { log "fine-tune produced no weights"; tail -40 ~/gl/ft.log; exit 1; }
  rm -f $PERSIST/wm/*; cp "$EP" $PERSIST/wm/weights.pt; cp "$EXPORT_CFG" $PERSIST/wm/config.json
  python3 - "$PERSIST/wm/weights.pt" "$INITW" <<'PY'
  import sys, torch
  a = torch.load(sys.argv[1], map_location='cpu', weights_only=True); b = torch.load(sys.argv[2], map_location='cpu', weights_only=True)
  ka, kb = set(a), set(b)
  common = ka & kb
  import math
  d = sum((a[k].float()-b[k].float()).pow(2).sum().item() for k in common if a[k].shape == b[k].shape)
  n = sum(b[k].float().pow(2).sum().item() for k in common if a[k].shape == b[k].shape)
  print(f"[export] {len(ka)} tensors ({len(common)} shared with init); relative L2 drift from init = {math.sqrt(d/max(n,1e-9)):.4f}")
  PY
  printf 'base=%s\niter=%s\nactor_tag=%s\nwm_src=%s\nanchor=%s\nfreeze=%s\nepochs=%s\nncall=%s\noffsets=%s\n' \
    "$BASE" "$ITER" "$ACTOR_TAG" "${WM_SRC:-base}" "$ANCHOR_WEIGHT" "$FREEZE_ENCODER" "$EPOCHS" "$NCALL" "$OFFSETS" > $PERSIST/wm/PROVENANCE.txt
  ls -la $PERSIST/wm | tee -a "$DRV"
  log "DYNA2_COLLECT_FT_DONE $PERSIST/wm"
