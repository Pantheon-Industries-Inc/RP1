# Is RLP's TwoRoom PLDM h25 residual a COST problem or an OPTIMIZER problem?
# (2026-08-17)
#
# The campaign started from "value+CEM reaches 100.0 with the same critic, so
# the ~1.8 point gap to RLP's 98.2 is an optimizer gap". That premise is WRONG:
#   * LIPSolver deploys the critic named in the ACTOR checkpoint
#     (`load_metric(ck["value"])`) -- i.e. `--out-value`, the co-trained critic.
#   * The tworoom-pldm recipe profile sets freeze_critic_frac=0.8, so that
#     critic is live for 6,400 of 8,000 actor steps before freezing.
#   * value+CEM planned against `value_td`, the untouched offline TD teacher.
# The two planners were therefore never scored against the same cost, and a
# value-function explanation is fully live: the co-trained critic may have
# drifted worse than the teacher it warm-started from.
#
# This job crosses PLANNER x CRITIC on one node, one world model, one dataset
# split, so the two factors separate. No retraining -- the RLP actors and their
# co-trained critics are vendored in-tree.
#
#   A  CEM + TD teacher        -> reproduces the 100.0
#   B  CEM + co-trained critic -> if this DROPS to ~98, the critic is the fault
#   C  RLP + co-trained critic -> reproduces the 98.2 (the shipped configuration)
#   D  RLP + TD teacher        -> if this RISES to ~100, the critic is the fault
#
# Reading:
#   B low  & D high -> COST problem. Fix the critic (freeze it, or shorten
#                      co-training); the refiner is fine.
#   B high & D low  -> OPTIMIZER problem. The cost is sufficient and 9 rollouts
#                      of learned refinement cannot match 9,000 of sampling.
#   B low  & D low  -> the co-trained critic is better FOR THE REFINER than the
#                      teacher (they co-adapted) but worse in absolute terms;
#                      the pairing is what matters, not either part.
#
#   sky jobs launch scripts/sky/tworoom_cost_vs_optimizer.yaml -n tw-cost-opt \
#       --priority p2 -y --async

name: tw-cost-opt

envs:
  BASE: pldm
  SPLIT: "1"                # held-out: critic trains 0:8000, eval draws 8000:10000
  EVAL_SEEDS: "42 43 44"
  HORIZON: "25"
  EVAL_N: "50"
  EVAL_BATCH: "10"
  VALUE_STEPS: "6000"
  ACTOR_SEEDS: "0 1 2"
  ACTOR_DIR: assets/core/planner/tworoom/pldm/terminal_a1.8_m0.0_l1e-3
  SMOKE: "0"
  PANTHEON_USER: armin@pantheon.inc
  EXPERIMENT_TAG: tw-cost-opt-20260817

workdir: .

resources:
  accelerators: H200:1
  cpus: 20
  memory: 230
  image_id: docker:pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel
  labels:
    telemetry-contract: training-v1

volumes:
  /checkpoints: checkpoints

setup: |
  set -euo pipefail
  sudo apt-get update -qq >/dev/null 2>&1 || apt-get update -qq
  (sudo apt-get install -yqq curl git libegl1 libgl1 libosmesa6 >/dev/null 2>&1 \
    || apt-get install -yqq curl git libegl1 libgl1 libosmesa6 >/dev/null)
  curl -fsSL https://pixi.sh/install.sh | bash
  export PATH=$HOME/.pixi/bin:$PATH
  cd ~/sky_workdir
  pixi install -e default

run: |
  set -euo pipefail
  export PATH=$HOME/.pixi/bin:$PATH
  cd ~/sky_workdir
  export LD_LIBRARY_PATH=$PWD/.pixi/envs/default/lib:${LD_LIBRARY_PATH:-}
  export MUJOCO_GL=egl MUJOCO_EGL_DEVICE_ID=0
  export RLP_DATA_HOME=/tmp/rlp-data
  mkdir -p "$RLP_DATA_HOME"
  D=/checkpoints/$PANTHEON_USER/$EXPERIMENT_TAG
  mkdir -p "$D" && chmod 777 "$D"
  CD=$D/caches && mkdir -p "$CD"

  pixi run tool tool=fetch_dataset dataset=tworoom
  DATASET="$RLP_DATA_HOME/datasets/tworoom/tworoom.h5"
  [ -f "$DATASET" ] || { echo "tworoom h5 missing"; exit 1; }
  WM="$PWD/assets/core/world_model/${BASE}_tworoom"
  [ -d "$WM" ] || { echo "missing world model: $WM"; exit 1; }
  EVAL_MODEL="tworoom_pldm_h5"; [ "$BASE" = lejepa ] && EVAL_MODEL="tworoom_lewm_h5"

  if [ "$SPLIT" = 1 ]; then
    TRAIN_EPISODES=8000; RANGE='evaluation.episode_range="8000:10000"'
  else
    TRAIN_EPISODES=10000; RANGE=""
  fi
  NAME="tworoom_${BASE}_sp${SPLIT}"
  [ "$SMOKE" = 1 ] && { TRAIN_EPISODES=64; EVAL_N=2; EVAL_SEEDS=42; VALUE_STEPS=60; RANGE=""; ACTOR_SEEDS=0; NAME="${NAME}_smoke"; }

  # ---- the offline TD teacher, exactly the recipe the vcem shards used, so
  # arm A is directly comparable to the banked 100.0.
  SKIP="planner"
  [ -f "$CD/${NAME}_fs1.pt" ] && SKIP="$SKIP,cache"
  [ -f "$CD/${NAME}_fs5.pt" ] && SKIP="$SKIP,subsample"
  [ -f "$CD/${NAME}_actions.h5" ] && SKIP="$SKIP,actions"
  if [ ! -d "$D/value_td" ]; then
    pixi run train model=rlp wm="$WM" dataset="$DATASET" name="$NAME" \
      cache_directory="$CD" train_episodes=$TRAIN_EPISODES seed=0 \
      "skip=[$SKIP]" value.steps=$VALUE_STEPS \
      value.gamma=1.0 value.expectile=0.1 value.n_step=50
    RUN=$(ls -dt logs/*/* | head -1)
    rm -rf "$D/value_td"; cp -r "$RUN/checkpoints/value_td" "$D/value_td"
  fi
  [ -d "$D/value_td" ] || { echo "critic missing"; exit 1; }

  HOR="evaluation.goal_offset_steps=${HORIZON} evaluation.budget=$((HORIZON * 2))"

  run_eval () {   # run_eval <label> <seed> <overrides...>
    local label=$1 seed=$2; shift 2
    local out="$D/results_${label}_s${seed}.txt"
    if [ -s "$out" ]; then echo "===== SKIP $label seed=$seed (banked) ====="; return 0; fi
    echo "===== EVAL $label seed=$seed ====="
    pixi run eval model=$EVAL_MODEL runtime.seed=$seed evaluation.num_episodes=$EVAL_N "$@" \
      || { echo "[cell-fail] $label s$seed"; return 0; }
    local run=$(ls -dt logs/*/* | head -1)
    cp "$run"/metrics/*results*.txt "$out" 2>/dev/null || find "$run" -name '*.txt' -exec cp {} "$out" \;
    echo "----- RESULT $label seed=$seed -----"; cat "$out"
  }

  for ES in $EVAL_SEEDS; do
    # ---- A: CEM against the TD teacher (control; expect ~100.0)
    run_eval "A_cem_td" $ES $HOR $RANGE core/solver=cem \
      core.solver.batch_size=$EVAL_BATCH \
      core/value=metric "core.value.checkpoints=[$D/value_td]"

    for AS in $ACTOR_SEEDS; do
      ACTOR="$PWD/$ACTOR_DIR/s${AS}/planner.pt"
      COTRAIN=$(ls -d "$PWD/$ACTOR_DIR/s${AS}"/*_value 2>/dev/null | head -1)
      [ -f "$ACTOR" ] || { echo "missing actor $ACTOR"; exit 1; }
      [ -n "$COTRAIN" ] && [ -d "$COTRAIN" ] || { echo "missing co-trained critic for s${AS}"; exit 1; }

      # ---- B: CEM against the ACTOR'S co-trained critic. The decisive cell:
      # if a 9,000-rollout planner cannot reach 100 on this cost, the cost is
      # the binding constraint, not the refiner.
      run_eval "B_cem_cotrain_a${AS}" $ES $HOR $RANGE core/solver=cem \
        core.solver.batch_size=$EVAL_BATCH \
        core/value=metric "core.value.checkpoints=[$COTRAIN]"

      # ---- C: RLP as shipped (its own co-trained critic; expect ~98.2)
      run_eval "C_rlp_cotrain_a${AS}" $ES $HOR $RANGE core/solver=lip \
        core.solver.actor_path="$ACTOR" core.solver.value_path="$COTRAIN"

      # ---- D: RLP planning against the TD teacher instead
      run_eval "D_rlp_td_a${AS}" $ES $HOR $RANGE core/solver=lip \
        core.solver.actor_path="$ACTOR" core.solver.value_path="$D/value_td"

      # ---- SEARCH-COVERAGE ARMS. RLP deploys init_mode="zero", restarts=1,
      # n_steps=0: purely LOCAL descent from A=0, against CEM's 300x30
      # population. The residual failures are plausibly plans outside the basin
      # of zero -- which no clip or conditioning change can reach, and K is
      # fixed. _value_init already implements CEM's iteration-0 (argmin-E over
      # zero + iid-Gaussian + time-tiled candidates) and is switched OFF; its
      # own docstring names the tiled family as "the long-transport family the
      # zero-init refinement cannot reach when the value gradient is flat at
      # A=0". All arms below are DEPLOY-TIME ONLY -- same actor, no retraining.
      # Cost check: init_samples=64 -> ~90 forward-equivalents per decision
      # against CEM's 9,000, so the compute claim survives at ~100x.
      for NS in 16 64 256; do
        run_eval "E_rlp_vinit${NS}_a${AS}" $ES $HOR $RANGE core/solver=lip \
          core.solver.actor_path="$ACTOR" core.solver.value_path="$COTRAIN" \
          core.solver.init_mode=value core.solver.init_samples=$NS
      done
      # An MPPI polish (n_steps>0) and multi-restart were considered and
      # deliberately EXCLUDED: n_steps=5 at 300 samples is 1,500 rollouts per
      # decision, which would abandon the compute claim this cell exists to
      # defend, and restarts already measured a plateau on PushT. Value-init
      # is the coverage fix that stays inside the budget.
      # crosses the cost fix with the search fix, so the two are not confounded
      run_eval "I_rlp_vinit64_td_a${AS}" $ES $HOR $RANGE core/solver=lip \
        core.solver.actor_path="$ACTOR" core.solver.value_path="$D/value_td" \
        core.solver.init_mode=value core.solver.init_samples=64
    done
  done

  echo "===== SUMMARY ====="
  python3 - <<'PY'
  import glob, os, re, statistics as st, collections
  D = os.path.join("/checkpoints", os.environ["PANTHEON_USER"], os.environ["EXPERIMENT_TAG"])
  agg = collections.defaultdict(list)
  for f in sorted(glob.glob(os.path.join(D, "results_*.txt"))):
      m = re.match(r"results_(.+)_s(\d+)\.txt$", os.path.basename(f))
      if not m: continue
      txt = open(f, errors="replace").read()
      hits = re.findall(r"success_rate[^0-9]*([0-9.]+)", txt)
      if not hits: continue
      arm = re.sub(r"_a\d+$", "", m.group(1))       # pool actor seeds
      agg[arm].append(float(hits[-1]))
  print("arm,n,mean,sd,values")
  for arm in sorted(agg):
      v = agg[arm]
      sd = st.stdev(v) if len(v) > 1 else 0.0
      print(f"{arm},{len(v)},{st.mean(v):.2f},{sd:.2f}," + "/".join(f"{x:g}" for x in v))
  PY
