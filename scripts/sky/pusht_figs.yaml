# PushT figures: value heatmaps + BFS geodesics, CEM-vs-RLP videos, from a
# finished diagnostic tag. Outputs land in OUT (new volume) and are ALSO
# base64-dumped to the job log so they can be pulled without a volume mount.
name: pusht-figs
envs:
  DIAG_TAG: pusht-diag3-s0-20260908     # on /newcheckpoints
  ACTOR_TAG: pusht-v2l05-s0-20260902    # on /checkpoints (legacy)
  DRAW: "42"
  GRID: "40"
  PANTHEON_USER: armin@pantheon.inc
workdir: .
resources:
  cpus: 16
  memory: 64
  image_id: docker:pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel
volumes:
  /checkpoints: checkpoints
  /newcheckpoints: armin-rlp-checkpoints
setup: |
  set -euo pipefail
  sudo apt-get update -qq >/dev/null 2>&1 || apt-get update -qq || true
  (sudo apt-get install -yqq curl git libegl1 libgl1 libosmesa6 ffmpeg >/dev/null 2>&1 || apt-get install -yqq curl git libegl1 libgl1 libosmesa6 ffmpeg >/dev/null) || true
  curl -fsSL https://pixi.sh/install.sh | bash
  export PATH=$HOME/.pixi/bin:$PATH
  cd ~/sky_workdir && pixi install -e default
run: |
  set -euo pipefail
  export PATH=$HOME/.pixi/bin:$PATH; cd ~/sky_workdir
  export LD_LIBRARY_PATH=$PWD/.pixi/envs/default/lib:${LD_LIBRARY_PATH:-}
  export RLP_DATA_HOME=/tmp/rlp-data SDL_VIDEODRIVER=dummy MUJOCO_GL=egl
  mkdir -p $RLP_DATA_HOME
  pixi run tool tool=fetch_dataset dataset=pusht
  export H5=$RLP_DATA_HOME/datasets/pusht/pusht_expert_train.h5
  export DIAG=/newcheckpoints/$PANTHEON_USER/$DIAG_TAG ACTOR=/checkpoints/$PANTHEON_USER/$ACTOR_TAG
  export WM=$DIAG/lewm_pusht_official; [ -f $WM/weights.pt ] || WM=$ACTOR/lewm_pusht_official
  export OUT=/newcheckpoints/$PANTHEON_USER/pusht-figs-${DIAG_TAG}-d${DRAW}
  ls $DIAG | head -30; ls $ACTOR/train_checkpoints
  pixi run python scripts/pusht_diag/figures.py
  echo "== outputs"; ls -la $OUT
  for f in $OUT/*.png $OUT/*.mp4 $OUT/INDEX.md $OUT/summary.json; do
    echo "[b64:$(basename $f)]"; base64 -w0 "$f"; echo; echo "[/b64]"
  done
