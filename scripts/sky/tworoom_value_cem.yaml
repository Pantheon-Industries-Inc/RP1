# TwoRoom value+CEM rerun (2026-08-16) — reproduces the `value CEM` row of
# docs/replication/RESULTS_REPLICATION_20260814.md (LeJEPA 100.0/96.0,
# PLDM 100.0/89.3) on the clean-tree pipeline.
#
# One job = one (base x eval draw) shard: dataset -> latent caches -> offline
# quasimetric critic (value_td, the tworoom recipe: gamma 1.0, expectile 0.1,
# n-step 50, 6k steps) -> CEM planning against that critic at h25 and h100,
# 50 episodes. Each shard owns its own tag directory, so shards never race on
# a shared cache and any one of them can be relaunched on its own.
#
#   sky jobs launch scripts/sky/tworoom_value_cem.yaml -n vcem-tw-lejepa-42 \
#       --priority p2 --env BASE=lejepa --env EVAL_SEEDS=42 \
#       --env EXPERIMENT_TAG=vcem-tw-lejepa-e42-20260816 -y
#
# Protocol: held-out by default (SPLIT=1 -> critic trains on episodes 0:8000,
# evaluation draws 8000:10000), matching the replication table. SPLIT=0 gives
# the shipped full-pool TwoRoom contract instead.

name: vcem-tw

envs:
  BASE: lejepa             # lejepa | pldm
  SPLIT: "1"               # 1 = held-out (train 0:8000, eval 8000:10000)
  EVAL_SEEDS: "42"         # report draws; shard one per job for parallelism
  HORIZONS: "25 100"
  EVAL_N: "50"
  # Environments planned per CEM solve. The eval runs all 50 episodes in
  # lockstep (num_envs = num_episodes) and the solver chunks them; the stock
  # default of 1 issues 50 sequential solves per planning step (~20 s each on
  # an H200) and leaves the GPU idle. The producing campaign used 10.
  EVAL_BATCH: "10"
  VALUE_STEPS: "6000"
  SMOKE: "0"               # 1 = tiny end-to-end path check
  CACHE_TAG: ""            # reuse another tag's caches (default: own tag)
  PANTHEON_USER: armin@pantheon.inc
  EXPERIMENT_TAG: vcem-tw

workdir: .

resources:
  accelerators: H200:1
  cpus: 20
  memory: 230
  image_id: docker:pytorch/pytorch:2.6.0-cuda12.4-cudnn9-devel
  labels:
    telemetry-contract: training-v1

volumes:
  /checkpoints: checkpoints

setup: |
  set -euo pipefail
  sudo apt-get update -qq >/dev/null 2>&1 || apt-get update -qq
  (sudo apt-get install -yqq curl git libegl1 libgl1 libosmesa6 >/dev/null 2>&1 \
    || apt-get install -yqq curl git libegl1 libgl1 libosmesa6 >/dev/null)
  curl -fsSL https://pixi.sh/install.sh | bash
  export PATH=$HOME/.pixi/bin:$PATH
  cd ~/sky_workdir
  pixi install -e default

run: |
  set -euo pipefail
  export PATH=$HOME/.pixi/bin:$PATH
  cd ~/sky_workdir
  export LD_LIBRARY_PATH=$PWD/.pixi/envs/default/lib:${LD_LIBRARY_PATH:-}
  # EGL only, pinned render index (osmesa silently costs points).
  export MUJOCO_GL=egl MUJOCO_EGL_DEVICE_ID=0
  export RLP_DATA_HOME=/tmp/rlp-data
  mkdir -p "$RLP_DATA_HOME"
  D=/checkpoints/$PANTHEON_USER/$EXPERIMENT_TAG
  mkdir -p "$D" && chmod 777 "$D"
  CD=/checkpoints/$PANTHEON_USER/${CACHE_TAG:-$EXPERIMENT_TAG}/caches && mkdir -p "$CD"

  case $BASE in lejepa|pldm) ;; *) echo "unknown BASE=$BASE"; exit 1;; esac

  # The authors' TwoRoom pool (10,000 episodes) stores the agent position as
  # `pos_agent`, so evaluation runs through the *_h5 roots.
  pixi run tool tool=fetch_dataset dataset=tworoom
  DATASET="$RLP_DATA_HOME/datasets/tworoom/tworoom.h5"
  [ -f "$DATASET" ] || { echo "tworoom h5 missing"; find "$RLP_DATA_HOME/datasets/tworoom" -maxdepth 2; exit 1; }
  WM="$PWD/assets/core/world_model/${BASE}_tworoom"
  [ -d "$WM" ] || { echo "missing world model: $WM"; exit 1; }
  EVAL_MODEL="tworoom_lewm_h5"; [ "$BASE" = pldm ] && EVAL_MODEL="tworoom_pldm_h5"
  VALUE_EXTRA="value.gamma=1.0 value.expectile=0.1 value.n_step=50"

  if [ "$SPLIT" = 1 ]; then
    TRAIN_EPISODES=8000
    RANGE='evaluation.episode_range="8000:10000"'
  else
    TRAIN_EPISODES=10000
    RANGE=""
  fi
  NAME="tworoom_${BASE}_sp${SPLIT}"

  if [ "$SMOKE" = 1 ]; then
    TRAIN_EPISODES=64; EVAL_N=2; EVAL_SEEDS=42; HORIZONS=25
    VALUE_STEPS=60; RANGE=""; NAME="${NAME}_smoke"
  fi

  # ------------------------------------------------- caches + critic (once per job)
  SKIP="planner"
  [ -f "$CD/${NAME}_fs1.pt" ] && SKIP="$SKIP,cache"
  [ -f "$CD/${NAME}_fs5.pt" ] && SKIP="$SKIP,subsample"
  [ -f "$CD/${NAME}_actions.h5" ] && SKIP="$SKIP,actions"

  if [ ! -d "$D/value_td" ]; then
    pixi run train model=rlp wm="$WM" dataset="$DATASET" name="$NAME" \
      cache_directory="$CD" train_episodes=$TRAIN_EPISODES seed=0 \
      "skip=[$SKIP]" value.steps=$VALUE_STEPS $VALUE_EXTRA
    RUN=$(ls -dt logs/*/* | head -1)
    rm -rf "$D/value_td"; cp -r "$RUN/checkpoints/value_td" "$D/value_td"
  fi
  [ -d "$D/value_td" ] || { echo "critic missing after training"; exit 1; }

  # ------------------------------------------------------------------------ evaluate
  run_eval () {  # run_eval <label> <seed> <overrides...>
    local label=$1 seed=$2; shift 2
    local out="$D/results_${label}_s${seed}.txt"
    if [ -s "$out" ]; then echo "===== SKIP $label seed=$seed (banked) ====="; return 0; fi
    echo "===== EVAL $label seed=$seed ====="
    pixi run eval model=$EVAL_MODEL runtime.seed=$seed evaluation.num_episodes=$EVAL_N "$@"
    local run=$(ls -dt logs/*/* | head -1)
    cp "$run"/metrics/*results*.txt "$out" 2>/dev/null || find "$run" -name '*.txt' -exec cp {} "$out" \;
    echo "----- RESULT $label seed=$seed -----"; cat "$out"
  }

  for ES in $EVAL_SEEDS; do
    for H in $HORIZONS; do
      case $H in
        25)  HOR="evaluation.goal_offset_steps=25 evaluation.budget=50";;
        100) HOR="evaluation.goal_offset_steps=100 evaluation.budget=200";;
        *) echo "unknown horizon $H"; exit 1;;
      esac
      # $RANGE / $HOR are deliberately unquoted: they expand to whole hydra
      # overrides. RANGE carries literal quotes so hydra reads "8000:10000"
      # as a string rather than choking on the colon.
      run_eval "cem_value_h${H}" $ES $HOR $RANGE core/solver=cem \
        core.solver.batch_size=$EVAL_BATCH \
        core/value=metric "core.value.checkpoints=[$D/value_td]"
    done
  done
  echo "VCEM_DONE base=$BASE split=$SPLIT seeds=$EVAL_SEEDS tag=$EXPERIMENT_TAG"
