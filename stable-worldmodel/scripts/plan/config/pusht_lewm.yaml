defaults:
  - launcher: local
  - solver: cem
  - _self_

world:
  env_name: swm/PushT-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # set from eval_budget in eval_wm.py

seed: 42
policy: lewm_pusht_official

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action

# evaluation from dataset (replay play trajectories)
eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: pusht_expert_train.h5
  callables:
    # -- set state (agent + block pose at start row)
    - method: _set_state
      args:
        state:
          value: state
    # -- set goal state (agent + block pose at start+offset row)
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

output:
  filename: pusht_lewm_results.txt
