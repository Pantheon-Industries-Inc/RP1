# Reactive PWM-style policy (stable_worldmodel.solver.pwm.PWMSolver).
# No sampling, no refinement: one encoder pass + one MLP pass per action block.
#
# fill: how the plan tail is produced when the MPC executes more than one block
#   before replanning (see the module docstring).
#     imagine -> roll the policy forward through the world model, H rollouts
#     repeat  -> hold the first block, ZERO rollouts but open loop
# For the purely reactive regime set plan_config.receding_horizon=1: only the
# first block is executed, so no world-model rollout happens at all.
_target_: stable_worldmodel.solver.PWMSolver
model: ???
actor_path: ???
fill: imagine
batch_size: 1
device: "cuda"
seed: ${seed}
