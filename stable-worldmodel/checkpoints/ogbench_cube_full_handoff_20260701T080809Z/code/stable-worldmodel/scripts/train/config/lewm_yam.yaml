defaults:
  - _self_
  - launcher: local
  - data: yam_real

output_model_name: yam_swm_lewm_mosaic224_vitb_proprio_decoder
subdir: ${hydra:job.id}

num_workers: 12
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: base
embed_dim: 768
encoder_resnet9: False
train_value_function: False
projector_loss_weight: 1e-3
dump_object: True

trainer:
  max_epochs: 1000
  max_steps: 450000
  devices: 1
  accelerator: gpu
  precision: bf16-mixed
  gradient_clip_val: 1.0
  limit_val_batches: 0
  log_every_n_steps: 25

loader:
  batch_size: 128
  num_workers: ${num_workers}
  drop_last: True
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True
  shuffle: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3
  scheduler_interval: step

wm:
  history_size: 3
  num_preds: 1

model:
  _target_: stable_worldmodel.wm.lewm.LeWM
  proprio_key: observation
  encoder:
    _target_: stable_pretraining.backbone.utils.vit_hf
    size: ${encoder_scale}
    patch_size: ${patch_size}
    image_size: ${img_size}
    pretrained: false
    use_mask_token: false
  predictor:
    _target_: stable_worldmodel.wm.lewm.module.Predictor
    num_frames: ${wm.history_size}
    input_dim: ${embed_dim}
    hidden_dim: ${embed_dim}
    output_dim: ${embed_dim}
    depth: 6
    heads: 12
    mlp_dim: 3072
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
  action_encoder:
    _target_: stable_worldmodel.wm.lewm.module.Embedder
    input_dim: ???
    emb_dim: ${embed_dim}
  projector:
    _target_: stable_worldmodel.wm.lewm.module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
  pred_proj:
    _target_: stable_worldmodel.wm.lewm.module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
  proprio_encoder:
    _target_: stable_worldmodel.wm.lewm.module.MLP
    input_dim: 14
    output_dim: ${embed_dim}
    hidden_dim: 512
  state_fusion:
    _target_: stable_worldmodel.wm.lewm.module.MLP
    input_dim: 1536
    output_dim: ${embed_dim}
    hidden_dim: 2048
  proprio_head:
    _target_: stable_worldmodel.wm.lewm.module.MLP
    input_dim: ${embed_dim}
    output_dim: 14
    hidden_dim: 512
  decoder:
    _target_: stable_worldmodel.wm.lewm.PatchDecoder
    input_dim: ${embed_dim}
    hidden_dim: 512
    image_size: ${img_size}
    patch_size: ${patch_size}
    out_channels: 3
    depth: 4
    heads: 8
    mlp_dim: 2048
    dropout: 0.0

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
  reconstruction:
    weight: 0.05
  proprio:
    weight: 0.01

diagnostics:
  every_n_steps: 100

timed_eval:
  enabled: true
  interval_seconds: 3600
  run_at_start: true
  first_step: 1000
  num_clips: 2
  fps: 4
  max_val_batches: 128
  show_pred: true

checkpoint:
  epoch_interval: 0
  every_n_train_steps: 10000
