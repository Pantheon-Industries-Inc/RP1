<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OGBench Cube Offline Trajectories</title>
    <style>
      body {
        margin: 24px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f4;
        color: #171717;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 16px;
      }
      h2 {
        font-size: 16px;
        margin: 28px 0 10px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
        align-items: start;
      }
      figure {
        margin: 0;
        padding: 12px;
        background: #fff;
        border: 1px solid #d9d9d2;
        border-radius: 6px;
      }
      img,
      video {
        width: 100%;
        image-rendering: pixelated;
        background: #eee;
      }
      figcaption {
        margin-top: 8px;
        font-size: 13px;
      }
      .wide {
        max-width: 1160px;
      }
    </style>
  </head>
  <body>
    <h1>OGBench Cube Offline Trajectories</h1>

    <h2>Static Contact Sheet</h2>
    <figure class="wide">
      <img src="ogbench_cube_contact_sheet.png" alt="OGBench cube contact sheet" />
      <figcaption>Eight sampled frames from 1-cube, 2-cube, and 3-cube offline trajectories.</figcaption>
    </figure>

    <h2>Animated GIFs</h2>
    <div class="grid">
      <figure>
        <img src="ogbench_1cube_offline_trajectory.gif" alt="1 cube animated trajectory" />
        <figcaption>1 cube</figcaption>
      </figure>
      <figure>
        <img src="ogbench_2cube_offline_trajectory.gif" alt="2 cube animated trajectory" />
        <figcaption>2 cube</figcaption>
      </figure>
      <figure>
        <img src="ogbench_3cube_offline_trajectory.gif" alt="3 cube animated trajectory" />
        <figcaption>3 cube</figcaption>
      </figure>
    </div>

    <h2>Side-By-Side Comparison</h2>
    <figure class="wide">
      <img src="ogbench_cube_1v2v3_side_by_side.gif" alt="Side-by-side animated cube comparison" />
      <figcaption>1-cube, 2-cube, and 3-cube clips shown together.</figcaption>
    </figure>

    <h2>Original MP4s</h2>
    <div class="grid">
      <figure>
        <video src="ogbench_1cube_offline_trajectory.mp4" controls loop muted></video>
        <figcaption>1 cube MP4</figcaption>
      </figure>
      <figure>
        <video src="ogbench_2cube_offline_trajectory.mp4" controls loop muted></video>
        <figcaption>2 cube MP4</figcaption>
      </figure>
      <figure>
        <video src="ogbench_3cube_offline_trajectory.mp4" controls loop muted></video>
        <figcaption>3 cube MP4</figcaption>
      </figure>
    </div>
  </body>
</html>
